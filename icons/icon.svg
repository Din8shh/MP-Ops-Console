    <path d="M160 280 Q256 232 352 280" stroke="#1FAE43" stroke-width="14" opacity=".5"/>
  </g>
  <path d="M256 92c0 0-62 72-62 116a62 62 0 0 0 124 0c0-44-62-116-62-116Z" fill="#F5821F"/>
  <circle cx="234" cy="206" r="14" fill="#FBEDDF" opacity=".55"/>
</svg>
