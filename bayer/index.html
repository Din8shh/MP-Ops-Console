<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner view · Bayer</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens — the console's (CLAUDE.md → Tokens). Health: assigned = Active green, awaiting = Idle amber. */
  :root{ --ink:#1B1A17; --ink2:#6E6A62; --ink3:#9C988F; --line:#E9E6DF; --soft:#F2F0EB; --bg:#F6F5F2; --card:#fff;
         --accent:#D96A12; --accentBg:#FDF1E6;
         --ok:#15A24A; --okInk:#0F7A37; --okBg:#E8F6EE; --wait:#E0A008; --waitInk:#8A6100; --waitBg:#FDF5DD; --none:#D8D4CA; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans',system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  body{ min-height:100dvh; display:flex; flex-direction:column; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .muted{ color:var(--ink2); }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* header: who · page · scope, then the two tabs */
  header{ background:#fff; border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 12px) 20px 0; position:sticky; top:0; z-index:5; }
  .hrow{ display:flex; align-items:flex-start; gap:12px; max-width:1180px; margin:0 auto; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }
  h1{ font-size:20px; margin:2px 0 0; font-weight:700; line-height:1.25; }
  .scope{ font-size:12.5px; color:var(--ink2); margin-top:2px; }
  .grow{ flex:1; min-width:0; }
  .hside{ display:flex; align-items:center; gap:12px; }
  .stamp{ font-size:12px; color:var(--ink2); text-align:right; line-height:1.35; }
  .stamp b{ color:var(--ink); font-weight:600; }
  .stamp.stale b{ color:#DC3A2B; }
  .btn{ color:var(--ink2); background:#fff; border:1.5px solid var(--line); border-radius:9px; padding:8px 14px; min-height:44px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn:hover{ border-color:#D8D4CA; color:var(--ink); }
  .btn.sm{ min-height:36px; padding:6px 12px; font-size:12.5px; }
  .tabs{ display:flex; gap:4px; max-width:1180px; margin:8px auto 0; }
  .tab{ font-size:14px; font-weight:600; color:var(--ink2); background:none; border:none; border-bottom:3px solid transparent; padding:10px 12px; min-height:46px; cursor:pointer; }
  .tab[aria-current="page"]{ color:var(--ink); border-bottom-color:var(--accent); font-weight:700; }
  .tab .n{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink2); margin-left:4px; font-weight:500; }

  main{ flex:1; width:100%; max-width:1180px; margin:0 auto; padding:18px 20px 40px; }
  .lead{ font-size:13.5px; color:var(--ink2); margin:0 0 14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .sec{ margin-top:26px; scroll-margin-top:130px; }   /* clears the sticky header when a filter jumps to the list */
  .sechead{ display:flex; align-items:baseline; gap:10px; margin:0 0 10px; flex-wrap:wrap; }
  .sechead h2{ font-size:15.5px; margin:0; }
  .sechead .sub{ font-size:12.5px; color:var(--ink2); }
  .sechead .end{ margin-left:auto; }

  /* 1 · status: the "good or not" card */
  .status{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr); gap:28px; padding:20px 22px; border-left:4px solid var(--ok); }
  .status.low{ border-left-color:var(--wait); }
  .big{ font-size:34px; font-weight:700; font-family:'IBM Plex Mono',monospace; line-height:1.1; }
  .big small{ font-size:18px; color:var(--ink2); font-weight:500; }
  .bigLbl{ font-size:14px; font-weight:600; margin-top:4px; }
  .bigNote{ font-size:12.5px; color:var(--ink2); margin-top:2px; }
  .sbar{ display:flex; gap:2px; height:12px; border-radius:6px; overflow:hidden; background:var(--soft); margin-top:14px; }
  .sbar i{ display:block; height:100%; }
  .sbar .a{ background:var(--ok); } .sbar .w{ background:var(--wait); }
  .key{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-top:8px; }
  .key span::before{ content:''; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:0; background:var(--k); }
  .stages{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; align-self:center; }
  .stages li{ position:relative; padding:0 10px 0 0; }
  .stages li + li{ padding-left:14px; border-left:1px solid var(--line); }
  .stages .sl{ font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); }
  .stages .sv{ font-size:24px; font-weight:700; font-family:'IBM Plex Mono',monospace; margin-top:4px; }
  .stages .sn{ font-size:12px; color:var(--ink2); margin-top:2px; }
  .stages .off .sv{ color:var(--ink3); }

  /* 2 · by state */
  .states{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .stc{ padding:14px 16px; text-align:left; cursor:pointer; border:1px solid var(--line); width:100%; }
  .stc:hover{ border-color:#D8D4CA; }
  .stc[aria-pressed="true"]{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .stc .t{ display:flex; align-items:baseline; gap:8px; }
  .stc .nm{ font-size:14.5px; font-weight:700; }
  .stc .v{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; }
  .stc .v small{ color:var(--ink2); font-weight:500; }
  .stc .sbar{ height:8px; margin-top:10px; }
  .stc .ft{ font-size:12px; color:var(--ink2); margin-top:7px; }

  /* 3 · districts still waiting: a sorted horizontal bar list */
  .dlist{ padding:6px 0; }
  .drow{ display:grid; grid-template-columns:minmax(150px,220px) minmax(0,1fr) 150px; gap:14px; align-items:center; width:100%;
         background:none; border:none; text-align:left; padding:8px 18px; min-height:44px; cursor:pointer; color:inherit; }
  .drow:hover{ background:#FAF9F6; }
  .drow[aria-pressed="true"]{ background:var(--accentBg); }
  .drow .nm{ font-size:13.5px; font-weight:600; }
  .drow .wh{ font-size:11.5px; color:var(--ink2); }
  .drow .track{ display:flex; gap:2px; height:10px; }
  .drow .track i{ display:block; height:100%; border-radius:2px; }
  .drow .fig{ font-size:12.5px; text-align:right; }
  .drow .fig b{ font-family:'IBM Plex Mono',monospace; }
  .done{ color:var(--okInk); font-weight:600; }
  .more{ display:block; width:100%; background:none; border:none; border-top:1px solid var(--soft); color:var(--accent); font-weight:600; font-size:13px; padding:12px; min-height:44px; cursor:pointer; }

  /* 4 · the list */
  .filters{ display:flex; flex-wrap:wrap; gap:8px; }
  select, input[type=search]{ font:inherit; font-size:13.5px; color:var(--ink); background:#fff; border:1.5px solid var(--line); border-radius:9px; padding:8px 10px; min-height:44px; outline:none; }
  select:focus, input[type=search]:focus{ border-color:var(--accent); }
  input[type=search]{ flex:1; min-width:200px; }
  .fstate{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink2); margin:10px 0; min-height:28px; }
  .link{ background:none; border:none; color:var(--accent); font-weight:600; font-size:12.5px; padding:6px 4px; cursor:pointer; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink2); padding:10px 14px; border-bottom:1px solid var(--line); background:#FBFAF8; position:sticky; top:0; }
  td{ padding:10px 14px; border-bottom:1px solid var(--soft); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover td{ background:#FCFBF9; }
  .tl{ font-weight:600; }
  .ts{ font-size:12px; color:var(--ink2); margin-top:1px; }
  .tel{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink2); text-decoration:none; }
  .tel:hover{ color:var(--accent); text-decoration:underline; }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; border-radius:20px; padding:3px 9px; white-space:nowrap; }
  .chip.ok{ color:var(--okInk); background:var(--okBg); }
  .chip.wait{ color:var(--waitInk); background:var(--waitBg); }
  .tblwrap{ overflow:hidden; }
  .cards{ display:none; }
  .empty, .msg{ padding:30px 20px; text-align:center; color:var(--ink2); font-size:13.5px; }
  .msg .btn{ margin-top:12px; }
  .skel{ height:14px; border-radius:7px; background:linear-gradient(90deg,var(--soft),#F8F7F4,var(--soft)); background-size:200% 100%; margin:10px 0; }
  @media (prefers-reduced-motion:no-preference){ .skel{ animation:sk 1.2s linear infinite; } @keyframes sk{ to{ background-position:-200% 0; } } }

  /* field officers */
  .kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .kpi{ padding:14px 16px; }
  .kpi .l{ font-size:12px; font-weight:600; color:var(--ink2); }
  .kpi .v{ font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; margin-top:4px; }
  .kpi .v small{ font-size:15px; color:var(--ink2); font-weight:500; }
  .kpi .n{ font-size:12px; color:var(--ink2); margin-top:2px; }
  .grp + .grp{ border-top:1px solid var(--line); }
  .ghead{ display:flex; align-items:center; gap:10px; padding:12px 16px; background:#FBFAF8; }
  .ghead .nm{ font-weight:700; font-size:13.5px; }
  .ghead .ct{ margin-left:auto; font-size:12px; color:var(--ink2); }
  .forow{ display:grid; grid-template-columns:minmax(160px,240px) 120px minmax(0,1fr); gap:14px; padding:10px 16px; border-top:1px solid var(--soft); font-size:13px; align-items:baseline; }
  .call{ display:none; }

  footer{ font-size:11px; color:var(--ink2); text-align:center; padding:14px 16px calc(env(safe-area-inset-bottom) + 14px); }

  /* PIN gate */
  #gate{ position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:var(--bg); padding:16px; }
  #gate .box{ width:340px; max-width:100%; background:#fff; border:1px solid var(--line); border-radius:16px; padding:30px 28px; box-shadow:0 12px 40px rgba(0,0,0,.08); text-align:center; }
  #gate .ttl{ font-size:20px; font-weight:700; margin-top:6px; }
  #pin{ margin-top:16px; width:100%; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:30px; letter-spacing:.5em; padding:12px 0 12px .5em; border:1.5px solid var(--line); border-radius:10px; outline:none; color:var(--ink); }
  #pin:focus{ border-color:var(--accent); }
  #err{ font-size:12px; color:#DC3A2B; margin-top:10px; min-height:15px; font-weight:600; }
  #gate .note{ font-size:11.5px; color:var(--ink2); margin-top:14px; line-height:1.4; }
  #app{ display:none; }

  /* ── phone: one column, status first, cards instead of the table, 44px targets, 16px fields ── */
  @media (max-width:820px){
    input, select{ font-size:16px !important; }
    header{ padding:calc(env(safe-area-inset-top) + 10px) 16px 0; position:static; }   /* a sticky header would hold a fifth of a phone screen */
    .sec{ scroll-margin-top:12px; }
    .btn.sm{ min-height:44px; }
    h1{ font-size:18px; }
    .hrow .stamp{ display:none; }
    .mstamp{ display:block !important; }
    main{ padding:14px 16px 32px; }
    .status{ grid-template-columns:1fr; gap:18px; padding:16px; }
    .big{ font-size:30px; }
    /* the first two stages restate the headline above them; the phone keeps only the two still to come */
    .stages li.rep{ display:none; }
    .stages{ grid-template-columns:repeat(2,minmax(0,1fr)); border-top:1px solid var(--line); padding-top:14px; }
    .stages li:nth-child(3){ padding-left:0; border-left:none; }
    .drow{ grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"nm fig" "bar bar"; gap:6px 10px; padding:10px 16px; }
    .drow > div:first-child{ grid-area:nm; } .drow .track{ grid-area:bar; } .drow .fig{ grid-area:fig; }
    .filters select{ flex:1 1 calc(50% - 4px); min-width:0; }
    input[type=search]{ flex:1 1 100%; min-width:0; }
    .tblwrap{ display:none; }
    .cards{ display:grid; gap:10px; }
    .lc{ padding:14px 14px 6px; }
    .lc .top{ display:flex; gap:10px; align-items:flex-start; }
    .lc .nm{ font-weight:700; font-size:15px; }
    .lc .wh{ font-size:12px; color:var(--ink2); margin-top:2px; }
    .lc .facts{ display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; margin:10px 0 4px; }
    .lc .facts dt{ color:var(--ink2); } .lc .facts dd{ margin:0; min-width:0; }
    .prow{ display:flex; align-items:center; gap:10px; border-top:1px solid var(--soft); padding:4px 0; min-height:52px; }
    .prow .r{ font-size:11.5px; color:var(--ink2); width:30px; flex-shrink:0; font-weight:600; }
    .prow .who{ flex:1; min-width:0; font-size:13.5px; }
    .prow .who .tel{ display:block; }
    .call{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:44px; min-height:44px; padding:0 14px; border-radius:10px;
           border:1.5px solid #F4D9C1; color:var(--accent); font-weight:700; font-size:13px; text-decoration:none; background:#fff; }
    .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .ghead{ padding:12px 14px; }
    .ghead > .tel{ display:none; }   /* the Call button carries the CCM's number on a phone */
    .ghead .ct{ white-space:nowrap; }
    .forow{ grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"who call" "locs locs"; gap:4px 10px; padding:8px 14px; }
    .forow .who{ grid-area:who; } .forow .locs{ grid-area:locs; font-size:12.5px; color:var(--ink2); } .forow .num{ display:none; }
    .forow .call{ grid-area:call; }
    .tab{ flex:1; }
  }
  @media (max-width:360px){
    .stages .sv{ font-size:20px; }
    .big{ font-size:26px; }
  }
</style>
</head>
<body>

<!-- The Bayer partner page. Deliberately SELF-CONTAINED: it loads nothing from the main console (no index.html,
     no machines.js, no internal sheet ids), so its source carries one PIN — Bayer's — and reads only Bayer's own
     workbook. See CLAUDE.md → Partner pages. -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTtl">
  <div class="box">
    <div class="eyebrow">Partner view</div>
    <div class="ttl" id="gateTtl">Enter access PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="Access PIN">
    <div id="err"></div>
    <div class="note">Access expires after 30 minutes of inactivity.</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hrow">
      <div class="grow">
        <div class="eyebrow">Partner view · Bayer</div>
        <h1 id="ttl">Machine deployment</h1>
        <div class="scope" id="scope">UPL machines for Bayer</div>
        <div class="scope mstamp" id="mstamp" style="display:none"></div>
      </div>
      <div class="hside">
        <div class="stamp" id="stamp" aria-live="polite"></div>
        <button class="btn" id="logout" type="button">Log out</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Pages">
      <button class="tab" type="button" data-tab="loc">Deployment</button>
      <button class="tab" type="button" data-tab="fo">Field officers</button>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer>Built with tokens, Powered by Claude. By din8sh.</footer>
</div>

<script>
/* Soft client-side gate, same model as the main console: a SHA-256 of the PIN, checked in the browser. It stops
   casual viewing; it is not real security. The main console hands a Bayer login over to this page by writing
   SKEY = {h, at} into sessionStorage (same origin, same tab) before redirecting, so the PIN is asked once. */
const GATE = {
  HASH: '0f7afb8f94e54a80bfa3e9ba07d875ac4d23dccac94c90f84adcf22ad277825a',
  SKEY: 'bayer_gate',
  TTL_MS: 30*60*1000,
  timer: null,
};
/* Bayer's own workbook — never the console's. Tabs are read by gid, columns by header keyword. */
const SHEET = {
  id: '13SpCKS_Am9mPOqSh8jPOH8OS6htEMCDfA15iuJgEZL8',
  machines: '1933202962',   // "Machine details": one row per machine slot, HR + PB, under a title row (headerRow finds the real one)
  fo: '720662332',          // "FO Mapping final": one row per field officer
  refreshMinutes: 10,
};

async function sha256(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function gateRead(){ try{ return JSON.parse(sessionStorage.getItem(GATE.SKEY)||'null'); }catch(_){ return null; } }
function gateValid(){ const o=gateRead(); return !!o && o.h===GATE.HASH && (Date.now()-(o.at||0)) < GATE.TTL_MS; }
function gateTouch(){ try{ sessionStorage.setItem(GATE.SKEY, JSON.stringify({h:GATE.HASH, at:Date.now()})); }catch(_){ } arm(GATE.TTL_MS); }
function arm(ms){ clearTimeout(GATE.timer); GATE.timer=setTimeout(lock, Math.max(0,ms)); }
let _started=false;
function show(){
  document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block';
  if(!_started){ _started=true; load(); setInterval(()=>{ if(gateValid()) load(); }, SHEET.refreshMinutes*60000); }
  render();
}
function lock(){
  clearTimeout(GATE.timer);
  try{ sessionStorage.removeItem(GATE.SKEY); }catch(_){ }
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  const p=document.getElementById('pin'); p.value=''; setTimeout(()=>p.focus(),30);
}
document.getElementById('pin').addEventListener('input', async e=>{
  const p=e.target, err=document.getElementById('err');
  p.value=p.value.replace(/\D/g,'').slice(0,4); err.textContent='';
  if(p.value.length!==4) return;
  let h; try{ h=await sha256(p.value); }catch(_){ err.textContent='PIN check needs https — open the live site.'; p.value=''; return; }
  if(h===GATE.HASH){ p.value=''; gateTouch(); show(); }
  else { err.textContent='Incorrect PIN'; p.value=''; }
});
document.getElementById('logout').addEventListener('click', lock);
// Activity keeps the session alive, like the console's 30-minute idle expiry.
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ if(gateValid()) gateTouch(); }, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !gateValid()) lock(); });

/* ================================ data ================================ */
const E = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The sheet writes "0" / "-" where a name or number is not known yet; both read as blank.
const val = v => { const s=String(v==null?'':v).trim(); return (s==='0'||s==='-'||/^n\/?a$/i.test(s)) ? '' : s; };
const tel = v => { const d=String(v||'').replace(/\D/g,''); return d.length>=10 ? d.slice(-10) : ''; };
const nice = s => val(s).replace(/_/g,' ').replace(/\s+/g,' ').trim();

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
// The tab opens with a title line ("UPL Machine Details – Oct 2026"), which gviz may or may not fold into the header.
// So the header is whichever of the first rows names the most of the expected columns, wherever it sits.
function headerRow(rows, pats){
  let best=0, hit=-1;
  rows.slice(0,6).forEach((r,i)=>{ const h=r.map(x=>String(x).trim().toLowerCase()); const n=pats.filter(p=>h.some(x=>p.test(x))).length; if(n>hit){ hit=n; best=i; } });
  return best;
}
// First header matching each pattern; -1 when the sheet has no such column (the field then reads blank).
function cols(head, spec){
  const h=head.map(x=>String(x).trim().toLowerCase()), out={};
  for(const k in spec) out[k]=h.findIndex(x=>spec[k].test(x));
  return out;
}
const cell = (r,i) => i>=0 && i<r.length ? r[i] : '';

async function fetchTab(gid){
  const u=`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`;
  const res=await fetch(u, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const rows=parseCSV(await res.text());
  if(!rows.length) throw new Error('empty');
  return rows;
}

function buildMachines(rows){
  const spec={ state:/^state$/, mc:/machine (no|number)/, squad:/squad/, dist:/territory|district/, market:/market|village/,
    count:/machine count/, retailer:/retailer/, fo:/^fo name/, foMob:/^fo mob/, ccm:/^ccm name/, ccmMob:/^ccm mob/,
    co:/cluster officer name|^co$/, coMob:/cluster officer mob|^co.?mob/, am:/area manager name|^am$/, amMob:/area manager mob|^am.?mob/,
    deploy:/deployment date/, handover:/handover/, from:/^from$/, to:/^to$/, org:/organi[sz]ation/ };
  const hi=headerRow(rows, Object.values(spec)), c=cols(rows[hi], spec);
  return rows.slice(hi+1).map(r=>({
      state:val(cell(r,c.state)), mc:val(cell(r,c.mc)).replace(/\s+/g,''), squad:val(cell(r,c.squad)),
      dist:val(cell(r,c.dist)).replace(/\s+(district|territory)$/i,''), market:val(cell(r,c.market)),
      count:Math.max(1, parseInt(cell(r,c.count),10)||1), retailer:val(cell(r,c.retailer)),
      fo:nice(cell(r,c.fo)), foMob:tel(cell(r,c.foMob)), ccm:nice(cell(r,c.ccm)), ccmMob:tel(cell(r,c.ccmMob)),
      co:nice(cell(r,c.co)), coMob:tel(cell(r,c.coMob)), am:nice(cell(r,c.am)), amMob:tel(cell(r,c.amMob)),
      deploy:val(cell(r,c.deploy)), handover:val(cell(r,c.handover)), from:val(cell(r,c.from)), to:val(cell(r,c.to)),
      org:val(cell(r,c.org)) }))
    // The sheet closes with a "Total" row, which carries no place; a row needs a village or a district to be a slot.
    .filter(m=>(m.market||m.dist) && m.squad);
}
function buildFO(rows){
  const c=cols(rows[0], { name:/^fo name/, mob:/^fo mob/, ccm:/^ccm name/, ccmMob:/^ccm mob/, app:/partner app/ });
  return rows.slice(1).map(r=>({ name:nice(cell(r,c.name)), mob:tel(cell(r,c.mob)), ccm:nice(cell(r,c.ccm)),
    ccmMob:tel(cell(r,c.ccmMob)), app:/^y/i.test(val(cell(r,c.app))) })).filter(f=>f.name||f.mob);
}

const S = { tab:'loc', st:'', squad:'', dist:'', status:'', q:'', foQ:'', allD:false, limit:20 };
const D = { mc:null, fo:null, at:null, err:null, loading:false };
const M_PAGE = 20;   // phone cards per page; the desktop table shows every row
const TABS = { loc:{ slug:'deployment', title:'Machine deployment' }, fo:{ slug:'field-officers', title:'Field officers' } };

async function load(){
  D.loading=true; D.err=null; stamp();
  try{
    const [a,b]=await Promise.all([fetchTab(SHEET.machines), fetchTab(SHEET.fo)]);
    D.mc=buildMachines(a); D.fo=buildFO(b); D.at=new Date();
  }catch(e){ D.err=String(e&&e.message||e); console.warn('[Bayer] load failed', e); }
  D.loading=false; render();
}

/* ================================ view ================================ */
const isPhone = () => matchMedia('(max-width:820px)').matches;
const fmtTime = d => d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
const fmtDate = d => d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const opt = (v, cur, label) => `<option value="${E(v)}"${v===cur?' selected':''}>${E(label||v)}</option>`;
const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
const plural = (n, one, many) => n+' '+(n===1?one:(many||one+'s'));
const listAnd = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' & '+a[a.length-1];

// How far a slot has got. Deployment and handover are columns the sheet has not started filling; a stage counts the
// moment its column carries anything, and a handover status that reads like "no" / "pending" is not a handover.
const isHanded = m => !!m.handover && !/^(no|not|pending|awaiting|tbd)/i.test(m.handover);
const stageOf = m => isHanded(m) ? 3 : m.deploy ? 2 : m.mc ? 1 : 0;
const STAGE_CHIP = [
  '<span class="chip wait"><span aria-hidden="true">◷</span> Awaiting a machine</span>',
  '<span class="chip ok"><span aria-hidden="true">●</span> Machine assigned</span>',
  '<span class="chip ok"><span aria-hidden="true">▲</span> Deployed</span>',
  '<span class="chip ok"><span aria-hidden="true">✓</span> Handed over</span>' ];

// Data stamp: the time of the last good fetch; a failed refresh says so in red rather than passing old figures off as current.
function stamp(){
  const t = D.at ? `Updated <b>${fmtTime(D.at)}</b>${D.err?' · <b>last refresh failed</b>':''}<br>refreshes every ${SHEET.refreshMinutes} min`
          : D.err ? '<b>Could not load the sheet</b>' : 'Loading…';
  const a=document.getElementById('stamp'), b=document.getElementById('mstamp');
  if(a){ a.innerHTML=t; a.classList.toggle('stale', !!D.err); }
  if(b) b.innerHTML = D.at ? `Updated ${fmtTime(D.at)}${D.err?' · last refresh failed':''}` : (D.err?'Could not load the sheet':'Loading…');
}
const telLink = mob => mob ? `<a class="tel" href="tel:+91${mob}">${mob}</a>` : '';
function personCell(name, mob){
  if(!name && !mob) return '<span class="muted">Not named yet</span>';
  return `<div>${E(name||'—')}</div>${telLink(mob)}`;
}
function personRow(role, name, mob){
  return `<div class="prow"><span class="r">${role}</span><div class="who">${name||mob?`${E(name||'—')}${mob?`<span class="tel">${mob}</span>`:''}`:'<span class="muted">Not named yet</span>'}</div>
    ${mob?`<a class="call" href="tel:+91${mob}" aria-label="Call ${E(name||mob)}">Call</a>`:''}</div>`;
}

/* ---------- Deployment ---------- */
function filtered(all){
  const q=S.q.trim().toLowerCase();
  return all.filter(m=>(!S.st||m.state===S.st) && (!S.squad||m.squad===S.squad) && (!S.dist||m.dist===S.dist)
    && (!S.status || (S.status==='wait' ? !m.mc : !!m.mc))
    && (!q || [m.market,m.dist,m.squad,m.state,m.mc,m.retailer,m.fo,m.foMob,m.ccm,m.ccmMob,m.co,m.am].join(' ').toLowerCase().includes(q)));
}
// Waiting slots first inside each district, so the gaps sit at the top of every group.
const listOrder = (a,b) => a.state.localeCompare(b.state) || a.dist.localeCompare(b.dist) || (a.mc?1:0)-(b.mc?1:0) || a.market.localeCompare(b.market);

function locHTML(){
  const all=D.mc, ph=isPhone();
  const req=all.reduce((s,m)=>s+m.count,0);
  const got=all.filter(m=>stageOf(m)>=1).length, dep=all.filter(m=>stageOf(m)>=2).length, hand=all.filter(m=>stageOf(m)>=3).length;
  const wait=req-got, p=pct(got,req);

  // 1 · status — "how far along is the handover?"
  const stage = (lbl, v, note, off, rep) => `<li class="${[off&&'off',rep&&'rep'].filter(Boolean).join(' ')}"><div class="sl">${lbl}</div><div class="sv">${v}</div><div class="sn">${note}</div></li>`;
  const status=`<section class="card status${p<50?' low':''}" aria-label="Overall progress">
    <div>
      <div class="big">${got}<small> of ${req}</small></div>
      <div class="bigLbl">machines assigned (${p}%)</div>
      <div class="bigNote">${wait ? `${plural(wait,'location')} still waiting for a UPL machine` : 'Every requested location has a machine'}</div>
      <div class="sbar" role="img" aria-label="${got} assigned, ${wait} waiting"><i class="a" style="width:${got/req*100}%"></i><i class="w" style="width:${wait/req*100}%"></i></div>
      <div class="key"><span style="--k:var(--ok)">Assigned ${got}</span><span style="--k:var(--wait)">Waiting ${wait}</span></div>
    </div>
    <ol class="stages" aria-label="Handover stages">
      ${stage('Requested', req, plural(all.length,'location'), false, true)}
      ${stage('Machine assigned', got, p+'% of requested', false, true)}
      ${stage('Deployed', dep||'—', dep?pct(dep,req)+'% of requested':'not started yet', !dep)}
      ${stage('Handed over', hand||'—', hand?pct(hand,req)+'% of requested':'not started yet', !hand)}
    </ol>
  </section>`;

  // 2 · by state — two programmes moving at different speeds
  const byS={}; all.forEach(m=>{ const s=byS[m.state]=byS[m.state]||{st:m.state,req:0,got:0,squads:new Set()}; s.req+=m.count; if(m.mc) s.got++; s.squads.add(m.squad); });
  const sts=Object.values(byS).sort((a,b)=>b.req-a.req);
  const states = sts.length<2 ? '' : `<section class="sec" aria-label="By state"><div class="sechead"><h2>By state</h2><span class="sub">tap a state to filter the list</span></div>
    <div class="states">${sts.map(s=>{ const w=s.req-s.got; return `<button type="button" class="card stc" data-st="${E(s.st)}" aria-pressed="${S.st===s.st}">
      <div class="t"><span class="nm">${E(s.st)}</span><span class="v">${s.got}<small> of ${s.req}</small></span></div>
      <div class="sbar"><i class="a" style="width:${s.got/s.req*100}%"></i><i class="w" style="width:${w/s.req*100}%"></i></div>
      <div class="ft">${pct(s.got,s.req)}% assigned · ${w?`<b style="color:var(--waitInk)">${w} waiting</b>`:'<span class="done">✓ all assigned</span>'} · ${plural(s.squads.size,'squad')}</div>
    </button>`; }).join('')}</div></section>`;

  // 3 · where machines are still needed — districts ranked by machines waiting, bars on one scale
  const byD={}; all.forEach(m=>{ const k=m.state+'|'+m.dist; const d=byD[k]=byD[k]||{state:m.state,squad:m.squad,dist:m.dist,req:0,got:0}; d.req+=m.count; if(m.mc) d.got++; });
  const ds=Object.values(byD).map(d=>Object.assign(d,{w:d.req-d.got})).sort((a,b)=>b.w-a.w||b.req-a.req||a.dist.localeCompare(b.dist));
  const maxReq=Math.max(1,...ds.map(d=>d.req)), waitingD=ds.filter(d=>d.w).length;
  const cap = ph ? 6 : 10, shown = S.allD ? ds : ds.slice(0,cap);
  const drows=shown.map(d=>`<button type="button" class="drow" data-dist="${E(d.dist)}" data-dst="${E(d.state)}" aria-pressed="${S.dist===d.dist}">
      <div><div class="nm">${E(d.dist)}</div><div class="wh">${E(d.squad)} squad · ${E(d.state)}</div></div>
      <div class="track" aria-hidden="true"><i style="width:${d.got/maxReq*100}%;background:var(--ok)"></i><i style="width:${d.w/maxReq*100}%;background:var(--wait)"></i></div>
      <div class="fig">${d.w?`<b style="color:var(--waitInk)">${d.w} waiting</b> · ${d.got} of ${d.req}`:`<span class="done">✓ ${d.got} of ${d.req} assigned</span>`}</div>
    </button>`).join('');
  const dist=`<section class="sec" aria-label="Districts"><div class="sechead"><h2>Where machines are still needed</h2>
      <span class="sub">${waitingD} of ${ds.length} districts waiting · most first · tap one to filter</span></div>
    <div class="card dlist">${drows}${ds.length>cap?`<button type="button" class="more" data-act="allD">${S.allD?'Show fewer':`Show all ${ds.length} districts`}</button>`:''}</div></section>`;

  // 4 · every location — the operational list
  const states2=uniq(all.map(m=>m.state));
  if(S.st && !states2.includes(S.st)) S.st='';
  const inSt=all.filter(m=>!S.st||m.state===S.st);
  const squads=uniq(inSt.map(m=>m.squad)); if(S.squad && !squads.includes(S.squad)) S.squad='';
  const dists=uniq(inSt.filter(m=>!S.squad||m.squad===S.squad).map(m=>m.dist)); if(S.dist && !dists.includes(S.dist)) S.dist='';
  const list=filtered(all).sort(listOrder);
  const nF=[S.st,S.squad,S.dist,S.status,S.q.trim()].filter(Boolean).length;
  // Columns the sheet has not started filling stay out of the table until some row carries them.
  const has = k => all.some(m=>m[k]);
  const xcols=[ has('deploy')&&['Deployed','deploy'], has('handover')&&['Handover','handover'], has('org')&&['Organisation','org'] ].filter(Boolean);
  const xppl=[ (has('co')||has('coMob'))&&['Cluster officer','co','coMob'], (has('am')||has('amMob'))&&['Area manager','am','amMob'] ].filter(Boolean);
  const filters=`<div class="filters" role="search">
    ${states2.length>1?`<select id="fSt" aria-label="State">${opt('',S.st,'All states')}${states2.map(s=>opt(s,S.st)).join('')}</select>`:''}
    <select id="fSquad" aria-label="Squad">${opt('',S.squad,'All squads')}${squads.map(s=>opt(s,S.squad,s+' squad')).join('')}</select>
    <select id="fDist" aria-label="District">${opt('',S.dist,'All districts')}${dists.map(s=>opt(s,S.dist)).join('')}</select>
    <select id="fStatus" aria-label="Status">${opt('',S.status,'Any status')}${opt('wait',S.status,'Awaiting a machine')}${opt('got',S.status,'Machine assigned')}</select>
    <input type="search" id="fQ" placeholder="Search village, machine, retailer, person" value="${E(S.q)}" aria-label="Search locations" enterkeyhint="search" autocorrect="off">
  </div>
  <div class="fstate" aria-live="polite">${nF?`Showing <b>${list.length}</b>&nbsp;of ${all.length} locations · ${plural(nF,'filter')} on <button type="button" class="link" data-act="clear">Clear filters</button>`:`Showing all ${all.length} locations · waiting ones first in each district`}</div>`;
  const table = list.length ? `<div class="card tblwrap"><table>
      <thead><tr><th>Location</th><th>Status</th><th>Machine</th><th>Retailer</th>${xcols.map(c=>`<th>${c[0]}</th>`).join('')}<th>Field officer</th><th>CCM</th>${xppl.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead>
      <tbody>${list.map(m=>`<tr>
        <td><div class="tl">${E(m.market||m.dist)}</div><div class="ts">${E(m.dist)} · ${E(m.squad)} · ${E(m.state)}</div></td>
        <td>${STAGE_CHIP[stageOf(m)]}</td>
        <td>${m.mc?`<span class="mono">${E(m.mc)}</span>`:'<span class="muted">—</span>'}</td>
        <td>${m.retailer?E(m.retailer):'<span class="muted">—</span>'}</td>
        ${xcols.map(c=>`<td>${m[c[1]]?E(m[c[1]]):'<span class="muted">—</span>'}</td>`).join('')}
        <td>${personCell(m.fo,m.foMob)}</td><td>${personCell(m.ccm,m.ccmMob)}</td>
        ${xppl.map(c=>`<td>${personCell(m[c[1]],m[c[2]])}</td>`).join('')}
      </tr>`).join('')}</tbody></table></div>` : '';
  const page=list.slice(0,S.limit);
  const cards = list.length ? `<div class="cards">${page.map(m=>`<article class="card lc">
      <div class="top"><div class="grow"><div class="nm">${E(m.market||m.dist)}</div><div class="wh">${E(m.dist)} · ${E(m.squad)} squad · ${E(m.state)}</div></div>${STAGE_CHIP[stageOf(m)]}</div>
      <dl class="facts"><dt>Machine</dt><dd>${m.mc?`<span class="mono">${E(m.mc)}</span>`:'<span class="muted">Not assigned yet</span>'}</dd>
        ${m.retailer?`<dt>Retailer</dt><dd>${E(m.retailer)}</dd>`:''}
        ${xcols.map(c=>m[c[1]]?`<dt>${c[0]}</dt><dd>${E(m[c[1]])}</dd>`:'').join('')}</dl>
      ${personRow('FO',m.fo,m.foMob)}${personRow('CCM',m.ccm,m.ccmMob)}
      ${xppl.map(c=>(m[c[1]]||m[c[2]])?personRow(c[0]==='Cluster officer'?'CO':'AM',m[c[1]],m[c[2]]):'').join('')}
    </article>`).join('')}
    ${list.length>page.length?`<button type="button" class="btn" data-act="moreList" style="width:100%">Show ${Math.min(M_PAGE,list.length-page.length)} more · ${list.length-page.length} left</button>`:''}</div>` : '';
  const none = list.length ? '' : `<div class="card empty">No location matches these filters. <button type="button" class="link" data-act="clear">Clear filters</button></div>`;
  const listSec=`<section class="sec" id="listSec" aria-label="All locations"><div class="sechead"><h2>All locations</h2>
      <button type="button" class="btn sm end" data-act="csv">Download CSV</button></div>${filters}${table}${cards}${none}</section>`;

  const lead=`<p class="lead">Where each of the ${req} machines Bayer requested stands, and who to call about a location.</p>`;
  return lead + status + states + dist + listSec;
}

/* ---------- Field officers ---------- */
// An FO is matched to the locations he covers on his MOBILE, the name only where the number is missing.
function foLocs(){
  const by={}; (D.mc||[]).forEach(m=>{ const k=m.foMob||('n:'+m.fo.toLowerCase()); if(!m.fo&&!m.foMob) return; (by[k]=by[k]||[]).push(m); });
  return by;
}
function foFiltered(){
  const q=S.foQ.trim().toLowerCase(), by=foLocs();
  return D.fo.map(f=>Object.assign({}, f, { locs:by[f.mob]||by['n:'+f.name.toLowerCase()]||[] }))
    .filter(f=>!q || [f.name,f.mob,f.ccm,f.ccmMob,...f.locs.map(m=>m.market+' '+m.dist)].join(' ').toLowerCase().includes(q));
}
// "Patti ×2" rather than "Patti, Patti": two slots in one village are one place with two machines.
const villages = locs => { const n={}; locs.forEach(m=>{ const k=m.market||m.dist; n[k]=(n[k]||0)+1; }); return Object.keys(n).map(k=>n[k]>1?`${k} ×${n[k]}`:k).join(', '); };
function foHTML(){
  const all=foFiltered(), base=D.fo, q=S.foQ.trim(), by=foLocs();
  const totalWith=base.filter(f=>(by[f.mob]||by['n:'+f.name.toLowerCase()]||[]).length).length;
  const app=base.filter(f=>f.app).length, ccms=new Set(base.map(f=>f.ccmMob||f.ccm)).size;
  const kpis=`<div class="kpis">
    <div class="card kpi"><div class="l">Field officers</div><div class="v">${base.length}</div><div class="n">on the FO mapping</div></div>
    <div class="card kpi"><div class="l">CCMs</div><div class="v">${ccms}</div><div class="n">each leading a group below</div></div>
    <div class="card kpi"><div class="l">FOs with a location</div><div class="v">${totalWith}<small> of ${base.length}</small></div><div class="n">named against a machine slot</div></div>
    <div class="card kpi"><div class="l">Partner app access</div><div class="v">${app}<small> of ${base.length}</small></div><div class="n">${app?'have access':'none given yet'}</div></div>
  </div>`;
  const g={}; all.forEach(f=>{ const k=f.ccmMob||f.ccm||'—'; (g[k]=g[k]||{ccm:f.ccm,mob:f.ccmMob,fos:[]}).fos.push(f); });
  const groups=Object.values(g).sort((a,b)=>b.fos.length-a.fos.length||a.ccm.localeCompare(b.ccm));
  const body=groups.length ? `<div class="card" style="overflow:hidden">${groups.map(gr=>`<div class="grp">
      <div class="ghead"><span class="muted" style="font-size:11.5px;font-weight:700">CCM</span><span class="nm">${E(gr.ccm||'Not named')}</span>${telLink(gr.mob)}
        <span class="ct">${plural(gr.fos.length,'FO')}</span>${gr.mob?`<a class="call" href="tel:+91${gr.mob}" aria-label="Call ${E(gr.ccm)}">Call</a>`:''}</div>
      ${gr.fos.sort((a,b)=>b.locs.length-a.locs.length||a.name.localeCompare(b.name)).map(f=>`<div class="forow">
        <div class="who"><b style="font-weight:600">${E(f.name)}</b>${f.app?' <span class="chip ok">✓ App access</span>':''}${isPhone()&&f.mob?`<span class="tel" style="display:block">${f.mob}</span>`:''}</div>
        <div class="num">${telLink(f.mob)}</div>
        <div class="locs">${f.locs.length?E(villages(f.locs)):'<span class="muted">No location yet</span>'}</div>
        ${f.mob?`<a class="call" href="tel:+91${f.mob}" aria-label="Call ${E(f.name)}">Call</a>`:''}
      </div>`).join('')}</div>`).join('')}</div>`
    : `<div class="card empty">No field officer matches “${E(q)}”. <button type="button" class="link" data-act="clearFo">Clear search</button></div>`;
  const lead=`<p class="lead">Bayer's field officers, grouped under their CCM, with the locations each one covers.</p>`;
  return lead + kpis + `<section class="sec"><div class="sechead"><h2>Field officers by CCM</h2>
      <span class="sub">${q?`${all.length} of ${base.length} match`:'most locations first'}</span>
      <button type="button" class="btn sm end" data-act="csvFo">Download CSV</button></div>
    <div class="filters" role="search"><input type="search" id="fFoQ" placeholder="Search name, number or village" value="${E(S.foQ)}" aria-label="Search field officers" enterkeyhint="search" autocorrect="off"></div>
    <div style="height:10px"></div>${body}</section>`;
}

/* ---------- CSV ---------- */
function csvDownload(name, head, rows){
  const esc = v => { let s=String(v==null?'':v); if(/^[=+\-@]/.test(s)) s="'"+s; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt='﻿'+[head,...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const STAGE_TXT=['Awaiting a machine','Machine assigned','Deployed','Handed over'];

/* ---------- render ---------- */
function skeleton(){ return `<div class="card" style="padding:20px 22px">${'<div class="skel"></div>'.repeat(4)}</div><div class="sec card" style="padding:20px 22px">${'<div class="skel"></div>'.repeat(6)}</div>`; }
function render(){
  stamp();
  document.querySelectorAll('.tab').forEach(b=>{ const on=b.dataset.tab===S.tab; if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(D.mc) document.querySelector('[data-tab=loc]').innerHTML=`Deployment<span class="n">${D.mc.length}</span>`;
  if(D.fo) document.querySelector('[data-tab=fo]').innerHTML=`Field officers<span class="n">${D.fo.length}</span>`;
  document.getElementById('ttl').textContent=TABS[S.tab].title;
  document.title=TABS[S.tab].title+' · Bayer partner view';
  if(D.mc){ const st=uniq(D.mc.map(m=>m.state)); document.getElementById('scope').textContent=`UPL machines for Bayer · ${listAnd(st)}`; }
  const main=document.getElementById('main');
  let html;
  if(!D.mc && D.err) html=`<div class="card msg">The sheet could not be loaded (${E(D.err)}). Check the connection and try again.<br><button class="btn" data-act="retry" type="button">Try again</button></div>`;
  else if(!D.mc) html=skeleton();
  else html = S.tab==='fo' ? foHTML() : locHTML();
  // Keep the search box's focus and caret, and the page's scroll, across the rebuild.
  const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart, y=scrollY;
  main.innerHTML=html;
  if(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(_){ } } }
  scrollTo(0,y);
}

/* ---------- address: #/deployment and #/field-officers, so Back moves between tabs ---------- */
const tabOfHash = () => { const h=location.hash.replace(/^#\/?/,''); return Object.keys(TABS).find(k=>TABS[k].slug===h)||null; };
S.tab = tabOfHash() || (()=>{ try{ const t=localStorage.getItem('bayer_tab'); return TABS[t]?t:null; }catch(_){ return null; } })() || 'loc';
history.replaceState(null,'','#/'+TABS[S.tab].slug);
window.addEventListener('hashchange', ()=>{ const t=tabOfHash(); if(t && t!==S.tab){ S.tab=t; try{ localStorage.setItem('bayer_tab',t); }catch(_){ } render(); scrollTo(0,0); } });
document.querySelector('.tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  if(b.dataset.tab===S.tab){ scrollTo({top:0,behavior:'smooth'}); return; }
  location.hash='#/'+TABS[b.dataset.tab].slug;
});

const toList = () => { const el=document.getElementById('listSec'); if(el) el.scrollIntoView({block:'start'}); };
const main=document.getElementById('main');
main.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='fSt'){ S.st=t.value; S.squad=''; S.dist=''; }
  else if(t.id==='fSquad'){ S.squad=t.value; S.dist=''; }
  else if(t.id==='fDist') S.dist=t.value;
  else if(t.id==='fStatus') S.status=t.value;
  else return;
  S.limit=M_PAGE; render();
});
main.addEventListener('input', e=>{
  if(e.target.id==='fQ'){ S.q=e.target.value; S.limit=M_PAGE; render(); }
  else if(e.target.id==='fFoQ'){ S.foQ=e.target.value; render(); }
});
main.addEventListener('click', e=>{
  const st=e.target.closest('[data-st]'), di=e.target.closest('[data-dist]'), act=e.target.closest('[data-act]');
  if(st){ S.st = S.st===st.dataset.st ? '' : st.dataset.st; S.squad=''; S.dist=''; S.limit=M_PAGE; render(); if(S.st) toList(); return; }
  if(di){ const same=S.dist===di.dataset.dist; S.dist=same?'':di.dataset.dist; S.st=same?S.st:di.dataset.dst; S.squad=''; S.limit=M_PAGE; render(); if(!same) toList(); return; }
  if(!act) return;
  const a=act.dataset.act;
  if(a==='retry') load();
  else if(a==='allD'){ S.allD=!S.allD; render(); }
  else if(a==='clear'){ Object.assign(S,{st:'',squad:'',dist:'',status:'',q:'',limit:M_PAGE}); render(); }
  else if(a==='clearFo'){ S.foQ=''; render(); }
  else if(a==='moreList'){ S.limit+=M_PAGE; render(); }
  else if(a==='csv') csvDownload('Bayer-deployment',
      ['State','Squad','District','Village / market','Status','Machine','Retailer','FO','FO mobile','CCM','CCM mobile','Cluster officer','CO mobile','Area manager','AM mobile','Deployment date','Handover status'],
      filtered(D.mc).sort(listOrder).map(m=>[m.state,m.squad,m.dist,m.market,STAGE_TXT[stageOf(m)],m.mc,m.retailer,m.fo,m.foMob,m.ccm,m.ccmMob,m.co,m.coMob,m.am,m.amMob,m.deploy,m.handover]));
  else if(a==='csvFo') csvDownload('Bayer-field-officers', ['FO','FO mobile','CCM','CCM mobile','Locations','Partner app access'],
      foFiltered().map(f=>[f.name,f.mob,f.ccm,f.ccmMob,villages(f.locs).replace(/, /g,'; '),f.app?'Yes':'No']));
});
// Desktop table ↔ phone cards: re-render when the window crosses the breakpoint (district cap and phone numbers differ).
matchMedia('(max-width:820px)').addEventListener('change', ()=>{ if(D.mc) render(); });

if(gateValid()){ const o=gateRead(); arm(GATE.TTL_MS-(Date.now()-o.at)); show(); } else lock();
</script>
</body>
