<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Territories · Bayer partner view</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* The console's Wheat v2 tokens (W2 in index.html), so this page looks like the UPL / SWAL team logins: cool neutrals,
     IBM Plex Sans with tabular figures (Mono for machine and phone numbers), tinted KPI tiles, a dark labelled rail. */
  :root{ --ink:#15181C; --ink2:#5B636D; --ink3:#8C939B; --line:#E4E7EA; --line2:#EEF0F2; --cardBd:#E8ECF1; --head:#F8F9FA; --track:#EAEEF3;
         --act:#12924A; --actD:#0F7A3D; --idle:#D69A00; --idleD:#8A6200; --brk:#D23B2C; --brkD:#B42D20; --op:#1A9E80;
         --shadow:0 1px 2px rgba(20,30,45,0.04),0 10px 28px -16px rgba(20,30,45,0.14);
         --dark:linear-gradient(135deg,#243447,#16352D); --page:linear-gradient(160deg,#FFF6EC 0%,#F3F6FB 38%,#F1F8F4 100%); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; color:var(--ink); background:#F3F6FB; font-family:'IBM Plex Sans',system-ui,sans-serif; font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }
  body{ background:var(--page) fixed; min-height:100dvh; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  a{ color:inherit; }

  /* shell: a dark rail beside a page with a 68px header carrying the brand stripe */
  #app{ display:none; min-height:100dvh; }
  .shell{ display:flex; min-height:100dvh; }
  .rail{ width:232px; flex-shrink:0; position:sticky; top:0; height:100vh; background:linear-gradient(185deg,#1F2B3A 0%,#182C33 60%,#14302A 100%); color:#fff; display:flex; flex-direction:column; padding:20px 14px 16px; }
  .logo{ display:flex; align-items:center; gap:10px; padding:0 6px 20px; }
  .logo i{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#F5821F,#1FAE43); display:flex; align-items:center; justify-content:center; font:700 12px 'IBM Plex Sans',sans-serif; font-style:normal; flex-shrink:0; }
  .logo b{ display:block; font-size:15px; font-weight:600; } .logo span{ font-size:12px; color:rgba(255,255,255,.62); }
  .rlbl{ font-size:11px; font-weight:600; color:rgba(255,255,255,.55); letter-spacing:.08em; padding:0 10px 6px; text-transform:uppercase; }
  .nav{ display:flex; align-items:center; gap:10px; width:100%; height:38px; padding:0 10px; border:0; border-radius:8px; background:transparent; color:rgba(255,255,255,.78); font:500 14px 'IBM Plex Sans',sans-serif; cursor:pointer; text-align:left; }
  .nav svg{ width:18px; height:18px; color:rgba(255,255,255,.5); flex-shrink:0; }
  .nav:hover{ background:rgba(255,255,255,.06); }
  .nav[aria-current="page"]{ background:linear-gradient(90deg,rgba(245,130,31,.30),rgba(31,174,67,.14)); color:#fff; font-weight:600; }
  .nav[aria-current="page"] svg{ color:#FFB273; }
  .rfoot{ margin-top:auto; border-top:1px solid rgba(255,255,255,.1); padding-top:12px; }
  .conf{ font:500 10.5px 'IBM Plex Mono',monospace; letter-spacing:.18em; color:rgba(255,255,255,.4); padding:10px 10px 0; }
  .col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .top{ height:68px; flex-shrink:0; background:#fff linear-gradient(90deg,#F5821F,#1FAE43) no-repeat; background-size:100% 3px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:20px; padding:0 32px; position:sticky; top:0; z-index:5; }
  .top h1{ font-size:20px; font-weight:600; margin:0; line-height:1.2; }
  .top .sc{ font-size:13px; color:var(--ink2); margin-top:2px; }
  .stamp{ font-size:12.5px; color:var(--ink2); text-align:right; }
  .stamp.bad{ color:var(--brkD); }
  .link{ border:none; background:none; padding:0; font:inherit; color:var(--ink); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  main{ flex:1; padding:24px 32px 32px; width:100%; max-width:1440px; }
  footer{ font-size:12px; color:var(--ink2); padding:14px 32px calc(env(safe-area-inset-bottom) + 14px); }
  .mhead, .mnav{ display:none; }

  /* controls */
  .ctl{ display:flex; align-items:center; gap:12px 14px; flex-wrap:wrap; }
  .fld{ display:flex; flex-direction:column; gap:4px; }
  .fld > span{ font-size:12.5px; font-weight:500; color:var(--ink2); white-space:nowrap; }
  .sel{ height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 10px; font:14px 'IBM Plex Sans',sans-serif; color:var(--ink); cursor:pointer; max-width:220px; }
  .sel:disabled{ color:var(--ink3); cursor:default; }
  .segb{ display:flex; gap:2px; background:var(--track); padding:3px; border-radius:10px; }
  .segb button{ border:0; cursor:pointer; font:500 13.5px 'IBM Plex Sans',sans-serif; padding:6px 14px; border-radius:7px; background:transparent; color:var(--ink2); white-space:nowrap; }
  .segb button[aria-pressed="true"]{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(20,24,28,.12); }
  .srch{ position:relative; width:320px; }
  .srch svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink3); pointer-events:none; }
  .srch input{ width:100%; height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 12px 0 34px; font:14px 'IBM Plex Sans',sans-serif; color:var(--ink); }
  .ghost{ height:38px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font-weight:500; font-size:14px; cursor:pointer; white-space:nowrap; }
  .csv{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 14px; border:0; border-radius:10px; background:var(--dark); color:#fff; box-shadow:0 6px 16px -8px rgba(22,53,45,.6); font-weight:500; font-size:14px; cursor:pointer; white-space:nowrap; }

  /* the strip: two labelled pieces, Machines and Acres */
  .groups{ display:grid; gap:16px; margin-top:20px; }
  .glbl{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; } .glbl b{ font-size:14px; font-weight:600; } .glbl span{ font-size:12.5px; color:var(--ink2); }
  .mcgrid{ display:grid; grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr)); gap:12px; }
  .tile{ border-radius:14px; border:1px solid; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .tile .l{ display:flex; align-items:baseline; gap:7px; font-size:12.5px; font-weight:500; color:var(--ink2); line-height:1.3; }
  .tile .l i{ width:8px; height:8px; border-radius:50%; flex-shrink:0; transform:translateY(-1px); }
  .tile .v{ font-size:26px; font-weight:600; line-height:1.1; letter-spacing:-.01em; white-space:nowrap; }
  .u{ font-size:12.5px; color:var(--ink2); font-weight:500; letter-spacing:0; }
  .tile .n{ font-size:12.5px; color:var(--ink2); line-height:1.4; }
  .bar{ display:block; height:6px; border-radius:3px; background:var(--line2); overflow:hidden; }
  .bar > span{ display:block; height:100%; border-radius:3px; }
  .acard{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; padding:16px 18px; }
  .acard > div + div{ border-left:1px solid var(--line2); padding-left:18px; margin-left:18px; }
  .card{ background:#fff; border:1px solid var(--cardBd); border-radius:16px; box-shadow:var(--shadow); }
  .warn{ font-size:12.5px; color:var(--idleD); margin-top:6px; }

  /* the list */
  .lhead{ padding:18px 22px; border-bottom:1px solid var(--line2); }
  .lhead b{ font-size:16px; font-weight:600; } .lhead div{ font-size:13.5px; color:var(--ink2); margin-top:2px; }
  .tbl{ overflow-x:auto; } .tbl > div{ min-width:900px; }
  .row{ display:grid; grid-template-columns:minmax(210px,2fr) 70px 84px 110px 120px 90px 130px; gap:10px; padding:12px 22px; border-bottom:1px solid var(--line2); align-items:center; font-size:14px; }
  .row.hd{ background:var(--head); font-size:12px; font-weight:600; color:var(--ink2); padding-top:10px; padding-bottom:10px; position:sticky; top:0; z-index:1; }
  .row.hd button{ border:none; background:none; padding:0; font:inherit; color:var(--ink2); cursor:pointer; text-align:right; justify-self:end; }
  .row.hd button:first-child{ text-align:left; justify-self:start; }
  .row.hd button[aria-sort="descending"]{ color:var(--ink); }
  .row.g{ cursor:pointer; background:#fff; } .row.g:hover{ background:#FBFCFD; }
  .row.g[aria-expanded="true"]{ background:var(--head); }
  .row.g.l1{ background:var(--head); padding-top:10px; padding-bottom:10px; } .row.g.l1[aria-expanded="true"]{ background:#F3F6F9; }
  .row.none{ background:#FFFBF2; }
  .row.m{ background:#FBFCFD; padding-top:10px; padding-bottom:10px; }
  .num{ text-align:right; }
  .of{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; } .of .bar{ width:100%; height:4px; }
  .nm{ min-width:0; display:flex; gap:8px; align-items:flex-start; }
  .nm .t{ display:flex; align-items:center; gap:8px; min-width:0; font-weight:600; } .nm .t span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nm .s{ font-size:13px; color:var(--ink2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lab{ font-size:11.5px; font-weight:600; color:var(--ink2); }
  .chev{ flex-shrink:0; margin-top:3px; transition:transform .15s; }
  [aria-expanded="true"] > .nm > .chev, [aria-expanded="true"] .chev{ transform:rotate(90deg); }
  .mcb{ border:none; background:none; padding:0; cursor:pointer; font:600 13px 'IBM Plex Mono',monospace; color:var(--ink); text-decoration:underline; text-decoration-color:#C9CFD6; text-underline-offset:3px; }
  .glab{ padding:8px 22px 6px 52px; border-bottom:1px solid var(--line2); background:var(--head); font-size:13px; color:var(--ink2); }
  .tel{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:400; color:var(--ink2); text-decoration:none; white-space:nowrap; }
  .tel:hover{ text-decoration:underline; }
  .ok{ color:var(--actD); } .bd{ color:var(--brkD); font-weight:600; } .mu{ color:var(--ink2); }
  .msg{ padding:44px 20px; text-align:center; color:var(--ink2); font-size:14px; line-height:1.55; }
  .skel{ height:14px; border-radius:7px; background:linear-gradient(90deg,var(--line2),#F8F9FA,var(--line2)); background-size:200% 100%; margin:12px 0; }
  @media (prefers-reduced-motion:no-preference){ .skel{ animation:sk 1.2s linear infinite; } @keyframes sk{ to{ background-position:-200% 0; } } }

  /* breakdown list */
  .bkh{ width:100%; min-height:56px; padding:12px 22px; border:0; background:none; display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer; }
  .bkh b{ font-size:15px; font-weight:600; display:flex; align-items:baseline; gap:7px; }
  .bkrow{ display:grid; grid-template-columns:minmax(120px,1fr) 100px minmax(110px,1fr) minmax(130px,1.4fr) minmax(110px,1.2fr) 90px; gap:10px; padding:10px 22px; border-top:1px solid var(--line2); align-items:center; font-size:13.5px; min-width:780px; }
  .bkrow.hd{ background:var(--head); font-size:12px; font-weight:600; color:var(--ink2); }
  .bkrow > *{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* machine panel: a drawer on desktop, a sheet on the phone */
  .scrim{ position:fixed; inset:0; background:rgba(20,24,28,.32); z-index:40; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; width:440px; max-width:92vw; background:#fff; z-index:41; box-shadow:-8px 0 40px rgba(0,0,0,.16); display:flex; flex-direction:column; }
  .dhead{ padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px; }
  .dhead .mc{ font:600 21px 'IBM Plex Mono',monospace; } .dhead .w{ font-size:13px; color:var(--ink2); margin-top:3px; }
  .x{ width:36px; height:36px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink2); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .dbody{ flex:1; overflow:auto; padding:18px 22px 28px; }
  .stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .stat{ background:var(--head); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; min-width:0; }
  .stat .l{ font-size:12px; font-weight:500; color:var(--ink2); } .stat .v{ font-size:18px; font-weight:600; margin-top:3px; } .stat .n{ font-size:12px; color:var(--ink2); margin-top:2px; }
  .sect{ font-size:12px; font-weight:600; color:var(--ink2); margin:20px 0 8px; letter-spacing:.02em; }
  .box{ border:1px solid var(--line2); border-radius:12px; overflow:hidden; }
  .prow{ display:flex; align-items:center; gap:12px; padding:10px 14px; min-height:60px; border-top:1px solid var(--line2); }
  .prow:first-child{ border-top:none; }
  .prow .r{ font-size:12px; color:var(--ink2); } .prow .p{ font-size:14.5px; font-weight:500; } .prow .who{ flex:1; min-width:0; }
  .call{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); flex-shrink:0; }
  .go{ display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:10px; background:var(--dark); color:#fff; font-weight:500; font-size:14px; text-decoration:none; flex-shrink:0; }

  /* PIN gate */
  #gate{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:var(--page); padding:16px; }
  #gate .gbox{ width:360px; max-width:100%; background:#fff; border:1px solid var(--cardBd); border-radius:18px; padding:30px 28px; box-shadow:0 12px 40px rgba(20,30,45,.10); text-align:center;
    background-image:linear-gradient(90deg,#F5821F,#1FAE43); background-size:100% 3px; background-repeat:no-repeat; }
  #gate .eb{ font-size:12px; font-weight:600; letter-spacing:.08em; color:var(--ink2); text-transform:uppercase; }
  #gate .ttl{ font-size:20px; font-weight:600; margin-top:6px; }
  #pin{ margin-top:16px; width:100%; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:30px; letter-spacing:.5em; padding:12px 0 12px .5em; border:1px solid var(--line); border-radius:12px; outline:none; color:var(--ink); }
  #pin:focus{ border-color:var(--ink); }
  #err{ font-size:12.5px; color:var(--brkD); margin-top:10px; min-height:16px; font-weight:600; }
  #gate .note{ font-size:12px; color:var(--ink2); margin-top:12px; line-height:1.4; }

  /* Phone view: the page itself in a 392 × 840 handset, as the console's rail offers it */
  #pv{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; gap:20px; background:rgba(20,24,28,.55); padding:16px; }
  #pv .hs{ width:392px; height:min(840px, calc(100vh - 32px)); border-radius:44px; background:#15181C; padding:12px; box-shadow:0 30px 80px rgba(0,0,0,.35); flex-shrink:0; }
  #pv iframe{ width:100%; height:100%; border:0; border-radius:34px; background:#fff; display:block; }
  #pv .pvx{ align-self:flex-start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 14px; border:0; border-radius:10px; background:#fff; color:var(--ink); font:500 14px 'IBM Plex Sans',sans-serif; cursor:pointer; }

  @media (max-width:1040px){ .mcgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); } .mcgrid > :first-child{ grid-column:1/-1; } }

  /* ── phone: header, strip, controls, cards; a pill tab bar at the foot; 44px targets, 16px fields ── */
  @media (max-width:820px){
    input, select{ font-size:16px !important; }
    .rail, .top, footer.d{ display:none; }
    .mhead{ display:flex; align-items:flex-start; gap:10px; background:#fff linear-gradient(90deg,#F5821F,#1FAE43) no-repeat; background-size:100% 3px; border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 14px) 16px 12px; }
    .mhead h1{ font-size:19px; font-weight:600; margin:0; } .mhead .sc{ font-size:13px; color:var(--ink2); margin-top:2px; }
    .mhead .out{ width:44px; height:44px; border:1px solid var(--line); border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink2); flex-shrink:0; cursor:pointer; }
    main{ padding:14px 16px calc(env(safe-area-inset-bottom) + 96px); }
    footer.m{ display:block; text-align:center; padding:6px 16px 0; }
    .mnav{ display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:4px 6px env(safe-area-inset-bottom); }
    .mnav button{ flex:1; min-height:58px; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--ink2); font:500 12.5px 'IBM Plex Sans',sans-serif; }
    .mnav button span{ display:flex; align-items:center; justify-content:center; width:56px; height:28px; border-radius:14px; }
    .mnav button[aria-current="page"]{ color:#7A3B06; font-weight:600; }
    .mnav button[aria-current="page"] span{ background:linear-gradient(120deg,#FFE7D2,#DDF3E4); }
    .groups{ margin-top:0; gap:14px; }
    .mcgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .mcgrid > :nth-child(-n+2){ grid-column:1/-1; }   /* Machines and Ran across, Breakdown beside Operators */
    .tile{ box-shadow:none; padding:12px 14px; } .tile .v{ font-size:22px; }
    .acard{ grid-template-columns:1fr; padding:14px 16px; row-gap:12px; }
    .acard > div + div{ border-left:none; margin-left:0; padding-left:0; border-top:1px solid var(--line2); padding-top:12px; }
    .ctl.m{ margin-top:14px; }
    .srch{ flex:1; min-width:0; width:auto; } .srch input, .ghost, .csv, .sel{ height:48px; border-radius:12px; }
    .fbtn{ flex-shrink:0; display:inline-flex; align-items:center; gap:6px; height:48px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#fff; font-weight:500; font-size:15px; cursor:pointer; }
    .fbtn.on{ border-color:var(--ink); }
    .fbtn em{ font-style:normal; min-width:20px; height:20px; border-radius:10px; background:var(--ink); color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
    .ltitle{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:18px 2px 10px; } .ltitle b{ font-size:16px; font-weight:600; } .ltitle span{ font-size:12.5px; color:var(--ink2); }
    .nc{ margin-bottom:12px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .nc.none{ border-color:#F1E2BC; }
    .kid{ border:1px solid var(--line2); border-radius:14px; background:var(--head); padding:12px; display:flex; flex-direction:column; gap:10px; }
    .nch{ display:flex; align-items:flex-start; gap:10px; } .nch .nmx{ font-size:16px; font-weight:600; line-height:1.3; } .nch .sub{ font-size:13.5px; color:var(--ink2); margin-top:2px; }
    .big{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; } .big b{ font-size:22px; font-weight:600; }
    .sg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 8px; } .sg b{ display:block; font-size:17px; font-weight:600; } .sg span{ font-size:12.5px; color:var(--ink2); }
    .tog{ width:100%; min-height:48px; border:1px solid var(--line); border-radius:12px; background:#fff; font-weight:500; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
    .tog[aria-expanded="true"]{ background:var(--head); }
    .mcbtn{ display:flex; align-items:center; gap:10px; width:100%; min-height:58px; padding:10px 12px; border:1px solid var(--line2); border-radius:12px; background:#fff; text-align:left; cursor:pointer; }
    .mcbtn .a{ flex:1; min-width:0; } .mcbtn .a > span{ display:block; font-size:12.5px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .mcbtn .b{ text-align:right; flex-shrink:0; } .mcbtn .b > span{ display:block; font-size:12.5px; }
    .more{ width:100%; min-height:48px; border:1px solid var(--line); border-radius:12px; background:#fff; font-weight:500; font-size:14px; cursor:pointer; }
    .bkh{ padding:12px 16px; } .bkm{ padding:0 12px 12px; display:flex; flex-direction:column; gap:8px; }
    .scrim{ background:rgba(20,24,28,.4); }
    .drawer{ top:auto; left:0; width:auto; max-width:none; height:92%; border-radius:24px 24px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.2); }

<body>

<!-- The Bayer partner page. Deliberately SELF-CONTAINED: it loads nothing from the main console (no index.html,
     no machines.js, no internal sheet ids), so its source carries one PIN — Bayer's — and reads only Bayer's own
     workbook. See CLAUDE.md → Partner pages. -->
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTtl">
  <div class="gbox">
    <div class="eb">Partner view · Bayer</div>
    <div class="ttl" id="gateTtl">Enter access PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="Access PIN">
    <div id="err"></div>
    <div class="note">Access expires after 30 minutes of inactivity.</div>
  </div>
</div>

<div id="app"></div>
<!-- Built once, outside #app, so a re-render never reloads the frame. -->
<div id="pv" role="dialog" aria-modal="true" aria-label="Phone view"><div class="hs"><iframe id="pvFrame" title="Bayer partner view on a phone"></iframe></div><button type="button" class="pvx" id="pvClose">Back to desktop</button></div>

<script>
/* Soft client-side gate, same model as the main console: a SHA-256 of the PIN, checked in the browser. It stops
   casual viewing; it is not real security. The main console hands a Bayer login over to this page by writing
   SKEY = {h, at} into sessionStorage (same origin, same tab) before redirecting, so the PIN is asked once. */
const GATE = {
  HASH: '0f7afb8f94e54a80bfa3e9ba07d875ac4d23dccac94c90f84adcf22ad277825a',
  SKEY: 'bayer_gate',
  TTL_MS: 30*60*1000,
  timer: null,
};
/* Bayer's machine-DAY workbook (one row per machine per day), the same sheet the console's Wheat admin reads for its Bayer
   choice. Shown the way the UPL / SWAL team logins see theirs (Dinesh 2026-11-05): two pages, Territories and CCM · FO, with
   machines, ran on the day, breakdown, operators mapped, acres on the day and for the season, and a machine panel. NO target
   acres (removed by request), and the TM column is called CCM, which is how Bayer addresses the sales team. Acres = IOT_acres (as on the team logins); read from 1 Nov, Bayer's programme start. No
   deployed / in transit / pending anywhere — by request it just says machines. Read as a plain CSV export, because gviz has
   answered this kind of tab short with no error. */
const SPRAY = {
  id: '14dpDPQtB8GyQFMrjJa28LeTtgz5x5wr2dVv-WmoSH3M', gid: '0',
  from: '2026-11-01',
  notBayer: new Set(['UPL_2782']),  // on Bayer's sheet, but a UPL Punjab machine (same rule as the console's WRET_UPL_KEEP)
  refreshMinutes: 10,
};

async function sha256(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function gateRead(){ try{ return JSON.parse(sessionStorage.getItem(GATE.SKEY)||'null'); }catch(_){ return null; } }
function gateValid(){ const o=gateRead(); return !!o && o.h===GATE.HASH && (Date.now()-(o.at||0)) < GATE.TTL_MS; }
function gateTouch(){ try{ sessionStorage.setItem(GATE.SKEY, JSON.stringify({h:GATE.HASH, at:Date.now()})); }catch(_){ } arm(GATE.TTL_MS); }
function arm(ms){ clearTimeout(GATE.timer); GATE.timer=setTimeout(lock, Math.max(0,ms)); }
let _started=false;
function show(){
  document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block';
  if(!_started){ _started=true; load(); setInterval(()=>{ if(gateValid()) load(); }, SPRAY.refreshMinutes*60000); }
  render();
}
function lock(){
  clearTimeout(GATE.timer);
  try{ sessionStorage.removeItem(GATE.SKEY); }catch(_){ }
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.body.style.overflow='';
  const p=document.getElementById('pin'); p.value=''; setTimeout(()=>p.focus(),30);
}
document.getElementById('pin').addEventListener('input', async e=>{
  const p=e.target, err=document.getElementById('err');
  p.value=p.value.replace(/\D/g,'').slice(0,4); err.textContent='';
  if(p.value.length!==4) return;
  let h; try{ h=await sha256(p.value); }catch(_){ err.textContent='PIN check needs https — open the live site.'; p.value=''; return; }
  if(h===GATE.HASH){ p.value=''; gateTouch(); show(); }
  else { err.textContent='Incorrect PIN'; p.value=''; }
});
// Activity keeps the session alive, like the console's 30-minute idle expiry.
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, ()=>{ if(gateValid()) gateTouch(); }, {passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !gateValid()) lock(); });

/* ================================ data ================================ */
const E = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The sheet writes "0" / "-" where a name or number is not known yet; both read as blank.
const val = v => { const s=String(v==null?'':v).trim(); return (s==='0'||s==='-'||/^n\/?a$/i.test(s)) ? '' : s; };
const tel = v => { const d=String(v||'').replace(/\D/g,''); return d.length>=10 ? d.slice(-10) : ''; };
const nice = s => val(s).replace(/_/g,' ').replace(/\s+/g,' ').trim();
function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
// First header matching each pattern; -1 when the sheet has no such column (the field then reads blank).
function cols(head, spec){
  const h=head.map(x=>String(x).trim().toLowerCase()), out={};
  for(const k in spec) out[k]=h.findIndex(x=>spec[k].test(x));
  return out;
}
const cell = (r,i) => i>=0 && i<r.length ? r[i] : '';

const istDay = off => new Date(Date.now()+5.5*3600e3+off*864e5).toISOString().slice(0,10);
const dPretty = d => { const [,m,dd]=d.split('-').map(Number); return dd+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]; };
const titleCase = s => s.toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase());
const SP_NO_TERR = 'Territory not on sheet';
function isoDate(v){
  const s=String(v||'').trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : '';
}
async function fetchSpray(){
  const res=await fetch(`https://docs.google.com/spreadsheets/d/${SPRAY.id}/export?format=csv&gid=${SPRAY.gid}`, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const rows=parseCSV(await res.text());
  if(rows.length<2) throw new Error('empty');
  return rows;
}
function buildSpray(rows){
  const spec={ mc:/^machine_number$/, date:/^selected_date$/, terr:/^territory$/, st:/^state$/, vil:/^village_location$/, org:/^organi[sz]ation$/,
    fo:/^fo_name$/, foMob:/^fo_number$/, tm:/^tm_name$/, tmMob:/^tm_number$/, op:/^operator_name$/, opMob:/^operator_number$/,
    ci:/^ci_name$/, ciMob:/^ci_contact$/, am:/^am_name$/, amMob:/^am_contact$/, iot:/^iot_acres$/, brk:/^breakdown_id$/,
    ping:/^last_pinged_date$/, lat:/^latest_latitude$/, lon:/^latest_longitude$/ };
  const c=cols(rows[0], spec), miss=['mc','date','iot'].filter(k=>c[k]<0);
  if(miss.length) throw new Error('column missing: '+miss.join(', '));
  const today=istDay(0), by={}, seen=new Set(), log={ rows:0, dup:0, notBayer:0, otherOrg:0 };
  for(const r of rows.slice(1)){
    const mc=val(cell(r,c.mc)).replace(/\s+/g,''), d=isoDate(cell(r,c.date));
    if(!mc || !d || d<SPRAY.from || d>today) continue;
    log.rows++;
    const org=val(cell(r,c.org)); if(org && !/^bayer$/i.test(org)){ log.otherOrg++; continue; }
    if(SPRAY.notBayer.has(mc)){ log.notBayer++; continue; }
    if(seen.has(mc+'|'+d)){ log.dup++; continue; }   // a machine listed twice on one day is read once
    seen.add(mc+'|'+d);
    const m=by[mc]=by[mc]||{ mc, days:{}, at:'' };
    const ac=parseFloat(cell(r,c.iot))||0;
    m.days[d]={ ac:ac>0?ac:0, brk:val(cell(r,c.brk)) };
    // Everything else on a row is today's value copied onto every date, so the latest row speaks for the machine.
    if(d>=m.at){
      const terr=nice(cell(r,c.terr)).replace(/\s+(district|territory)$/i,'');
      const lat=parseFloat(cell(r,c.lat)), lon=parseFloat(cell(r,c.lon)), pos=lat>26&&lat<34&&lon>72&&lon<79;   // HR + PB
      Object.assign(m, { at:d, st:nice(cell(r,c.st)), terr:terr?titleCase(terr):SP_NO_TERR, vil:nice(cell(r,c.vil)),
        fo:nice(cell(r,c.fo)), foMob:tel(cell(r,c.foMob)), tm:nice(cell(r,c.tm)), tmMob:tel(cell(r,c.tmMob)),
        op:nice(cell(r,c.op)), opMob:tel(cell(r,c.opMob)), ci:nice(cell(r,c.ci)), ciMob:tel(cell(r,c.ciMob)),
        am:nice(cell(r,c.am)), amMob:tel(cell(r,c.amMob)), ping:isoDate(cell(r,c.ping)), lat:pos?lat:null, lon:pos?lon:null });
    }
  }
  const machines=Object.values(by);
  const dates=[...new Set(machines.flatMap(m=>Object.keys(m.days)))].sort();
  const acDates=dates.filter(d=>machines.some(m=>(m.days[d]||{}).ac>0));
  const out={ machines, firstDate:dates[0]||SPRAY.from, lastDate:acDates[acDates.length-1]||'' };
  console.info('[Bayer] spray sheet →', Object.assign(log, { machines:machines.length, firstDate:out.firstDate, lastDate:out.lastDate }));
  return out;
}

const PAGES = { terr:{ slug:'territories', title:'Territory summary', short:'Territories' }, tm:{ slug:'ccm-fo', title:'CCM · FO summary', short:'CCM · FO' } };
const S = { page:'terr', day:'', st:'', terr:'', tm:'', q:'', sort:'acAll', open:{}, brk:false, limit:20, sel:null, sheet:false };
const D = { sp:null, err:null, at:null, loading:false };
const M_PAGE = 20;   // phone cards per page; the desktop table shows every row

async function load(){
  D.loading=true; render();
  try{ D.sp=buildSpray(await fetchSpray()); D.err=null; D.at=new Date(); }
  catch(e){ D.err=String(e&&e.message||e); console.warn('[Bayer] spray sheet load failed', e); }
  D.loading=false; render();
}

/* ================================ figures ================================ */
const fmtN = n => Math.round(n).toLocaleString('en-IN');
const acF = n => n>0 && n<10 ? n.toFixed(1) : fmtN(n);
const pctF = p => p==null ? '—' : (p>0 && p<1 ? '<1' : Math.round(p))+'%';
const plural = (n, one, many) => fmtN(n)+' '+(n===1?one:(many||one+'s'));
const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));
const listAnd = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' & '+a[a.length-1];
const isPhone = () => matchMedia('(max-width:820px)').matches;
const fmtTime = d => d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
// The picked day: Yesterday by default, never before 1 Nov or after the calendar's yesterday (today's row is still being written).
function spDay(){
  const y=istDay(-1), lo=D.sp ? D.sp.firstDate : SPRAY.from;
  let d=S.day || y; if(d>y) d=y; if(d<lo) d=lo; return d;
}
const isYday = d => d===istDay(-1);
const dayWord = d => isYday(d) ? 'yesterday' : 'on '+dPretty(d);
const dayShort = d => isYday(d) ? 'y’day' : dPretty(d);
// A machine's figures for the picked day: acres that day, season acres up to it, the day's breakdown ID, days sprayed.
function spAt(m, d){
  let all=0, n=0, last=''; for(const k in m.days) if(k<=d){ all+=m.days[k].ac; if(m.days[k].ac>0){ n++; if(k>last) last=k; } }
  const day=m.days[d]||{}; return { acY:day.ac||0, acAll:all, brk:day.brk||'', nDays:n, lastRun:last };
}
const hasOp = m => !!(m.op||m.opMob);
// One set of figures for any group of machines; the strip and every row come from it, so they reconcile.
function figs(list){
  const n=list.length, sum=f=>list.reduce((a,m)=>a+f(m),0), acAll=sum(m=>m.f.acAll), op=list.filter(hasOp).length;
  return { n, ran:list.filter(m=>m.f.acY>0).length, brk:list.filter(m=>m.f.brk).length, op, opPct:n?100*op/n:null,
    acY:sum(m=>m.f.acY), acAll, perMc:n?acAll/n:null };
}
const SORTS=[['acAll','Season acres'],['perMc','Acres per machine'],['acY','Acres on the day'],['ran','Ran on the day'],['opPct','Operator mapped %'],['n','Machines'],['brk','Breakdown'],['name','Name']];
const pKey = (n, m) => (m||'')+'|'+(n||'').toLowerCase();
function scope(){
  const d=spDay(), all=D.sp.machines.map(m=>Object.assign(m,{ f:spAt(m,d) }));
  const sts=uniq(all.map(m=>m.st)); if(S.st && !sts.includes(S.st)) S.st='';
  const inSt=all.filter(m=>!S.st||m.st===S.st);
  const terrs=uniq(inSt.map(m=>m.terr).filter(t=>t!==SP_NO_TERR)); if(S.terr && !terrs.includes(S.terr)) S.terr='';
  const inT=inSt.filter(m=>!S.terr||m.terr===S.terr);
  const tms=uniq(inT.map(m=>m.tm)); if(S.tm && !tms.includes(S.tm)) S.tm='';
  const scoped=inT.filter(m=>!S.tm||m.tm===S.tm);
  const q=S.q.trim().toLowerCase();
  const list=q ? scoped.filter(m=>[m.mc,m.vil,m.op,m.opMob,m.fo,m.foMob,m.tm,m.tmMob,m.terr,m.st,m.ci,m.am].join(' ').toLowerCase().includes(q)) : scoped;
  const nF=[S.st,S.terr,S.tm].filter(Boolean).length + (d!==istDay(-1)?1:0);
  return { d, all, sts, terrs, tms, list, q, nF };
}
function order(nodes){
  const k=SORTS.some(([x])=>x===S.sort)?S.sort:'acAll';
  return nodes.sort((a,b)=>(!!a.none-!!b.none) || (k==='name' ? a.name.localeCompare(b.name)
    : ((b.f[k]==null?-1:b.f[k])-(a.f[k]==null?-1:a.f[k])) || b.f.n-a.f.n || a.name.localeCompare(b.name)));
}
const mcOrder = (a,b) => b.f.acAll-a.f.acAll || a.mc.localeCompare(b.mc);
// The page as a tree: Territory → machines (under each CCM where there is more than one) · CCM → FO → machines.
// CCM is the sheet's tm_name / tm_number: Bayer calls its sales team CCMs, so every label says CCM.
function tree(list){
  if(S.page==='terr'){
    const g={}; list.forEach(m=>{ const k=m.st+'|'+m.terr; (g[k]=g[k]||{ key:'t:'+k, name:m.terr, st:m.st, none:m.terr===SP_NO_TERR, list:[] }).list.push(m); });
    return order(Object.values(g).map(t=>{
      const tm={}; t.list.forEach(m=>{ const k=pKey(m.tm,m.tmMob); (tm[k]=tm[k]||{ n:m.tm, mob:m.tmMob, list:[] }).list.push(m); });
      const tmL=Object.values(tm).sort((a,b)=>b.list.length-a.list.length||a.n.localeCompare(b.n));
      return Object.assign(t, { f:figs(t.list), people:tmL.filter(p=>p.n||p.mob).map(p=>({ lab:'CCM', n:p.n, mob:p.mob })),
        warn:t.none?'The sheet’s territory is "0" or blank — fix on the sheet':'',
        groups:tmL.map(p=>({ label:tmL.length>1?`CCM · ${p.n||'not on the sheet'} · ${p.list.length}`:'', mcs:p.list.sort(mcOrder) })) });
    }));
  }
  const g={}; list.forEach(m=>{ const k=pKey(m.tm,m.tmMob); (g[k]=g[k]||{ key:'m:'+k, name:m.tm||'CCM not named', mob:m.tmMob, none:!m.tm&&!m.tmMob, list:[] }).list.push(m); });
  return order(Object.values(g).map(t=>{
    const fo={}; t.list.forEach(m=>{ const k=pKey(m.fo,m.foMob); (fo[k]=fo[k]||{ key:t.key+'/f:'+k, name:m.fo||'FO not named', mob:m.foMob, none:!m.fo&&!m.foMob, list:[] }).list.push(m); });
    const kids=order(Object.values(fo).map(f=>Object.assign(f,{ f:figs(f.list), lab:'FO', tag:f.mob&&f.mob===t.mob?'CCM himself':'',
      warn:f.none?'The sheet names no FO for these machines — fix on the sheet':'', groups:[{ label:'', mcs:f.list.sort(mcOrder) }] })));
    const nFo=kids.filter(k=>!k.none).length;
    return Object.assign(t, { f:figs(t.list), lab:'CCM', sub:`${nFo} FO${nFo===1?'':'s'}${kids.some(k=>k.none)?' + no FO':''}`,
      warn:t.none?'These machines have no CCM on the sheet — fix on the sheet':'', kids });
  }));
}
const isOpen = (nd, q) => !!q || !!S.open[nd.key];

/* ================================ view ================================ */
const IC = {
  terr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  tm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.4 5 2.8 5 5.8"/></svg>',
  phone2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
  out:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  filter:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  close:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  dl:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8C939B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
};
// The tinted tile for a KPI label — each kind of figure keeps one hue, as in the console (w2tone).
function tone(l){
  const T=(a,b,c,d)=>({ bg:`linear-gradient(150deg,${a} 0%,#FFFFFF 75%)`, bd:b, vc:c, dot:d });
  return l==='Breakdown' ? T('#FDECEA','#F4D8D4','#B42D20','#D23B2C') : l==='Stale' ? T('#FDF4DF','#F1E2BC','#8A6200','#D69A00')
    : /^Acres/.test(l) ? T('#E8F2FC','#D2E3F4','#1D4F80','#3B82C4') : /^Machines/.test(l) ? T('#FFF0E2','#F5DEC7','#8A430A','#F5821F')
    : /^Operators/.test(l) ? T('#E6F6F1','#CBEAE0','#0E6B57','#1A9E80') : /^Ran/.test(l) ? T('#EEF8F2','#CFE9DA','#0F7A3D','#12924A') : T('#F4F6F8','#E8ECF1','#15181C','#8C939B');
}
const bar = (p, col, h) => `<span class="bar"${h?` style="height:${h}px"`:''}><span style="width:${p==null?0:Math.min(100,Math.max(0,p))}%;min-width:${p>0?3:0}px;background:${col}"></span></span>`;
const telA = mob => mob ? ` <a class="tel" href="tel:+91${mob}" onclick="event.stopPropagation()">${mob}</a>` : '';
const callBtn = (mob, who) => mob ? `<a class="call" href="tel:+91${mob}" aria-label="Call ${E(who||mob)}">${IC.phone}</a>` : '';
const noOp = '<span class="bd" style="font-weight:500">✕ No operator</span>';

function stampTxt(){
  if(D.err && !D.sp) return '<span class="stamp bad">Could not load the sheet</span>';
  if(!D.at) return '<span class="stamp">Loading…</span>';
  return `<span class="stamp${D.err?' bad':''}">Bayer sheet · checked ${fmtTime(D.at)}${D.err?' · last refresh failed':''} · <button class="link" data-act="retry" type="button">refresh</button></span>`;
}

function stripHTML(F, sc){
  const d=sc.d, day=dPretty(d), dw=dayWord(d), ph=isPhone();
  const nTerr=new Set(sc.list.filter(m=>m.terr!==SP_NO_TERR).map(m=>m.st+'|'+m.terr)).size;
  const stale=D.sp.lastDate && D.sp.lastDate<d, ranP=F.n?100*F.ran/F.n:0, brkRan=sc.list.filter(m=>m.f.brk&&m.f.acY>0).length;
  const tile=(lab,key,v,of,note,b)=>{ const t=tone(key);
    return `<div class="tile" style="background:${t.bg};border-color:${t.bd}"><div class="l"><i style="background:${t.dot}"></i>${lab}</div>
      <div class="v" style="color:${t.vc}">${v}${of!=null?`<span class="u"> of ${fmtN(of)}</span>`:''}</div>${b!=null?bar(b,t.dot):''}<div class="n">${note}</div></div>`; };
  const tm=tone('Machines');
  const mcTile=`<div class="tile" style="background:${tm.bg};border-color:${tm.bd}"><div class="l" style="font-size:14px;font-weight:600;color:var(--ink)"><i style="background:${tm.dot}"></i>Machines</div>
    <div><span class="v" style="color:${tm.vc};font-size:${ph?26:28}px">${fmtN(F.n)}</span><span class="u"> machines</span>
    <span style="font-size:13px;color:var(--ink2)"> ${S.terr?'in '+E(S.terr):`in ${plural(nTerr,'territory','territories')}`}</span></div>
    <div class="n">${E(S.st||listAnd(sc.sts))} · Bayer's machines on the sheet</div></div>`;
  const tiles = mcTile
    + tile('Ran '+E(dw),'Ran',fmtN(F.ran),F.n,`${Math.round(ranP)}% of machines`,ranP)
    + tile('Breakdown','Breakdown',fmtN(F.brk),F.n,`on ${E(day)}${brkRan?` · ${brkRan} still sprayed`:''}`)
    + tile('Operators mapped','Operators',fmtN(F.op),F.n,F.n-F.op?`${F.n-F.op} not mapped`:'every machine has one',F.opPct);
  const ta=stale?tone('Stale'):tone('Acres');
  const acres=`<div class="card acard" style="background:${ta.bg};border-color:${ta.bd}">
    <div><div style="display:flex;align-items:baseline;gap:7px;font-size:14px;font-weight:600"><i style="width:8px;height:8px;border-radius:50%;background:${ta.dot}"></i>Acres sprayed</div>
      <div style="font-size:${ph?28:30}px;font-weight:600;margin-top:6px;color:${ta.vc}">${acF(F.acY)}<span class="u"> ac</span></div><div style="font-size:12.5px;color:var(--ink2)">on ${E(day)} · ${fmtN(F.ran)} machines ran</div>
      ${stale?`<div class="warn">⚠ the sheet's acres stop at ${E(dPretty(D.sp.lastDate))}</div>`:''}</div>
    <div><div style="font-size:12.5px;font-weight:500;color:var(--ink2)">Season</div><div style="font-size:22px;font-weight:600;margin-top:6px">${acF(F.acAll)}<span class="u"> ac</span></div>
      <div style="font-size:12.5px;color:var(--ink2)">${E(dPretty(D.sp.firstDate))} – ${E(day)} · ${F.n?acF(F.acAll/F.n):0} ac per machine</div></div>
    </div>`;
  return `<div class="groups"><section aria-label="Machines"><div class="glbl"><b>Machines</b><span>${E(day)}</span></div><div class="mcgrid">${tiles}</div>${brkHTML(sc)}</section>
    <section aria-label="Acres"><div class="glbl"><b>Acres</b><span>${E(day)}</span></div>${acres}</section></div>`;
}
// The machines carrying a breakdown_id on the picked day, under the page's filters. Closed by default.
function brkHTML(sc){
  const d=sc.d, day=dPretty(d), ph=isPhone();
  const list=sc.list.filter(m=>m.f.brk).sort((a,b)=>a.terr.localeCompare(b.terr)||a.mc.localeCompare(b.mc));
  if(!list.length) return '';
  const ran=m=>m.f.acY>0?`<span class="ok">✓ ${acF(m.f.acY)} ac</span>`:'<span class="mu">Idle</span>';
  const head=`<button type="button" class="bkh" data-act="brk" aria-expanded="${S.brk}"><span style="flex:1;min-width:0"><b><i style="width:8px;height:8px;border-radius:50%;background:var(--brk)"></i>Breakdown machines · ${list.length}</b>
      <span style="display:block;font-size:13px;color:var(--ink2);margin-top:2px">${E(day)}${ph?'':' · machines with a breakdown ID on the sheet'} · ${ph?'tap':'click'} a machine for who to call</span></span>
      <span style="font-size:14px;font-weight:500;white-space:nowrap">${S.brk?'Hide':'Show'} <span aria-hidden="true" style="display:inline-block;transform:rotate(${S.brk?180:0}deg)">▾</span></span></button>`;
  if(!S.brk) return `<div class="card" style="margin-top:12px;overflow:hidden">${head}</div>`;
  if(ph) return `<div class="card" style="margin-top:12px;overflow:hidden">${head}<div class="bkm">${list.map(m=>`<button type="button" class="mcbtn" data-act="mc" data-mc="${E(m.mc)}" style="background:var(--head)">
      <span class="a"><b class="mono" style="font-size:13.5px">${E(m.mc)}</b> <span class="bd" style="display:inline;font-size:13px">! ${E(m.f.brk)}</span><span style="color:var(--ink)">${E(m.terr)}${m.vil?' · '+E(m.vil):''}</span><span>${hasOp(m)?E(m.op||m.opMob):noOp} · ${ran(m)}</span></span><span aria-hidden="true" style="color:var(--ink3)">›</span></button>`).join('')}</div></div>`;
  return `<div class="card" style="margin-top:12px;overflow:hidden">${head}<div style="overflow-x:auto">
    <div class="bkrow hd"><span>Machine</span><span>Breakdown ID</span><span>Territory</span><span>Operator</span><span>CCM</span><span style="text-align:right">${E(dayShort(d))}</span></div>
    ${list.map(m=>`<div class="bkrow"><span><button type="button" class="mcb" data-act="mc" data-mc="${E(m.mc)}">${E(m.mc)}</button></span><span class="bd mono" style="font-size:12.5px">! ${E(m.f.brk)}</span>
      <span>${E(m.terr)}</span><span>${hasOp(m)?E(m.op||m.opMob):noOp}</span><span>${m.tm?E(m.tm):'<i class="mu">not on the sheet</i>'}</span><span style="text-align:right">${ran(m)}</span></div>`).join('')}</div></div>`;
}

function controlsHTML(sc){
  const ph=isPhone(), d=sc.d, y=istDay(-1);
  const sel=(id,label,cur,all,opts)=>`<select class="sel" id="${id}" aria-label="${label}"><option value="">${all}</option>${opts.map(o=>`<option value="${E(o)}"${o===cur?' selected':''}>${E(o)}</option>`).join('')}</select>`;
  const sortSel=`<select class="sel" id="fSort" aria-label="Sort by"${ph?' style="width:100%;max-width:none"':''}>${SORTS.map(([k,l])=>`<option value="${k}"${k===S.sort?' selected':''}>Sort: ${E(l.replace('the day',dayShort(d)))}</option>`).join('')}</select>`;
  const search=`<div class="srch">${IC.search}<input id="fQ" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ph?'Search machine, operator, FO…':'Search machine, village, operator, FO, CCM'}" value="${E(S.q)}" aria-label="Search"></div>`;
  const csv=`<button type="button" class="csv" data-act="csv" title="Download the ${sc.list.length} machines shown as CSV">${IC.dl}CSV</button>`;
  const clear = sc.nF||S.q.trim() ? `<button type="button" class="ghost" data-act="clear">Clear</button>` : '';
  if(ph) return `<div class="ctl m" style="flex-wrap:nowrap">${search}<button type="button" class="fbtn${sc.nF?' on':''}" data-act="sheet" aria-label="Filters${sc.nF?`, ${sc.nF} active`:''}">${IC.filter}Filters${sc.nF?` <em>${sc.nF}</em>`:''}</button></div>
    <div class="ctl" style="margin-top:8px;flex-wrap:nowrap"><div style="flex:1;min-width:0">${sortSel}</div>${clear}${csv}</div>`;
  const f=(lab,inner)=>`<label class="fld"><span>${lab}</span>${inner}</label>`;
  return `<div class="ctl">${f('Day',`<div style="display:flex;gap:8px;align-items:center"><div class="segb" role="group" aria-label="Day"><button type="button" data-act="yday" aria-pressed="${d===y}">Yesterday</button></div>
        <input class="sel" type="date" id="fDay" aria-label="Pick a day" min="${E(D.sp.firstDate)}" max="${E(y)}" value="${E(d)}"></div>`)}
      ${sc.sts.length>1?f('State',sel('fSt','State',S.st,'All states',sc.sts)):''}
      ${f('Territory',sel('fTerr','Territory',S.terr,'All territories',sc.terrs))}${f('CCM',sel('fTm','CCM',S.tm,'All CCMs',sc.tms))}${f('Sort',sortSel)}</div>
    <div class="ctl" style="margin-top:16px">${search}${clear}<div style="flex:1"></div>${stampTxt()}${csv}</div>`;
}
// The phone's Filters sheet: the same field ids, so the same change handler covers it.
function sheetHTML(sc){
  const d=sc.d, y=istDay(-1);
  const sel=(id,label,cur,all,opts)=>`<label class="fld"><span>${label}</span><select class="sel" id="${id}" aria-label="${label}"><option value="">${all}</option>${opts.map(o=>`<option value="${E(o)}"${o===cur?' selected':''}>${E(o)}</option>`).join('')}</select></label>`;
  return `<div class="scrim" data-act="closesheet"></div><div class="drawer fsheet" role="dialog" aria-modal="true" aria-label="Filters">
    <div class="dhead"><div class="grab"></div><div class="row2"><div style="flex:1;font-size:18px;font-weight:600">Filters</div><button type="button" class="x" data-act="closesheet" id="sClose" aria-label="Close">${IC.close}</button></div></div>
    <div class="dbody" id="sheetBody">
      <label class="fld"><span>Day</span><div style="display:flex;gap:8px"><div class="segb" role="group" aria-label="Day"><button type="button" data-act="yday" aria-pressed="${d===y}">Yesterday</button></div>
        <input class="sel" type="date" id="fDay" aria-label="Pick a day" min="${E(D.sp.firstDate)}" max="${E(y)}" value="${E(d)}" style="flex:1;min-width:0"></div></label>
      ${sc.sts.length>1?sel('fSt','State',S.st,'All states',sc.sts):''}

const TCOLS = d => [['name',S.page==='terr'?'Territory · CCM':'CCM · FO'],['n','Machines'],['brk','Breakdown'],['ran','Ran '+dayShort(d)],['opPct','Operator mapped'],['acY','Acres '+dayShort(d)],['acAll','Season acres']];
const sortName = d => ((SORTS.find(([k])=>k===S.sort)||[])[1]||'').replace('the day',dayShort(d)).toLowerCase();
function listDesk(nodes, sc){
  const hd=`<div class="row hd">${TCOLS(sc.d).map(([k,t])=>`<button type="button" data-act="sort" data-k="${k}" aria-sort="${S.sort===k?'descending':'none'}">${E(t)}${S.sort===k?' ↓':''}</button>`).join('')}</div>`;
  const ofC=(k,n,col)=>`<div class="of"><span><b style="font-weight:500">${fmtN(k)}</b><span class="mu"> of ${fmtN(n)}</span></span>${bar(n?100*k/n:null,col)}</div>`;
  const seasonC=(v,n)=>`<div class="of"><b style="font-weight:600">${acF(v)}</b>${n>1?`<span class="mu" style="font-size:12.5px">${acF(v/n)} ac per machine</span>`:''}</div>`;
  const gRow=(x,lv)=>{
    const ppl = x.people ? (x.people.length?'<b class="lab">CCM</b> '+x.people.map(p=>`<span style="color:var(--ink)">${E(p.n||'—')}</span>${telA(p.mob)}`).join(', '):'<i>No CCM on the sheet</i>') : '';
    const sub=[x.sub?E(x.sub):'', S.page==='terr'&&!S.st?E(x.st):'', ppl].filter(Boolean).join(' · ');
    return `<div class="row g${lv?' l1':''}${x.none?' none':''}" data-act="exp" data-k="${E(x.key)}" role="button" tabindex="0" aria-expanded="${isOpen(x,sc.q)}">
      <div class="nm" style="padding-left:${lv*20}px">${IC.chev}<div style="min-width:0"><div class="t">${x.lab?`<b class="lab">${x.lab}</b>`:''}<span title="${E(x.name)}">${E(x.name)}${x.people?'':telA(x.mob)}</span>${x.tag?`<span class="lab" style="border:1px solid var(--line);border-radius:5px;padding:0 5px">${E(x.tag)}</span>`:''}</div>
        ${sub?`<div class="s">${sub}</div>`:''}${x.warn?`<div class="warn" style="margin-top:3px">⚠ ${E(x.warn)}</div>`:''}</div></div>
      <span class="num">${fmtN(x.f.n)}</span><span class="num ${x.f.brk?'bd':'mu'}">${fmtN(x.f.brk)}</span>${ofC(x.f.ran,x.f.n,'var(--act)')}${ofC(x.f.op,x.f.n,'var(--op)')}
      <span class="num">${acF(x.f.acY)}</span>${seasonC(x.f.acAll,x.f.n)}</div>`; };
  const mRow=(m,lv)=>{
    return `<div class="row m"><div style="min-width:0;padding-left:${22+lv*20}px"><button type="button" class="mcb" data-act="mc" data-mc="${E(m.mc)}">${E(m.mc)}</button>
        <div class="mu" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(m.vil||'')}${S.page==='terr'&&m.fo?(m.vil?' · ':'')+'FO '+E(m.fo):''}</div></div>
      <span></span><span class="num bd" style="font-size:12.5px">${m.f.brk?`! <span class="mono">${E(m.f.brk)}</span>`:''}</span>
      <span class="num" style="font-size:13px">${m.f.acY>0?'<span class="ok">✓ Ran</span>':'<span class="mu">Idle</span>'}</span>
      <span class="num" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${hasOp(m)?E(m.op||m.opMob):noOp}</span>
      <span class="num">${acF(m.f.acY)}</span>${seasonC(m.f.acAll,1)}</div>`; };
  const kids=(x,lv)=>!isOpen(x,sc.q) ? '' : x.kids ? x.kids.map(k=>gRow(k,lv+1)+kids(k,lv+1)).join('')
    : x.groups.map(g=>(g.label?`<div class="glab" style="padding-left:${52+lv*20}px">${E(g.label)}</div>`:'')+g.mcs.map(m=>mRow(m,lv)).join('')).join('');
  const count=nodes.filter(x=>!x.none).length;
  return `<div class="card" style="overflow:hidden;margin-top:16px"><div class="lhead"><b>${S.page==='terr'?'Territories':'CCMs'} · ${count}</b>
      <div>Sorted by ${E(sortName(sc.d))} · ${S.page==='terr'?'click a territory for its machines':'click a CCM for his FOs, an FO for his machines'}, a machine number for its details</div></div>
    <div class="tbl"><div>${hd}${nodes.map(x=>gRow(x,0)+kids(x,0)).join('')}</div></div></div>`;
}
function listPhone(nodes, sc){
  const dw=dayWord(sc.d);
  const of=(k,n)=>`${fmtN(k)}<span style="font-size:12px;font-weight:500;color:var(--ink2)"> /${fmtN(n)}</span>`;
  const fig=x=>`<div class="big"><span><b>${acF(x.f.acAll)}</b> <span style="font-size:13.5px;color:var(--ink2)">ac season</span></span><span style="font-size:13px;color:var(--ink2)">${x.f.n?acF(x.f.perMc):0} ac per machine</span></div>
    <div class="sg"><div><b>${fmtN(x.f.n)}</b><span>machines</span></div><div><b${x.f.brk?' class="bd"':''}>${fmtN(x.f.brk)}</b><span>breakdown</span></div><div><b>${of(x.f.ran,x.f.n)}</b><span>ran ${E(dw)}</span></div>
      <div><b>${acF(x.f.acY)}</b><span>ac ${E(dw)}</span></div><div style="grid-column:span 2"><b>${of(x.f.op,x.f.n)}</b><span>operators mapped</span></div></div>`;
  const mcBtn=m=>`<button type="button" class="mcbtn" data-act="mc" data-mc="${E(m.mc)}"><span class="a"><b class="mono" style="font-size:13.5px">${E(m.mc)}</b>
      <span>${hasOp(m)?E(m.op||m.opMob):noOp}${m.vil?' · '+E(m.vil):''}</span>${m.f.brk?`<span class="bd" style="font-size:12.5px">! Breakdown ${E(m.f.brk)}</span>`:''}</span>
    <span class="b"><b style="font-size:14px;font-weight:600">${acF(m.f.acAll)} <span style="font-weight:400;color:var(--ink2)">ac season</span></b><span class="${m.f.acY>0?'ok':'mu'}">${m.f.acY>0?'✓ '+acF(m.f.acY)+' ac '+E(dw):'idle '+E(dw)}</span></span><span aria-hidden="true" style="color:var(--ink3)">›</span></button>`;
  const head=(x,lv)=>{ const sub=[x.sub?E(x.sub):'',S.page==='terr'&&!S.st?E(x.st):''].filter(Boolean).join(' · ');
    return `<div class="nch"><div style="flex:1;min-width:0">${x.lab?`<div class="lab" style="font-size:12px">${x.lab}</div>`:''}<div class="nmx" style="font-size:${lv?15:16}px">${E(x.name)}</div>
      ${sub?`<div class="sub">${sub}</div>`:''}${x.tag?`<div class="lab" style="margin-top:4px">${E(x.tag)}</div>`:''}${x.warn?`<div class="warn" style="margin-top:3px">⚠ ${E(x.warn)}</div>`:''}</div>${x.people?'':callBtn(x.mob,x.name)}</div>`; };
  const people=x=>!x.people ? '' : `<div class="box">${x.people.length?x.people.map(p=>`<div class="prow"><span class="r" style="width:34px;font-weight:600">CCM</span><div class="who"><div class="p">${E(p.n||'—')}</div></div>${callBtn(p.mob,p.n)}</div>`).join(''):'<div class="prow mu" style="font-size:13px">No CCM on the sheet</div>'}</div>`;
  const tText=x=>x.kids ? x.sub : `${x.f.n} machine${x.f.n===1?'':'s'}`;
  const tog=x=>{ const o=isOpen(x,sc.q); return `<button type="button" class="tog" data-act="exp" data-k="${E(x.key)}" aria-expanded="${o}">${o?'Hide':'Show'} ${E(tText(x))} <span aria-hidden="true" style="display:inline-block;transform:rotate(${o?180:0}deg)">▾</span></button>`; };
  const kids=x=>!isOpen(x,sc.q) ? '' : `<div style="display:flex;flex-direction:column;gap:${x.kids?10:8}px">${x.kids ? x.kids.map(k=>`<div class="kid"${k.none?' style="border-color:#F1E2BC;background:#FFFBF2"':''}>${head(k,1)}${fig(k)}${tog(k)}${kids(k)}</div>`).join('')
    : x.groups.map(g=>(g.label?`<div class="lab" style="margin:6px 2px 0;font-size:12px">${E(g.label)}</div>`:'')+g.mcs.map(mcBtn).join('')).join('')}</div>`;
  const lim=sc.q?nodes.length:S.limit, shown=nodes.slice(0,lim);
  return `<div class="ltitle"><b>${S.page==='terr'?'Territories':'CCMs'} · ${nodes.filter(x=>!x.none).length}</b><span>by ${E(sortName(sc.d))}</span></div>`
    + shown.map(x=>`<div class="card nc${x.none?' none':''}">${head(x,0)}${fig(x)}${people(x)}${tog(x)}${kids(x)}</div>`).join('')
    + (nodes.length>shown.length?`<button type="button" class="more" data-act="more">Load more · ${shown.length} of ${nodes.length} shown</button>`:'')
    + `<div style="margin-top:12px;text-align:center">${stampTxt()}</div>`;
}

// The machine panel: what it has done, and who to call.
function panelHTML(m){
  const d=spDay(), f=m.f, ph=isPhone();
  const stat=(l,v,n)=>`<div class="stat"><div class="l">${l}</div><div class="v">${v}</div>${n?`<div class="n">${n}</div>`:''}</div>`;
  const ago=m.ping?Math.round((Date.parse(istDay(0))-Date.parse(m.ping))/864e5):null;
  const person=(role,n,mob)=>`<div class="prow"><div class="who"><div class="r">${role}</div><div class="p">${n?E(n):'<i class="mu" style="font-weight:400">Not on the sheet</i>'}</div>${mob?`<div class="tel">${mob}</div>`:''}</div>${callBtn(mob,n)}</div>`;
  const loc = m.lat!=null
    ? `<div class="box"><div class="prow"><div class="who"><div class="mono" style="font-size:13px">${m.lat.toFixed(5)}, ${m.lon.toFixed(5)}</div><div class="r">Last ping position${m.ping?' · '+dPretty(m.ping):''}</div></div>
        <a class="go" href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}" target="_blank" rel="noopener">Navigate</a></div></div>`
    : `<div class="box"><div class="prow mu" style="font-size:13px">The sheet has no usable position for this machine.</div></div>`;
  const body=`<div class="stats">
      ${stat('Season acres',acF(f.acAll)+'<span class="u"> ac</span>',`${dPretty(D.sp.firstDate)} – ${dPretty(d)}`)}
      ${stat('Acres '+dayWord(d),acF(f.acY)+'<span class="u"> ac</span>',f.acY>0?'<span class="ok">✓ Ran</span>':'Idle')}
      ${stat('Breakdown',f.brk?`<span class="bd">ID <span class="mono">${E(f.brk)}</span></span>`:'None',dPretty(d))}
      ${stat('Operator',hasOp(m)?'Mapped':'<span class="bd">Not mapped</span>',hasOp(m)?'':'no operator on the sheet')}
      ${stat('Days sprayed',fmtN(f.nDays),f.lastRun?'last on '+dPretty(f.lastRun):'none yet')}
      ${stat('Last ping',m.ping?dPretty(m.ping):'—',ago==null?'no ping on the sheet':ago<=0?'today':ago===1?'1 day ago':ago+' days ago')}
    </div>
    <div class="sect">Village</div><div class="box"><div class="prow" style="min-height:48px;font-weight:600;font-size:14px">${m.vil?E(m.vil):'<i class="mu" style="font-weight:400">Not on the sheet</i>'}</div></div>
    <div class="sect">Who to call</div><div class="box">${person('Operator',m.op,m.opMob)}${person('Cluster officer (CI)',m.ci,m.ciMob)}${person('Area manager',m.am,m.amMob)}${person('Field officer',m.fo,m.foMob)}${person('CCM',m.tm,m.tmMob)}</div>
    <div class="sect">Location</div>${loc}`;
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Machine ${E(m.mc)}">
    <div class="dhead">${ph?'<div class="grab"></div>':''}<div class="row2" style="display:flex;gap:12px;align-items:flex-start;width:100%"><div style="flex:1;min-width:0"><div class="mc">${E(m.mc)}</div>
      <div class="w">${E(m.terr)}, ${E(m.st)}${m.tm?' · CCM '+E(m.tm):''}</div></div><button type="button" class="x" data-act="close" id="pClose" aria-label="Close">${IC.close}</button></div></div>
    <div class="dbody" id="pBody">${body}</div></aside>`;
}

function csvDownload(name, head, rows){
  const esc = v => { let s=String(v==null?'':v); if(/^[=+\-@]/.test(s)) s="'"+s; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt='﻿'+[head,...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=name+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
// One line per machine shown, with the same figures as the page.
function doCSV(){
  const sc=scope(), d=sc.d, w=dPretty(d);
  csvDownload(`Bayer-${PAGES[S.page].slug}_${d}`, ['State','Territory','CCM','CCM mobile','FO','FO mobile','Machine','Village','Operator','Operator mobile','Cluster officer','CO mobile','Area manager','AM mobile',
      `Ran (${w})`,`Acres sprayed (${w})`,`Season acres to ${w}`,`Breakdown ID (${w})`,'Last ping'],
    sc.list.slice().sort((a,b)=>a.st.localeCompare(b.st)||a.terr.localeCompare(b.terr)||a.mc.localeCompare(b.mc)).map(m=>[m.st,m.terr,m.tm,m.tmMob,m.fo,m.foMob,m.mc,m.vil,m.op,m.opMob,m.ci,m.ciMob,m.am,m.amMob,
      m.f.acY>0?'Yes':'No', Math.round(m.f.acY*10)/10, Math.round(m.f.acAll*10)/10, m.f.brk, m.ping]));
}

/* ================================ render ================================ */
function scopeLine(){ return D.sp ? `Bayer machines · ${listAnd(uniq(D.sp.machines.map(m=>m.st)))} · from ${dPretty(D.sp.firstDate)}` : 'Bayer machines'; }
function bodyHTML(){
  if(!D.sp) return D.err ? `<div class="card msg">Bayer's sheet could not be loaded (${E(D.err)}).<div style="margin-top:12px"><button type="button" class="ghost" data-act="retry">Try again</button></div></div>`
    : `<div class="card" style="padding:20px 22px">${'<div class="skel"></div>'.repeat(4)}</div><div class="card" style="padding:20px 22px;margin-top:16px">${'<div class="skel"></div>'.repeat(6)}</div>`;
  const sc=scope(), F=figs(sc.list), nodes=tree(sc.list), ph=isPhone();
  const list = !nodes.length ? `<div class="card msg" style="margin-top:16px">Nothing matches these filters.<div style="margin-top:12px"><button type="button" class="ghost" data-act="clear">Clear filters</button></div></div>`
    : ph ? listPhone(nodes, sc) : listDesk(nodes, sc);
  return ph ? stripHTML(F, sc) + controlsHTML(sc) + list : controlsHTML(sc) + stripHTML(F, sc) + list;
}
let _ov='';
function render(){
  const app=document.getElementById('app'); if(app.style.display==='none') return;
  const ph=isPhone(), P=PAGES[S.page];
  document.title=P.title+' · Bayer partner view';
  const nav=Object.keys(PAGES).map(k=>`<button type="button" class="nav" data-page="${k}"${k===S.page?' aria-current="page"':''}>${IC[k]}<span>${PAGES[k].short}</span></button>`).join('');
  const mnav=Object.keys(PAGES).map(k=>`<button type="button" data-page="${k}"${k===S.page?' aria-current="page"':''}><span>${IC[k].replace('<svg','<svg width="20" height="20"')}</span>${PAGES[k].short}</button>`).join('');
  const body=bodyHTML();   // computes every machine's figures for the picked day before the panel reads them
  const m = S.sel && D.sp ? D.sp.machines.find(x=>x.mc===S.sel) : null; if(S.sel && D.sp && !m) S.sel=null;
  const ov = m ? panelHTML(m) : (S.sheet && ph && D.sp) ? sheetHTML(scope()) : '';
  const ovKey = m ? 'mc:'+m.mc : ov ? 'sheet' : '';
  const html=`<div class="shell">
    <aside class="rail"><div class="logo"><i>UPL</i><div><b>Ops Console</b><span>Bayer partner view</span></div></div>
      <div class="rlbl">Wheat · Bayer</div><nav aria-label="Pages">${nav}</nav>
      <div class="rfoot"><button type="button" class="nav" data-act="phone" style="color:rgba(255,255,255,.7)">${IC.phone2}<span>Phone view</span></button><button type="button" class="nav" data-act="logout" style="color:rgba(255,255,255,.7)">${IC.out}<span>Log out</span></button><div class="conf">CONFIDENTIAL</div></div></aside>
    <div class="col">
      <header class="top"><div style="flex:1;min-width:0"><h1>${P.title}</h1><div class="sc">${E(scopeLine())}</div></div></header>
      <header class="mhead"><div style="flex:1;min-width:0"><h1>${P.short}</h1><div class="sc">${E(scopeLine())}</div></div><button type="button" class="out" data-act="logout" aria-label="Log out">${IC.out}</button></header>
      <main id="main">${body}${D.sp?'<footer class="m">Built with tokens, Powered by Claude. By din8sh.</footer>':''}</main>
      <footer class="d">Built with tokens, Powered by Claude. By din8sh.</footer>
    </div></div>
    <nav class="mnav" aria-label="Pages">${mnav}</nav>${ov}`;
  // Keep the focused field and its caret, and every scroller's place, across the rebuild.
  const a=document.activeElement, id=a&&a.id, pos=a&&a.selectionStart, y=scrollY;
  const keep={}; ['pBody','sheetBody'].forEach(k=>{ const el=document.getElementById(k); if(el) keep[k]=el.scrollTop; });
  app.innerHTML=html;
  if(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(_){ } } }
  if(ovKey===_ov) Object.keys(keep).forEach(k=>{ const el=document.getElementById(k); if(el) el.scrollTop=keep[k]; });
  else if(ovKey){ const c=document.getElementById(m?'pClose':'sClose'); if(c) c.focus({preventScroll:true}); }
  _ov=ovKey;
  document.body.style.overflow = ov ? 'hidden' : '';
  scrollTo(0,y);
}

/* ---------- address: #/territories and #/ccm-fo (the old #/tm-fo still opens it); Back closes the machine panel first ---------- */
const pageOfHash = () => { const h=location.hash.replace(/^#\/?/,''); return h==='tm-fo' ? 'tm' : Object.keys(PAGES).find(k=>PAGES[k].slug===h)||null; };
S.page = pageOfHash() || (()=>{ try{ const t=localStorage.getItem('bayer_page'); return PAGES[t]?t:null; }catch(_){ return null; } })() || 'terr';
history.replaceState(null,'','#/'+PAGES[S.page].slug);
function goPage(k){
  if(k===S.page){ scrollTo({top:0,behavior:'smooth'}); return; }
  S.page=k; S.limit=M_PAGE; S.sel=null; S.sheet=false; try{ localStorage.setItem('bayer_page',k); }catch(_){ }
  history.pushState(null,'','#/'+PAGES[k].slug); render(); scrollTo(0,0);
}
function openPanel(mc){ S.sel=mc; S.sheet=false; history.pushState({panel:mc},'',location.hash); render(); }
function closePanel(){ if(!S.sel) return; if(history.state && history.state.panel) history.back(); else { S.sel=null; render(); } }
window.addEventListener('popstate', ()=>{
  const k=pageOfHash()||'terr';
  S.sel = history.state && history.state.panel || null;
  if(k!==S.page){ S.page=k; S.limit=M_PAGE; S.sheet=false; }
  render();
});

const app=document.getElementById('app');
app.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='fDay') S.day = t.value && t.value!==istDay(-1) ? t.value : '';
  else if(t.id==='fSt'){ S.st=t.value; S.terr=''; S.tm=''; }
  else if(t.id==='fTerr'){ S.terr=t.value; S.tm=''; }
  else if(t.id==='fTm') S.tm=t.value;
  else if(t.id==='fSort') S.sort=t.value;
  else return;
  S.limit=M_PAGE; render();
});
app.addEventListener('input', e=>{ if(e.target.id==='fQ'){ S.q=e.target.value; S.limit=M_PAGE; render(); } });
app.addEventListener('click', e=>{
  const pg=e.target.closest('[data-page]'); if(pg){ goPage(pg.dataset.page); return; }
  const act=e.target.closest('[data-act]'); if(!act) return;
  const a=act.dataset.act;
  if(a==='retry') load();
  else if(a==='logout'){ pvClose(); lock(); }
  else if(a==='phone') pvOpen();
  else if(a==='exp'){ const k=act.dataset.k; S.open[k]=!S.open[k]; render(); }
  else if(a==='mc') openPanel(act.dataset.mc);
  else if(a==='close') closePanel();
  else if(a==='sort'){ S.sort=act.dataset.k; render(); }
  else if(a==='yday'){ S.day=''; S.limit=M_PAGE; render(); }
  else if(a==='brk'){ S.brk=!S.brk; render(); }
  else if(a==='more'){ S.limit+=M_PAGE; render(); }
  else if(a==='sheet'){ S.sheet=true; render(); }
  else if(a==='closesheet'){ S.sheet=false; render(); }
  else if(a==='clear'){ Object.assign(S,{day:'',st:'',terr:'',tm:'',q:'',limit:M_PAGE}); render(); }
  else if(a==='csv') doCSV();
});
// Phone view: the same page at phone width in a frame. Same origin and tab, so the frame shares the PIN session.
function pvOpen(){ const f=document.getElementById('pvFrame'); f.src=location.pathname+'#/'+PAGES[S.page].slug; document.getElementById('pv').style.display='flex'; document.body.style.overflow='hidden'; document.getElementById('pvClose').focus(); }
function pvClose(){ const v=document.getElementById('pv'); if(v.style.display!=='flex') return; v.style.display='none'; document.getElementById('pvFrame').src='about:blank'; document.body.style.overflow=''; }
document.getElementById('pvClose').addEventListener('click', pvClose);
document.getElementById('pv').addEventListener('click', e=>{ if(e.target.id==='pv') pvClose(); });
// A group row is a div with role=button: Enter and Space open it, as a click would.
app.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.row.g')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(document.getElementById('pv').style.display==='flex') pvClose(); else if(S.sel) closePanel(); else if(S.sheet){ S.sheet=false; render(); } } });
// Desktop table ↔ phone cards: re-render when the window crosses the breakpoint.
matchMedia('(max-width:820px)').addEventListener('change', ()=>render());

if(gateValid()){ const o=gateRead(); arm(GATE.TTL_MS-(Date.now()-o.at)); show(); } else lock();
</script>
