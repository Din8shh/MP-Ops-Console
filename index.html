     area manager and carry the person accountable for them; the trend rows are state-level movement against last
     season. Keeping them apart is what allows ten visible rows to read faster than the old five did. */
  /* An AM row already leads with the manager's name, so repeating it under the row reads as a stutter. When the
     title already contains the owner, the line carries the role and the number only. */
  const ownerLine=(o,title)=>{
    if(!o||!o.name) return '';
    const dupe = title && title.indexOf(o.name)>=0;
    return `<div style="font-size:11px;color:#9C988F;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 8px">
      <span>${E(o.role)}${dupe?'':` <strong style="color:#6E6A62;font-weight:600">${E(o.name)}</strong>`}</span>
      ${o.phone?`<span style="font-family:'IBM Plex Mono'">${E(o.phone)}</span>`:''}</div>`;
  };
  const sigRow=(x,i)=>`<div ${x.drill?`data-act="insdrill" data-key="${E(x.drill)}"`:''} style="display:flex;gap:11px;padding:${mob?'12px 15px':'12px 16px'};border-top:${i?'1px solid #F4F2EE':'none'};${x.drill?'cursor:pointer':''}">
      <span style="width:8px;height:8px;border-radius:50%;background:${x.tone==='good'?C.act:x.tone==='bad'?C.brk:C.idle};margin-top:5px;flex-shrink:0"></span>
      <div style="min-width:0;flex:1">
        <div style="font-size:12.5px;font-weight:700;line-height:1.35">${E(x.title)}</div>
        <div style="font-size:11.5px;color:#6E6A62;margin-top:3px;line-height:1.5">${E(x.detail)}</div>
        ${ownerLine(x.owner,x.title)}
      </div></div>`;
  const sigGroup=(key,label,note,rows,show,collapsed)=>{
    if(!rows.length) return '';
    const open=!!(state.insMore&&state.insMore[key]), vis=open?rows:(collapsed||rows.slice(0,show)), rest=rows.length-vis.length;
    return `<div style="padding:11px 16px 9px;border-top:1px solid #EFEDE7;background:#FBFAF8">
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase">${label}</div>
        <div style="font-size:11px;color:#B6B1A8;margin-top:3px">${note}</div></div>
      ${vis.map(sigRow).join('')}
      ${rest>0||open?`<div data-act="insmore" data-key="${key}" style="padding:10px 16px;border-top:1px solid #F4F2EE;text-align:center;cursor:pointer;font-size:11.5px;font-weight:600;color:#6E6A62">${open?'Show fewer':`Show ${rest} more`}</div>`:''}`;
  };
  const alertRow = sig.alert ? `<div style="display:flex;gap:11px;padding:13px 16px;background:#FDF3F1;border-bottom:1px solid #F4D8D3">
      <span style="width:8px;height:8px;border-radius:50%;background:${C.brk};margin-top:5px;flex-shrink:0"></span>
      <div style="min-width:0">
        <div style="font-size:12.5px;font-weight:700;line-height:1.35">${E(sig.alert.title)}</div>
        <div style="font-size:11.5px;color:#6E6A62;margin-top:3px;line-height:1.5">${E(sig.alert.detail)}</div>
      </div></div>` : '';
  const sigCard = (sig.alert||sig.peer.length||sig.trend.length) ? card(`${cHead('What changed',
      'Read off the sheet each morning · the rows change as the data does')}
    ${alertRow}
    ${sigGroup('peer','Clusters and area managers','Measured against the other clusters in the same state',sig.peer,INS_SIG.PEER_SHOW,sig.peerTop)}
    ${sigGroup('trend','States, against last season','Measured against the same days of last season',sig.trend,INS_SIG.TREND_SHOW)}`) : '';

  /* ---------- 2 · trajectory (reuses the snake engine + its hover wiring) ---------- */
  let traj;
  if(!s){ traj=''; }
  else{
    const chart=buildSnakeSVG(A.snCode,0,s.off,mob);
    const legend=SNAKE_FYS.map(fy=>{ const d=snakeDenseFor(A.snCode,fy.key), val=d[s.off];
      return `<div style="display:flex;align-items:center;gap:8px">
        <span style="width:14px;height:${fy.cur?4:3}px;border-radius:2px;background:${fy.color};flex-shrink:0"></span>
        <span style="font-size:12px;font-weight:${fy.cur?700:500};color:#46433d">${fy.label}</span>
        <span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600">${val!=null?fmt(val):'—'}</span></div>`; }).join('');
    const gapStrip = s.hist.length>1 ? `<div style="display:flex;border-top:1px solid #EFEDE7">${s.hist.map((h,i)=>`
        <div style="flex:1;padding:10px 4px;text-align:center;${i?'border-left:1px solid #F4F2EE':''}">
          <div style="font-size:10px;color:#9C988F">${E(snakeOffLabel(h.off))}</div>
          <div style="font-family:'IBM Plex Mono';font-size:${mob?'12px':'13.5px'};font-weight:700;margin-top:3px;color:${h.pct>=0?C.greenD:C.brk}">${h.pct>=0?'+':'−'}${Math.abs(h.pct).toFixed(1)}%</div>
        </div>`).join('')}</div>` : '';
    traj=card(`${cHead('The season so far in '+E(A.regionName),'Acres added up day by day since 1 April, against the two seasons before it')}
      <div style="display:flex;gap:${mob?'12px':'22px'};flex-wrap:wrap;padding:11px 16px 4px">${legend}</div>
      <div id="snakeHost" style="position:relative;padding:2px ${mob?'2px':'8px'} 10px">
        ${chart.hasData?chart.svg:waiting(false,'No cumulative data yet.','snakeretry')}
        <div id="snakeTip" style="position:absolute;display:none;pointer-events:none;background:#fff;border:1px solid #E9E6DF;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.10);padding:8px 10px;min-width:132px;z-index:5"></div>
      </div>
      ${gapStrip?`<div style="padding:0 16px 4px;font-size:10px;font-weight:600;letter-spacing:.06em;color:#9C988F;text-transform:uppercase">How the gap has moved, week by week</div>${gapStrip}`:''}`);
  }

  /* ---------- 3 · momentum ---------- */
  let mom='';
  if(s){
    const bars=buildInsBarsSVG(A,mob), spark=buildInsSparkSVG(A);
    const legend=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:3px;background:${INS_CUR.color}"></span><span style="font-size:11.5px;font-weight:600">This season</span><span style="font-family:'IBM Plex Mono';font-size:11.5px;color:#6E6A62">${s.roll7!=null?fmt(s.roll7):'—'}/day</span></div>
        <div style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:3px;background:${INS_PREV.color};opacity:.5"></span><span style="font-size:11.5px;font-weight:600">Last season</span><span style="font-family:'IBM Plex Mono';font-size:11.5px;color:#6E6A62">${s.roll7Prev!=null?fmt(s.roll7Prev):'—'}/day</span></div>
        ${s.momentum!=null?dpill(s.momentum):''}</div>`;
    mom=card(`${cHead('Each day, this season against last','The same days of both seasons side by side, over the past '+(mob?14:21)+' days')}
      <div style="padding:11px 16px 2px">${legend}</div>
      <div style="padding:2px ${mob?'2px':'8px'} 8px">${bars.has?bars.svg:waiting(false,'No day-wise data yet.','snakeretry')}</div>
      ${spark.has?`<div style="border-top:1px solid #EFEDE7;padding:12px 16px 14px">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px">
          <span style="font-size:11.5px;font-weight:700">Machines working each day</span>
          <span style="font-size:10.5px;color:#9C988F">past 60 days · ${fmt(s.machToday)} now, ${fmt(s.machPeak)} at the busiest</span></div>
        ${spark.svg}</div>`:''}`);
  }

  /* ---------- 4 · fleet ---------- */
  const stat=(v,l,ink,sub)=>`<div style="flex:1 0 auto;min-width:${mob?'44%':'150px'};padding:13px 16px;border-right:1px solid #EFEDE7;border-bottom:1px solid #EFEDE7">
      <div style="font-family:'IBM Plex Mono';font-size:${mob?'18px':'20px'};font-weight:700;color:${ink||C.ink}">${v}</div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase;margin-top:5px">${l}</div>
      ${sub?`<div style="font-size:10.5px;color:#B6B1A8;margin-top:3px">${sub}</div>`:''}</div>`;
  const runInk = f.runPct>=40?C.act : f.runPct>=20?C.idle : C.brk;
  const fleet=card(`${cHead('The fleet yesterday','From the machine sheet · '+fmt(f.deployed)+' of the '+fmt(f.total)+' machines on the books are deployed')}
    <div style="display:flex;flex-wrap:wrap;background:#FBFAF8">
      ${stat(fmt(f.ran),'machines worked',runInk, Math.round(f.runPct)+'% of those deployed')}
      ${stat(fmt(f.acresY),'acres covered',C.orangeD, f.ran?fmt(f.acresY/f.ran)+' acres each':'')}
      ${stat(fmt(f.breakdown),'flagged broken down',f.breakdown?C.brk:C.ink, Math.round(f.bdPct)+'% of those deployed')}
      ${stat(fmt(f.neverRan),'never sprayed',f.neverRan?C.idle:C.ink,'not one acre since April')}
      ${stat(fmt(f.noOp),'no driver assigned',f.noOp?C.idle:C.ink,'nobody named on the sheet')}
      ${stat(fmt(f.kharif),'kharif acres',C.ink,'the season total on the machine sheet')}
    </div>`);

  /* ---------- 5 · product mix ---------- */
  let prodCard;
  if(!P){
    prodCard=card(`${cHead('Product mix','Product data tab')}${waiting(PROD.error,PROD.error?'Could not load the Product data tab.':'Loading product mix…','productretry')}`);
  } else if(P.naOrg || !P.ytd){
    prodCard=card(`${cHead('Product mix','Product data tab')}${waiting(false,P.naOrg?'The product tab only splits UPL and SWAL — nothing to show for an Open-scoped login.':'No product acres recorded yet.','productretry')}`);
  } else {
    const uP=P.ytd?P.upl/P.ytd*100:0, sP=100-uP;
    const lbl=(pct,side)=> pct>=14?`<span style="position:absolute;${side}:10px;top:50%;transform:translateY(-50%);color:#fff;font-size:11px;font-weight:700;font-family:'IBM Plex Mono'">${Math.round(pct)}%</span>`:'';
    const split = A.scoped ? '' : `<div style="padding:14px 16px 4px">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:9px"><span style="font-size:11.5px;font-weight:700">UPL vs SWAL</span><span style="font-size:10.5px;color:#9C988F">${fmt(P.upl)} ac · ${fmt(P.swal)} ac</span></div>
        <div style="position:relative;display:flex;height:30px;border-radius:8px;overflow:hidden;background:#F2F0EB">
          <div style="position:relative;width:${uP}%;background:${C.orange}">${lbl(uP,'left')}</div>
          <div style="position:relative;width:${sP}%;background:${C.green}">${lbl(sP,'right')}</div></div></div>`;
    const col=(title,list,colour,n)=>`<div style="flex:1;min-width:${mob?'100%':'240px'};padding:12px 16px">
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;margin-bottom:4px">${title}</div>
        ${list.slice(0,n).map(x=>barRow(E(x.key||x.disp), x.ytd, list[0].ytd, colour)).join('') || `<div style="font-size:11.5px;color:#B6B1A8;padding:8px 0">—</div>`}</div>`;
    const brandList=P.brands.map(b=>({key:b.disp, ytd:b.ytd, company:b.company}));
    prodCard=card(`${cHead('What has been sprayed this season',
        `${fmt(P.ytd)} acres can be traced to a named brand${P.coverage!=null?`, which is ${Math.round(P.coverage)}% of the season`:''} · ${fmt(P.nBrands)} brands across ${fmt(P.nCrops)} crops`)}
      ${split}
      <div style="display:flex;flex-wrap:wrap;border-top:${A.scoped?'none':'1px solid #EFEDE7'}">
        ${col('By crop',P.crops,C.orange,6)}
        ${col('By portfolio',P.portfolios,C.open,6)}
        ${col('Top brands',brandList,C.green,6)}
      </div>
      <div style="padding:0 16px 13px;font-size:10.5px;color:#B6B1A8">Sprayed yesterday · ${fmt(P.yday)} ac product-identified${f.acresY?` of ${fmt(f.acresY)} ac logged by the fleet`:''}</div>`);
  }

  /* ---------- 6 · state league ---------- */
  const L=A.league;
  const vsCell=v=>v==null?`<span style="color:#C9C4BA">—</span>`:`<span style="font-family:'IBM Plex Mono';font-weight:700;color:${v>=0?C.greenD:C.brk}">${v>=0?'+':'−'}${Math.abs(v).toFixed(0)}%</span>`;
  const utilInk=u=>u==null?C.ink3:u>=30?C.act:u>=15?C.idle:C.brk;
  const n1=(v,suf)=>v==null?`<span style="color:#C9C4BA">—</span>`:`${v.toFixed(v<10?1:0)}${suf||''}`;
  let league;
  /* Under a state scope the league drops a level, to TERRITORIES. Sheet1 is the only tab with that grain, so the
     season and branded-acres columns simply do not exist here — see A.terrs. */
  if(A.gst && A.terrs){
    const T=A.terrs;
    const foot = A.terrHidden ? `<div style="padding:9px 16px 12px;font-size:10.5px;color:#B6B1A8">${A.terrHidden} territor${A.terrHidden===1?'y':'ies'} with fewer than ${INS_TERR_MIN} machines are left out — too few for a percentage to mean anything.</div>` : '';
    const head=cHead(`Territories in ${E(A.regionName)}`,
      `From the machine sheet only · neither the season nor the product tab breaks down below state, so there is nothing here to compare against last year`);
    league = !T.length ? card(`${head}${waiting(false,'No territory has enough deployed machines to rank.','insrefresh')}`)
      : mob ? card(`${head}${T.map((t,i)=>`<div style="padding:12px 15px;border-top:${i?'1px solid #F4F2EE':'none'}">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="flex:1;font-size:13px;font-weight:700">${E(t.name)}</span>
            <span style="font-family:'IBM Plex Mono';font-size:13px;font-weight:700">${fmt(t.acresY)}<span style="font-size:10px;color:#B6B1A8"> ac</span></span></div>
          <div style="font-size:11px;color:#9C988F;margin-top:4px">${fmt(t.deployed)} deployed · ${fmt(t.ran)} worked (${Math.round(t.runPct)}%) · <span style="color:${t.neverPct>=50?C.brk:'#9C988F'}">${fmt(t.never)} never sprayed</span> · ${fmt(t.breakdown)} broken</div>
        </div>`).join('')}${foot}`)
      : card(`${head}
        <div style="display:grid;grid-template-columns:1.5fr .8fr .9fr 1fr .7fr .9fr;gap:10px;padding:10px 16px;border-bottom:1px solid #EFEDE7;background:#FBFAF8">
          ${['Territory','Deployed','Worked','Never sprayed','Broken','Acres'].map(h=>`<span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase">${h}</span>`).join('')}</div>
        ${T.map((t,i)=>`<div style="display:grid;grid-template-columns:1.5fr .8fr .9fr 1fr .7fr .9fr;gap:10px;align-items:center;padding:11px 16px;border-top:${i?'1px solid #F4F2EE':'none'}">
          <span style="font-size:12.5px;font-weight:600">${E(t.name)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px">${fmt(t.deployed)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;color:${utilInk(t.runPct)};font-weight:600">${fmt(t.ran)} · ${t.runPct.toFixed(0)}%</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:${t.neverPct>=50?700:400};color:${t.neverPct>=50?C.brk:C.ink}">${fmt(t.never)} · ${t.neverPct.toFixed(0)}%</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;color:${t.breakdown?C.brk:'#C9C4BA'}">${fmt(t.breakdown)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600">${fmt(t.acresY)}</span>
        </div>`).join('')}${foot}`);
  }
  // A login locked to one state would get a one-row table restating the hero — drop it rather than pad the page.
  else if(L.length<2){ league=''; }
  else if(mob){
    league=card(`${cHead('States','Biggest season so far first · tap a row to narrow the page to that state')}
      ${L.map((r,i)=>`<div data-act="insdrill" data-key="${r.code}" style="padding:12px 15px;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="flex:1;font-size:13px;font-weight:700">${E(r.name)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:13px;font-weight:700">${r.cur!=null?fmt(r.cur):'—'}</span>
          ${vsCell(r.vs)}</div>
        <div style="font-size:11px;color:#9C988F;margin-top:4px">${fmt(r.deployed)} deployed · <span style="color:${utilInk(r.util)};font-weight:600">${n1(r.util,'%')}</span> worked · ${n1(r.acRun)} acres each · ${fmt(r.breakdown)} broken${r.prodYtd!=null?` · ${fmt(r.prodYtd)} acres traced to a brand`:''}</div>
      </div>`).join('')}`);
  } else {
    // Util % and Ac/run ARE the gap decomposition — a state's shortfall is fleet × utilisation × productivity, and
    // showing all three beside vs-LY is what turns "Gujarat is −70%" into "Gujarat's fleet is idle, not missing".
    const gridCols='1.35fr .8fr .7fr .7fr .9fr .6fr .8fr';
    const th=t=>`<span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase">${t}</span>`;
    league=card(`${cHead('States','All three tabs joined · biggest season so far first · click a row to narrow the whole page to that state')}
      <div style="display:grid;grid-template-columns:${gridCols};gap:10px;padding:10px 16px;border-bottom:1px solid #EFEDE7;background:#FBFAF8">
        ${th('State')}${th('Deployed')}${th('Worked %')}${th('Acres each')}${th('Season acres')}${th('vs last yr')}${th('Named brand')}</div>
      ${L.map((r,i)=>`<div data-act="insdrill" data-key="${r.code}" style="display:grid;grid-template-columns:${gridCols};gap:10px;align-items:center;padding:11px 16px;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
        <span style="font-size:12.5px;font-weight:600">${E(r.name)}</span>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px">${fmt(r.deployed)}<span style="color:#C9C4BA">/${fmt(r.machines)}</span></span>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;color:${utilInk(r.util)}">${n1(r.util,'%')}</span>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px">${n1(r.acRun)}</span>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600">${r.cur!=null?fmt(r.cur):'—'}</span>
        ${vsCell(r.vs)}
        <span style="font-family:'IBM Plex Mono';font-size:12.5px;color:#6E6A62">${r.prodYtd!=null?fmt(r.prodYtd):'—'}</span>
      </div>`).join('')}
      <div style="padding:9px 16px 12px;font-size:10.5px;color:#B6B1A8">Util % = machines running per day (7-day mean) ÷ deployed · Ac/run = acres per running machine. With vs-LY, these separate fleet size from idleness from productivity.</div>`);
  }

  /* ---------- 7 · why the three totals differ ---------- */
  const foot=`<div style="background:#FBFAF8;border:1px solid #E9E6DF;border-radius:14px;padding:13px 16px">
      <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;margin-bottom:7px">Why this page shows three different acre totals</div>
      <div style="font-size:11.5px;color:#6E6A62;line-height:1.65">
        They come from three tabs that count different things, and none of them is wrong.
        <strong style="color:#46433d">${s?fmt(s.cur):'—'} acres</strong> is everything sprayed since 1 April, across every crop. It is the only total that can be set against last year, which is why it leads the page.
        <strong style="color:#46433d">${fmt(f.kharif)} acres</strong> is the kharif figure the machine sheet keeps, a part of that larger number.
        <strong style="color:#46433d">${P?fmt(P.ytd):'—'} acres</strong> can be traced to a named brand${P&&P.coverage!=null?`, about ${Math.round(P.coverage)}% of the season`:''}. The rest was sprayed with nothing recorded about the product.
      </div></div>`;

  return `<div style="display:flex;flex-direction:column;gap:14px">
    ${header}${hero}${sigCard}${traj}${mom}${fleet}${prodCard}${league}${foot}
    ${mob?`<div style="text-align:center;padding:2px 0 4px">${src}</div>`:''}</div>`;
}
function insightsViewHTML(v){ return `<section style="padding:18px 22px">${insightsBodyHTML(false)}</section>`; }
function productViewHTML(v){ return `<section style="padding:18px 22px">${productBodyHTML(false)}</section>`; }
// Product Insights — a self-contained page over the "Product data" tab. Controls (company / state / crop / measure)
// are page-local; the machine filter bar + KPI strip are suppressed for this view (like the Cumulative view).
function productBodyHTML(mob){
  const S=state;
  if(!PROD.loaded){
    if(!PROD.loading && !PROD.error) setTimeout(loadProduct,0);
    const msg = PROD.error ? 'Could not load the Product data tab.' : 'Loading product insights…';
    return `<div style="background:#fff;border:1px solid #E9E6DF;border-radius:14px;padding:60px 20px;text-align:center;color:#9C988F;font-size:13px">
      ${PROD.error?'⚠ ':''}${msg}${PROD.error?`<div style="margin-top:14px"><button data-act="productretry" style="padding:8px 16px;border:1px solid #E9E6DF;border-radius:9px;background:#1B1A17;color:#fff;font-size:12px;font-weight:600;cursor:pointer">Retry</button></div>`:''}</div>`;
  }
  const A=productAgg();
  const measWord = A.key==='yday' ? 'sprayed yesterday' : 'total acres · YTD';
  const cc  = c => c==='UPL'?C.orange:C.green;                         // company line/bar colour
  const cInk = c => c==='UPL'?C.orangeD:C.greenD;
  const chip = c => `<span style="display:inline-block;padding:1px 7px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;background:${c==='UPL'?C.softO:C.softG};color:${cInk(c)}">${c}</span>`;
  const card = inner => `<div style="background:#fff;border:1px solid #E9E6DF;border-radius:14px;overflow:hidden">${inner}</div>`;
  const cHead = (t,sub) => `<div style="padding:13px 16px;border-bottom:1px solid #EFEDE7"><div style="font-size:13px;font-weight:700">${t}</div>${sub?`<div style="font-size:11px;color:#9C988F;margin-top:2px">${sub}</div>`:''}</div>`;
  const emptyBox = t => `<div style="padding:34px 18px;text-align:center;color:#9C988F;font-size:12.5px">${t}</div>`;

  /* ---- controls ---- */
  const sel="height:32px;border:1px solid #E9E6DF;border-radius:8px;background:#fff;padding:0 26px 0 11px;font-family:'Noto Sans';font-size:12.5px;color:#1B1A17;cursor:pointer;outline:none";
  const labeled=(lab,inner)=>`<div style="display:flex;align-items:center;gap:7px"><span style="font-size:10px;font-weight:600;letter-spacing:.08em;color:#9C988F;text-transform:uppercase">${lab}</span>${inner}</div>`;
  const selCtrl=(id,opts,cur)=>`<div style="position:relative"><select id="${id}" style="${sel}">${optionsHTML(opts,String(cur))}</select>${I.caret}</div>`;
  const coToggle=`<div style="display:flex;background:#F2F0EB;border-radius:8px;padding:3px;gap:2px">${['ALL','UPL','SWAL'].map(c=>`<button data-act="pmco" data-co="${c}" style="${css(seg(S.pmCo===c))}">${c==='ALL'?'Both':c}</button>`).join('')}</div>`;
  const measToggle=`<div style="display:flex;background:#F2F0EB;border-radius:8px;padding:3px;gap:2px"><button data-act="pmmeasure" data-m="ytd" style="${css(seg(S.pmMeasure==='ytd'))}">Total · YTD</button><button data-act="pmmeasure" data-m="yday" style="${css(seg(S.pmMeasure==='yday'))}">Yesterday</button></div>`;
  const header=`<div style="display:flex;align-items:center;gap:${mob?'9px':'14px'};flex-wrap:wrap">
      ${labeled('Company',coToggle)}${labeled('State',selCtrl('pmStateSel',A.stateOptions,S.pmState))}${labeled('Crop',selCtrl('pmCropSel',A.cropOptions,S.pmCrop))}${labeled('Measure',measToggle)}
      <div style="flex:1"></div>
      <span style="font-size:10.5px;color:#9C988F">Product data · ${PROD.at||'—'} <button data-act="productretry" title="Reload" style="border:none;background:none;color:#6E6A62;cursor:pointer;font-size:11px;text-decoration:underline;padding:0 0 0 4px">refresh</button></span>
    </div>`;

  /* ---- hero: UPL vs SWAL head-to-head (or single-company summary under a company drill) ---- */
  const coBlock=(x,tot)=>{ const share=tot?Math.round(x.meas/tot*100):0;
    return `<div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px"><span style="width:11px;height:11px;border-radius:3px;background:${cc(x.company)}"></span><span style="font-size:13.5px;font-weight:700">${x.company}</span><span style="font-size:10.5px;color:#9C988F">${share}% share</span></div>
      <div style="font-family:'IBM Plex Mono';font-size:27px;font-weight:700;line-height:1;color:${cInk(x.company)}">${fmt(x.meas)}<span style="font-size:12px;color:#B6B1A8;font-weight:500"> ac</span></div>
      <div style="font-size:11px;color:#6E6A62;margin-top:8px">${fmt(x.nBrands)} products · ${fmt(x.nCrops)} crops</div>
      <div style="font-size:11px;color:#9C988F;margin-top:3px">Top: <span style="color:#46433d;font-weight:600">${E(x.topBrand)}</span> · ${E(x.topCrop)}</div>
    </div>`; };
  let hero;
  if(S.pmCo==='ALL'){
    const tot=A.up.meas+A.sw.meas, uP=tot?A.up.meas/tot*100:50, sP=100-uP;
    const splitLabel=(pct,side)=> pct>=14 ? `<span style="position:absolute;${side}:10px;top:50%;transform:translateY(-50%);color:#fff;font-size:11px;font-weight:700;font-family:'IBM Plex Mono'">${Math.round(pct)}%</span>`:'';
    hero=card(`<div style="padding:16px 18px">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:12px"><div style="font-size:13px;font-weight:700">UPL vs SWAL · product spray</div><div style="font-size:11px;color:#9C988F">${measWord} · ${fmt(tot)} ac total</div></div>
      <div style="position:relative;display:flex;height:34px;border-radius:8px;overflow:hidden;background:#F2F0EB;margin-bottom:16px">
        <div style="position:relative;width:${uP}%;background:${C.orange}">${splitLabel(uP,'left')}</div>
        <div style="position:relative;width:${sP}%;background:${C.green}">${splitLabel(sP,'right')}</div>
      </div>
      <div style="display:flex;gap:${mob?'18px':'34px'}">${coBlock(A.up,tot)}<div style="width:1px;background:#EFEDE7"></div>${coBlock(A.sw,tot)}</div>
    </div>`);
  } else {
    const x=S.pmCo==='UPL'?A.up:A.sw;
    hero=card(`<div style="padding:16px 18px"><div style="font-size:13px;font-weight:700;margin-bottom:12px">${x.company} · product spray <span style="font-weight:400;color:#9C988F">· ${measWord}</span></div>${coBlock(x,x.meas)}</div>`);
  }

  /* ---- KPI stat row ---- */
  const stat=(val,lab,ink)=>`<div style="flex:1 0 auto;min-width:130px;padding:13px 16px;border-right:1px solid #EFEDE7">
      <div style="font-family:'IBM Plex Mono';font-size:20px;font-weight:700;color:${ink||C.ink}">${val}</div>
      <div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase;margin-top:5px">${lab}</div></div>`;
  const stats=`<div style="background:#FBFAF8;border:1px solid #E9E6DF;border-radius:14px;display:flex;overflow-x:auto">
      ${stat(fmt(A.totYtd),'Total acres · YTD')}${stat(fmt(A.totYday),'Sprayed yesterday')}${stat(fmt(A.nProducts),'Active products')}${stat(fmt(A.nCrops),'Crops covered')}</div>`;

  /* ---- top products leaderboard ---- */
  const pMax=A.products.length?A.products[0].meas:1;
  const prodTop=A.products.slice(0,20);
  const productsCard=card(`${cHead('Top products','Brands ranked by '+measWord+(A.products.length>20?` · top 20 of ${A.products.length}`:'')+' · coloured by company')}
    ${prodTop.length? `<div style="padding:6px 16px 12px">${prodTop.map((p,i)=>`
      <div style="display:grid;grid-template-columns:20px 1fr ${mob?'62px':'74px'};align-items:center;gap:10px;padding:8px 0;border-top:${i?'1px solid #F4F2EE':'none'}">
        <span style="font-family:'IBM Plex Mono';font-size:11px;color:#C9C4BA;text-align:right">${i+1}</span>
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(p.disp)}</span>${chip(p.company)}<span style="font-size:10.5px;color:#9C988F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(p.topCrop)}</span></div>
          <span style="display:block;height:7px;border-radius:4px;background:#F2F0EB;overflow:hidden"><span style="display:block;height:100%;width:${Math.max(2,p.meas/pMax*100)}%;background:${cc(p.company)}"></span></span>
        </div>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;text-align:right">${fmt(p.meas)}</span>
      </div>`).join('')}</div>` : emptyBox('No products in this scope.')}`);

  /* ---- crop mix (hidden when a single crop is selected) ---- */
  const cropTop=A.crops.slice(0,12), cMax=A.crops.length?A.crops[0].total:1;
  const cropRow=c=>`<div style="padding:9px 0;border-top:1px solid #F4F2EE">
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><span style="flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(c.crop)}</span><span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600">${fmt(c.total)}</span></div>
      <div style="display:flex;height:7px;border-radius:4px;overflow:hidden;background:#F2F0EB">${c.UPL>0?`<span style="width:${c.UPL/cMax*100}%;background:${C.orange}"></span>`:''}${c.SWAL>0?`<span style="width:${c.SWAL/cMax*100}%;background:${C.green}"></span>`:''}</div></div>`;
  const cropCard = S.pmCrop!=='ALL' ? '' : card(`${cHead('Crop mix','Acres by crop · '+measWord+' · UPL / SWAL split')}
    ${cropTop.length? `<div style="padding:4px 16px 12px">${cropTop.map(cropRow).join('')}${A.crops.length>12?`<div style="padding:9px 0 2px;font-size:11px;color:#9C988F;text-align:center">+${A.crops.length-12} more crops</div>`:''}</div>`:emptyBox('No crops in this scope.')}`);

  /* ---- state breakdown (only at all-states) ---- */
  const sMax=A.states.length?A.states[0].total:1;
  const stateCard = (S.pmState!=='ALL'||A.states.length<2) ? '' : card(`${cHead('By state','Acres by state · '+measWord+' · UPL / SWAL split')}
    <div style="padding:4px 16px 12px">${A.states.map((s,i)=>`
      <div data-act="pmstate" data-st="${s.st}" style="padding:9px 0;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><span style="flex:1;font-size:12.5px;font-weight:600">${E(s.name)}</span><span style="font-size:10.5px"><span style="color:${C.orangeD};font-weight:600">${fmt(s.UPL)}</span><span style="color:#C9C4BA"> / </span><span style="color:${C.greenD};font-weight:600">${fmt(s.SWAL)}</span></span><span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600;min-width:56px;text-align:right">${fmt(s.total)}</span></div>
        <div style="display:flex;height:7px;border-radius:4px;overflow:hidden;background:#F2F0EB">${s.UPL>0?`<span style="width:${s.UPL/sMax*100}%;background:${C.orange}"></span>`:''}${s.SWAL>0?`<span style="width:${s.SWAL/sMax*100}%;background:${C.green}"></span>`:''}</div></div>`).join('')}</div>`);

  const legend=`<div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#6E6A62"><span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:${C.orange}"></span>UPL</span><span style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:${C.green}"></span>SWAL</span></div>`;
  const twoCol = mob
    ? `${productsCard}${cropCard}`
    : `<div style="display:grid;grid-template-columns:${cropCard?'1.35fr 1fr':'1fr'};gap:14px;align-items:start">${productsCard}${cropCard}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:14px">
    ${header}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div style="font-size:11px;color:#9C988F">Product-scanned acres — a separate measure from machine spray acres</div>${legend}</div>
    ${hero}
    ${stats}
    ${twoCol}
    ${stateCard}
  </div>`;
}
function recapViewHTML(v){ return `<section style="padding:18px 22px">${recapBodyHTML(false)}</section>`; }
// Yesterday recap — a read-only daily briefing that FUSES both datasets: machine rows (Sheet1 → ROWS) for who
// ran / where / how much, and the Product data tab (PROD) for the top product + crop. All-India, independent of
// the machine filter bar AND the global Yesterday/Today toggle — it is pinned to yesterday (m.acresY / PROD.yday).
function recapBodyHTML(mob){
  const M=ROWS;
  // ---- machine side (pinned to acresY = yesterday) ----
  const ran=M.filter(m=>m.acresY>0), ranY=ran.length, deployed=M.length;
  const acresY=M.reduce((a,m)=>a+(m.acresY||0),0);
  const bdY=M.filter(m=>!!m.breakdown).length;
  const ranUpl=ran.filter(m=>m.org==='UPL').length, ranSwal=ran.filter(m=>m.org==='SWAL').length, ranOpen=ranY-ranUpl-ranSwal;
  const st={};
  M.forEach(m=>{ const s=st[m.st]||(st[m.st]={st:m.st,name:STATE_NAMES[m.st]||m.st,ran:0,acres:0,deployed:0});
    s.deployed++; if(m.acresY>0){ s.ran++; s.acres+=m.acresY; } });
  const states=Object.values(st).filter(s=>s.deployed>0).sort((a,b)=>b.acres-a.acres);
  const activeStates=states.filter(s=>s.ran>0).length, topState=states[0];
  const sMax=states.reduce((m,s)=>Math.max(m,s.acres),1);
  // ---- product side (all-India, PROD.yday) — lazy-load if this is the first view that needs it ----
  if(!PROD.loaded && !PROD.loading && !PROD.error) setTimeout(loadProduct,0);
  const pReady=PROD.loaded; let topProduct=null, topCrop=null, prodTotY=0, upY=0, swY=0, prodList=[], cropList=[];
  if(pReady){
    const B={}, Cr={};
    PROD.rows.forEach(m=>{ if(!(m.yday>0)) return;
      const b=B[m.brandKey]||(B[m.brandKey]={disp:m.brand,company:m.company,y:0,crops:{}}); b.y+=m.yday; b.crops[m.crop]=(b.crops[m.crop]||0)+m.yday;
      const c=Cr[m.crop]||(Cr[m.crop]={crop:m.crop,UPL:0,SWAL:0}); c[m.company]+=m.yday;
      if(m.company==='UPL') upY+=m.yday; else swY+=m.yday; });
    prodTotY=upY+swY;
    prodList=Object.values(B).map(b=>{ const tc=Object.entries(b.crops).sort((x,y)=>y[1]-x[1])[0]; return {disp:b.disp,company:b.company,y:b.y,crop:tc?tc[0]:'—'}; }).sort((a,b)=>b.y-a.y);
    cropList=Object.values(Cr).map(c=>({...c,total:c.UPL+c.SWAL})).sort((a,b)=>b.total-a.total);
    topProduct=prodList[0]; topCrop=cropList[0];
  }
  // ---- shared bits ----
  const cc=c=>c==='UPL'?C.orange:C.green, cInk=c=>c==='UPL'?C.orangeD:C.greenD;
  const chip=c=>`<span style="display:inline-block;padding:1px 7px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;background:${c==='UPL'?C.softO:C.softG};color:${cInk(c)}">${c}</span>`;
  const card=inner=>`<div style="background:#fff;border:1px solid #E9E6DF;border-radius:14px;overflow:hidden">${inner}</div>`;
  const cHead=(t,sub)=>`<div style="padding:13px 16px;border-bottom:1px solid #EFEDE7"><div style="font-size:13px;font-weight:700">${t}</div>${sub?`<div style="font-size:11px;color:#9C988F;margin-top:2px">${sub}</div>`:''}</div>`;
  const dstr=(()=>{ try{ return new Date(Date.now()-864e5).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Kolkata'}); }catch(_){ return 'yesterday'; } })();
  const pLoad=PROD.error?'product data unavailable':'loading product data…';

  // ---- narrative one-liner ----
  const narrative=`${fmt(ranY)} of ${fmt(deployed)} deployed machines ran across ${activeStates} states, spraying ${fmt(acresY)} acres.${topState?` <b style="color:#46433d">${E(topState.name)}</b> led with ${fmt(topState.acres)} ac.`:''}${pReady&&topProduct?` <b style="color:#46433d">${E(topProduct.disp)}</b> was the top product, <b style="color:#46433d">${E(topCrop.crop)}</b> the top crop.`:''}`;

  // ---- hero stat band ----
  const stat=(val,lab,sub,ink)=>`<div style="flex:1 0 auto;min-width:${mob?'150px':'170px'};padding:15px 18px;border-right:1px solid #EFEDE7">
      <div style="font-family:'IBM Plex Mono';font-size:26px;font-weight:700;line-height:1;color:${ink||C.ink}">${val}</div>
      <div style="font-size:11px;font-weight:600;color:#46433d;margin-top:7px">${lab}</div>
      <div style="font-size:10.5px;color:#9C988F;margin-top:2px">${sub}</div></div>`;
  const band=`<div style="background:#FBFAF8;border:1px solid #E9E6DF;border-radius:14px;display:flex;overflow-x:auto">
      ${stat(fmt(ranY),'Machines ran','of '+fmt(deployed)+' deployed',C.act)}
      ${stat(fmt(acresY),'Machine spray acres','yesterday')}
      ${stat(pReady?fmt(prodTotY):'—','Product-scanned acres',pReady?'yesterday · product tab':pLoad)}
      ${stat(fmt(bdY),'Flagged breakdown','across all states',bdY?C.brk:C.ink)}</div>`;

  // ---- three winner cards ----
  const winner=(label,body,accent)=>`<div style="flex:1;min-width:0;background:#fff;border:1px solid #E9E6DF;border-radius:14px;overflow:hidden">
      <div style="height:4px;background:${accent}"></div>
      <div style="padding:15px 17px"><div style="font-size:10px;font-weight:700;letter-spacing:.09em;color:#9C988F;text-transform:uppercase;margin-bottom:9px">${label}</div>${body}</div></div>`;
  const topStateCard=winner('Top state', topState?`
      <div style="font-size:20px;font-weight:700;line-height:1.15">${E(topState.name)}</div>
      <div style="font-size:12px;color:#6E6A62;margin-top:7px"><b style="font-family:'IBM Plex Mono';color:${C.act}">${fmt(topState.ran)}</b> machines ran · <b style="font-family:'IBM Plex Mono'">${fmt(topState.acres)}</b> ac</div>`
    :`<div style="color:#9C988F;font-size:13px">No machine ran yesterday.</div>`, C.act);
  const winP=pReady && topProduct;
  const topProductCard=winner('Top product', winP?`
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(topProduct.disp)}</span>${chip(topProduct.company)}</div>
      <div style="font-size:12px;color:#6E6A62;margin-top:7px"><b style="font-family:'IBM Plex Mono';color:${cInk(topProduct.company)}">${fmt(topProduct.y)}</b> ac scanned · ${E(topProduct.crop)}</div>`
    :`<div style="color:#9C988F;font-size:13px">${pLoad}</div>`, winP?cc(topProduct.company):'#E0DCD3');
  const winC=pReady && topCrop;
  const topCropCard=winner('Top crop', winC?`
      <div style="font-size:20px;font-weight:700;line-height:1.15">${E(topCrop.crop)}</div>
      <div style="font-size:12px;color:#6E6A62;margin-top:7px"><b style="font-family:'IBM Plex Mono'">${fmt(topCrop.total)}</b> ac · <span style="color:${C.orangeD};font-weight:600">${fmt(topCrop.UPL)}</span> / <span style="color:${C.greenD};font-weight:600">${fmt(topCrop.SWAL)}</span></div>`
    :`<div style="color:#9C988F;font-size:13px">${pLoad}</div>`, '#4C7399');

  // ---- three columns: state leaderboard · top products · top crops ----
  const stateCard=card(`${cHead('States yesterday','Ranked by machine spray acres · machines that ran')}
    <div style="padding:4px 16px 12px">${states.map((s,i)=>`
      <div style="padding:9px 0;border-top:${i?'1px solid #F4F2EE':'none'}">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><span style="font-family:'IBM Plex Mono';font-size:11px;color:#C9C4BA;width:14px">${i+1}</span><span style="flex:1;font-size:12.5px;font-weight:600">${E(s.name)}</span><span style="font-size:10.5px;color:#9C988F">${fmt(s.ran)} ran</span><span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600;min-width:52px;text-align:right">${fmt(s.acres)}</span></div>
        <span style="display:block;height:6px;border-radius:3px;background:#F2F0EB;overflow:hidden"><span style="display:block;height:100%;width:${Math.max(2,s.acres/sMax*100)}%;background:${C.act}"></span></span></div>`).join('')||'<div style="padding:24px 0;text-align:center;color:#9C988F;font-size:12.5px">No machine activity yesterday.</div>'}</div>`);
  const pMax=prodList.reduce((m,p)=>Math.max(m,p.y),1);
  const prodCard=card(`${cHead('Top products','Brands by acres scanned yesterday · product tab')}
    ${pReady?(prodList.length?`<div style="padding:4px 16px 12px">${prodList.slice(0,8).map((p,i)=>`
      <div style="padding:9px 0;border-top:${i?'1px solid #F4F2EE':'none'}">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span style="flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${E(p.disp)}</span>${chip(p.company)}<span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600">${fmt(p.y)}</span></div>
        <span style="display:block;height:6px;border-radius:3px;background:#F2F0EB;overflow:hidden"><span style="display:block;height:100%;width:${Math.max(2,p.y/pMax*100)}%;background:${cc(p.company)}"></span></span></div>`).join('')}</div>`:'<div style="padding:24px 0;text-align:center;color:#9C988F;font-size:12.5px">No product spray logged yesterday.</div>'):`<div style="padding:34px 18px;text-align:center;color:#9C988F;font-size:12.5px">${PROD.error?'⚠ '+pLoad+' <button data-act="productretry" style="margin-left:6px;border:none;background:none;color:#6E6A62;cursor:pointer;text-decoration:underline">retry</button>':pLoad}</div>`}`);
  const cMax=cropList.reduce((m,c)=>Math.max(m,c.total),1);
  const cropCard=card(`${cHead('Top crops','Acres scanned yesterday · UPL / SWAL split')}
    ${pReady?(cropList.length?`<div style="padding:4px 16px 12px">${cropList.slice(0,8).map((c,i)=>`
      <div style="padding:9px 0;border-top:${i?'1px solid #F4F2EE':'none'}">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px"><span style="flex:1;font-size:12.5px;font-weight:600">${E(c.crop)}</span><span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600">${fmt(c.total)}</span></div>
        <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;background:#F2F0EB">${c.UPL>0?`<span style="width:${c.UPL/cMax*100}%;background:${C.orange}"></span>`:''}${c.SWAL>0?`<span style="width:${c.SWAL/cMax*100}%;background:${C.green}"></span>`:''}</div></div>`).join('')}</div>`:'<div style="padding:24px 0;text-align:center;color:#9C988F;font-size:12.5px">No crop spray logged yesterday.</div>'):`<div style="padding:34px 18px;text-align:center;color:#9C988F;font-size:12.5px">${pLoad}</div>`}`);

  const cols = mob
    ? `${stateCard}${prodCard}${cropCard}`
    : `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start">${stateCard}${prodCard}${cropCard}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div><div style="font-size:16px;font-weight:700;line-height:1.15">Yesterday · ${E(dstr)}</div><div style="font-size:11px;color:#9C988F;margin-top:2px">Daily recap · machines (Sheet1) + product spray (Product data)</div></div>
      <div style="flex:1"></div>
      <span style="font-size:10.5px;color:#9C988F">Updated ${E(lastUpdated||'—')} IST <button data-act="refresh" title="Reload" style="border:none;background:none;color:#6E6A62;cursor:pointer;font-size:11px;text-decoration:underline;padding:0 0 0 4px">refresh</button></span>
    </div>
    <div style="background:#fff;border:1px solid #E9E6DF;border-radius:14px;padding:13px 17px;font-size:13px;line-height:1.55;color:#6E6A62">${narrative}</div>
    ${band}
    <div style="display:flex;gap:14px;${mob?'flex-direction:column':''}">${topStateCard}${topProductCard}${topCropCard}</div>
    ${cols}
  </div>`;
}

function mMoreHTML(){
  const rest=mViews().slice(M_PRIMARY);
  return rest.map(x=>`<button data-act="view" data-view="${x.k}" style="width:100%;display:flex;align-items:center;gap:13px;padding:15px 4px;background:none;border:none;border-bottom:1px solid #F2F0EB;cursor:pointer;text-align:left;color:${state.view===x.k?'#1B1A17':'#46433d'}">

      <span style="flex:1;font-size:15px;font-weight:${state.view===x.k?700:500}">${x.label}</span>
    </button>`).join('');

function mBottomNavHTML(){
  const all=mViews(), prim=all.slice(0,M_PRIMARY), hasMore=all.length>M_PRIMARY;
  const restActive=all.slice(M_PRIMARY).some(x=>x.k===state.view);
  const item=(active,inner,attrs)=>`<button ${attrs} style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 0 0;background:none;border:none;cursor:pointer;color:${active?'#1B1A17':'#9C988F'};font-size:9.5px;font-weight:${active?700:500};min-height:52px">${inner}</button>`;
  return `<nav style="flex-shrink:0;background:#fff;border-top:1px solid #E9E6DF;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9">
    ${prim.map(x=>item(state.view===x.k, `${x.icon()}<span>${x.label}</span>`, `data-act="view" data-view="${x.k}"`)).join('')}
    ${hasMore?item(restActive, `${I.more}<span>More</span>`, `data-act="sheet" data-sheet="more"`):''}
  </nav>`;
}

// One hierarchy row (territory / AM / BM / pending) as a card. Indent becomes a left rule + inset
// so the Territory → Cluster → Machine nesting still reads at 390px.
function mHierCardHTML(r, opts){
  const depth = Math.min(3, Math.round(parseInt(r.indent||'0',10)/20));
  const inset = depth*13;
  const clickable = r.click ? rowDataAttrs(r.click) : '';
  const stat = (label,val,ink) => `<div style="min-width:0"><div style="font-size:9px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase">${label}</div><div style="font-family:'IBM Plex Mono';font-size:13px;font-weight:600;margin-top:2px;${ink?'color:'+ink:''}">${val}</div></div>`;
  return `<div ${clickable} style="background:#fff;border:1px solid #E9E6DF;border-left:${depth?`3px solid ${depth===1?'#E0DCD3':'#EFEDE7'}`:'1px solid #E9E6DF'};border-radius:12px;padding:12px 13px;margin:0 0 8px ${inset}px;${r.click?'cursor:pointer':''}">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      ${r.chev?`<span style="${css(r.chevStyle)}">${r.chev}</span>`:''}
      ${r.role?`<span style="${css(r.roleStyle)}">${E(r.role)}</span>`:''}
      <span style="${css(r.dotStyle)}"></span>
      <div style="flex:1;min-width:0">
        <div style="${css({...r.nameStyle,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'})}">${E(r.name)}</div>
        ${r.sub?`<div style="${css({...r.subStyle,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'})}">${E(r.sub)}</div>`:''}
      </div>
      ${r.contact?`<a href="${E(r.callTel)}" data-stop="1" style="${css({...r.callStyle,width:'34px',height:'34px',flexShrink:0})}">${I.phoneS}</a>`:''}
    </div>
    ${opts&&opts.pending
      ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px">
           ${stat('Pending', E(r.count), r.count?'#3A5B7D':'#C4BFB5')}
           ${r.org?`<div><div style="font-size:9px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase">Org</div><div style="margin-top:3px"><span style="${css(r.orgStyle)}">${E(r.org)}</span></div></div>`:stat('Org mix', E(r.mix)||'—')}
         </div>${r.org?'':''}`
      : `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:11px">
           ${stat('Deployed', E(r.deployed))}${stat('Acres '+dayShort(), E(r.ranY))}${stat('Operators', E(r.opMap))}
         </div>
         <div style="margin-top:11px">
           <div style="display:flex;height:7px;border-radius:4px;overflow:hidden;background:#F2F0EB"><span style="${css(r.mixAStyle)}"></span><span style="${css(r.mixIStyle)}"></span><span style="${css(r.mixBStyle)}"></span></div>
           <div style="${css({...r.mixLabelStyle,marginTop:'4px'})}">${E(r.mixLabel)}</div>
         </div>
         <div style="display:flex;align-items:center;gap:9px;margin-top:9px">
           <div style="flex:1;height:7px;border-radius:4px;background:#F2F0EB;overflow:hidden"><span style="${css(r.paceBarStyle)}"></span></div>
           <span style="font-family:'IBM Plex Mono';font-size:11px;color:#6E6A62;white-space:nowrap">${E(r.acresLabel)}</span>
         </div>
         ${opts&&opts.adm?`<div style="display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:#9C988F">
           <span>IoT y'day <b style="font-family:'IBM Plex Mono';color:#D96A12">${E(r.iotRanY)}</b></span>
           <span>Pinged <b style="font-family:'IBM Plex Mono';color:${r.pingInk||'#46433d'}">${E(r.pingLabel)}</b></span>
         </div>`:''}`}
  </div>`;
}

/* ============================= render / events ============================= */
const app=document.getElementById('app');
let _lastFsig=null;
function render(){
  // keep every device off tabs their role no longer exposes — the phone carries all of them now
  if(roleHidesView(state.view)) state.view='map';
  // Any change to the filter set restarts the mobile list's paging, so "Load more" can't leave a
  // stale offset applied to a freshly-filtered (and possibly much shorter) result set.
  const S0=state, fsig=[S0.org,S0.st,S0.terr,S0.cluster,S0.am,S0.co,S0.bm,S0.tm,S0.health.join(','),S0.search].join('|');
  if(fsig!==_lastFsig){ _lastFsig=fsig; state.listLimit=MLIST_PAGE; }
  const ae=document.activeElement; const focusId=ae&&ae.id; const selStart=ae&&ae.selectionStart;
  const v=vals();
  app.innerHTML = state.device==='mobile' ? mobileHTML(v) : desktopHTML(v);
  // restore inputs/selects + focus
  const si=document.getElementById('searchInput'); if(si){ si.value=state.search; }
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange){ try{el.setSelectionRange(selStart,selStart);}catch(_){ } } } }
  paint();
}
function paint(){
  const S=state, mob=S.device==='mobile';
  // ensure the active geometry matches the current state before drawing (no-op for single-state MP → key stays 'MP')
  const needKey=geoKeyForState();
  if(needKey!==activeGeoKey){
    if(GEO_CACHE[needKey]) applyGeo(needKey);
    else { ensureGeo(needKey).then(g=>{ if(g){ applyGeo(needKey); render(); } }); return; }   // lazy-load then repaint
  }
  try{
    if(S.view==='map') drawMap(mob?'mMapHost':'mapHost', S.metric);
    else if(S.view==='weather') drawMap(mob?'mwMapHost':'wMapHost', 'weather');
    else if(S.view==='machines') drawPins(mob?'mPinHost':'pinHost');
    else if(S.view==='snake'){ wireSnakeHover(); wireTrendHover(); }
    else if(S.view==='insights') wireSnakeHover();   // the trajectory card reuses the snake SVG + its crosshair
    if(!mob && S.selected) drawDrawerMap();
  }catch(err){ console.error('paint failed:', err); }
}
function setState(patch){ if(typeof patch==='function') patch=patch(state); Object.assign(state, patch); render(); }

app.addEventListener('input', e=>{ if(e.target.id==='searchInput') setState({search:e.target.value}); });
app.addEventListener('change', e=>{
  if(e.target.id==='stSelect'){ const w=e.target.value; if(!w||gateAllowsState(w)) setState({st:w, terr:'', cluster:'', am:'', co:'', expanded:{}}); }
  else if(e.target.id==='terrSelect') setState({terr:e.target.value, cluster:''});
  else if(e.target.id==='clusterSelect') setState({cluster:e.target.value});
  else if(e.target.id==='amSelect') setState({am:e.target.value, co:''});
  else if(e.target.id==='coSelect') setState({co:e.target.value});
  else if(e.target.id==='bmSelect') setState({bm:e.target.value, tm:''});
  else if(e.target.id==='tmSelect') setState({tm:e.target.value});
  else if(e.target.id==='snStateSel') setState({snState:e.target.value});
  // Date pickers → fiscal day-offset (0=Apr 1 … 364=Mar 31); offsets sort in fiscal order so the clamp is numeric.
  else if(e.target.id==='snFromSel'){ const f=snakeDateToOff(e.target.value); if(f!=null) setState({snFrom:f, snTo:Math.max(f,state.snTo)}); }
  else if(e.target.id==='snToSel'){ const t=snakeDateToOff(e.target.value); if(t!=null) setState({snTo:t, snFrom:Math.min(t,state.snFrom)}); }
  else if(e.target.id==='pmStateSel') setState({pmState:e.target.value});
  else if(e.target.id==='insStateSel') setState({insSt:e.target.value});   // page-local; never touches state.st
  else if(e.target.id==='insPaSel') setState({insPa:e.target.value});
  else if(e.target.id==='insPbSel') setState({insPb:e.target.value});
  else if(e.target.id==='pmCropSel') setState({pmCrop:e.target.value});
});
app.addEventListener('click', e=>{
  if(e.target.closest('a[data-stop]')) { e.stopPropagation(); return; } // let tel: link work, don't open row
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'view': if(gateExpired()){ gateLock(); break; } mapLocked=true; scale=1; tx=0; ty=0; setState({view:el.dataset.view, sheet:null}); trackView(el.dataset.view); break;
    // The phone now carries every view the role allows, so switching device no longer has to
    // bounce the user back to the map.
    case 'device': mapLocked=true; scale=1; tx=0; ty=0; setState(s=>({device: s.device==='mobile'?'desktop':'mobile', selected:null, sheet:null})); break;
    case 'sheet': setState({sheet:el.dataset.sheet}); break;
    case 'sheetclose': setState({sheet:null}); break;
    case 'loadmore': setState(s=>({listLimit:s.listLimit+MLIST_PAGE})); break;
    case 'org': { const want=el.dataset.org; if(gateAllows(want)){ setState({org:want, bm:'', tm:''}); } else { gateShow(()=>setState({org: gateAllows(want)?want:gateDefaultOrg(), bm:'', tm:''}), `Enter PIN for ${want} access`, true); } break; }
    case 'metric': setState({metric:el.dataset.metric}); break;
    case 'day': { const d=el.dataset.day==='today'?'today':'yday'; setState({day:d}); track('day_scope',{day:d}); break; }
    case 'lbscope': setState({lbScope:el.dataset.scope}); break;
    case 'wxday': setState({wxDay:wxDayIdx(+el.dataset.day||0)}); track('weather_day',{day:wxDayLabel(wxDayIdx(+el.dataset.day||0))}); break;
    case 'pinmode': setState({pinMode:el.dataset.mode}); break;
    case 'health': { const h=el.dataset.h; setState(s=>({health: s.health.includes(h)? s.health.filter(x=>x!==h) : [...s.health,h]})); break; }
    case 'clear': setState({org:gateDefaultOrg(),terr:'',cluster:'',am:'',co:'',bm:'',tm:'',health:[],search:''}); break;
    case 'refresh': state.refreshing=true; render(); loadData().finally(()=>{ state.refreshing=false; render(); }); break;
    case 'download': downloadFilteredCSV(); track('csv_download',{ org:state.org, mp_state:state.st||'all', role:(GATE.cur&&GATE.cur.role)||'' }); break;
    case 'state': { const w=el.dataset.key; if(gateAllowsState(w)) setState({st:w, terr:'', cluster:'', am:'', co:'', expanded:{}}); break; }   // drill from national tier into a state
    case 'terr': { const t=el.dataset.terr; setState(s=>({terr: s.terr===t?'':t, cluster:''})); break; }
    case 'exp': { const k=el.dataset.key; setState(s=>({expanded:{...s.expanded,[k]:!s.expanded[k]}})); break; }
    case 'open': { const m=ROWS.find(x=>x.mc===el.dataset.mc); if(m){ setState({selected:m}); track('machine_open',{ machine:el.dataset.mc, org:state.org, mp_state:state.st||'all' }); } break; }
    case 'close': setState({selected:null}); break;
    case 'zoomin': setMapLock(false); scale=Math.min(6,scale*1.25); applyTransform(); break;
    case 'zoomout': setMapLock(false); scale=Math.max(0.6,scale*0.8); applyTransform(); break;
    case 'zoomreset': setMapLock(true); scale=1;tx=0;ty=0; applyTransform(); break;
    case 'snakeretry': SNAKE.loaded=false; SNAKE.error=false; loadSnake(); break;
    case 'snTrendWin': setState({snTrendWin:+el.dataset.win||30}); break;
    case 'dlChart': downloadChart(el.dataset.kind); break;
    case 'dlcard': downloadCard(el.dataset.id); track('week_card_export',{card:el.dataset.id}); break;
    case 'pmco': setState({pmCo:el.dataset.co}); track('product_company',{co:el.dataset.co}); break;
    case 'pmmeasure': setState({pmMeasure:el.dataset.m==='yday'?'yday':'ytd'}); break;
    case 'pmstate': setState({pmState:el.dataset.st}); break;   // drill from the state-breakdown row
    case 'productretry': PROD.loaded=false; PROD.error=false; loadProduct(); break;
    case 'txretry': TX.loaded=false; TX.error=false; loadTx(); break;
    case 'wkpretry': WKP.loaded=false; WKP.error=false; loadWkp(); break;
    // Insights reads all three tabs, so its refresh reloads all three rather than just the machine sheet.
    case 'insrefresh': state.refreshing=true; render();
      SNAKE.loaded=false; SNAKE.error=false; PROD.loaded=false; PROD.error=false; TX.loaded=false; TX.error=false; WKP.loaded=false; WKP.error=false;
      Promise.all([loadData(), loadSnake(), loadProduct(), loadTx(), loadWkp()]).finally(()=>{ state.refreshing=false; render(); }); break;
    // Drill a league row into that state's own Insights. Deliberately page-local: it re-scopes THIS page only and
    // leaves state.st (and therefore every other view's filter bar) exactly where the user left it.
    case 'insdrill': { const w=el.dataset.key; if(gateAllowsState(w)) setState({insSt:w}); break; }
    case 'insmore': { const k=el.dataset.key; setState({ insMore:{ ...state.insMore, [k]: !(state.insMore&&state.insMore[k]) } }); break; }
    case 'insclear': setState({insSt:''}); break;
    case 'insmode': { const m=el.dataset.m; setState({insMode: ['yday','week'].includes(m)?m:'season'}); track('insights_mode',{mode:m}); break; }
    // Step the Week view back/forward. `back` counts COMPLETE weeks behind the current one, so it never goes
    // below 0 (there is no future complete week) and is capped at a fiscal year of history.
    case 'insweek': setState(s=>({ insWeekBack: Math.max(0, Math.min(52, (s.insWeekBack|0) - (+el.dataset.d||0))) })); break;
  }
});

// Viewport changes. Crossing the phone breakpoint (rotation, window resize, tablet split view)
// re-picks the layout — driven off the media query rather than `resize`, because the query fires
// exactly once on the crossing and fires in environments where `resize` doesn't.
const _phoneMQL = window.matchMedia(PHONE_MQ);
// Guard on the breakpoint, not on state.device: the frame chrome is keyed off isPhone(), so a
// crossing has to re-render even when `device` already reads 'mobile' (desktop preview toggle).
let _wasPhone = isPhone();
const onBreakpoint = () => {
  if(!_booted) return;
  const now=isPhone();
  if(now === _wasPhone) return;
  _wasPhone = now;
  mapLocked=true; scale=1; ty=0; tx=0;
  setState({ device: now?'mobile':'desktop', selected:null, sheet:null });
};
if(_phoneMQL.addEventListener) _phoneMQL.addEventListener('change', onBreakpoint);
else _phoneMQL.addListener(onBreakpoint);                       // Safari < 14
// Same-side resizes (iOS URL bar collapsing, desktop drag) only need the vh-sized map hosts
// re-fitted. Debounced — iOS fires this continuously mid-scroll.
let _rzT=null;
window.addEventListener('resize', ()=>{
  clearTimeout(_rzT);
  _rzT=setTimeout(()=>{ if(!_booted) return; onBreakpoint(); if(state.device==='mobile') paint(); },160);
});

async function sha256(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function gateAllows(org){ return GATE.cur ? GATE.cur.allow.includes(org) : false; }
function gateDefaultOrg(){ return GATE.cur ? GATE.cur.org : 'Both'; }
// State axis (mirrors the org axis). '*' = all states (admin); switchStates gates the dropdown.
function gateAllowsState(code){ return GATE.cur ? (GATE.cur.states.includes('*') || GATE.cur.states.includes(code)) : false; }
function gateDefaultState(){ return GATE.cur ? (GATE.cur.states[0]==='*' ? '' : GATE.cur.states[0]) : ''; }
function gateCanSwitchStates(){ return GATE.cur ? !!GATE.cur.switchStates : false; }
function gateArmTimer(ms){ clearTimeout(GATE.timer); GATE.timer=setTimeout(gateLock, Math.max(0,ms)); }
function gateSave(r){ GATE.cur=r; try{ sessionStorage.setItem(GATE.SKEY, JSON.stringify({id:r.id, at:Date.now()})); }catch(_){ } gateArmTimer(GATE.TTL_MS);
  if(GA_ON()){ try{ window.gtag('set','user_properties',{ role:r.role, org:r.org, mp_state:(r.states||[]).join(','), team:r.label, team_id:r.id }); }catch(_){ } track('login',{ role:r.role, role_id:r.id, team:r.label }); } }
function gateRead(){ try{ return JSON.parse(sessionStorage.getItem(GATE.SKEY)||'null'); }catch(_){ return null; } }
function gateExpired(){ const o=gateRead(); return !o||!o.id||(Date.now()-(o.at||0))>=GATE.TTL_MS; }
function gateRestore(){ const o=gateRead(); if(!o||!o.id) return false; const age=Date.now()-(o.at||0); if(age>=GATE.TTL_MS) return false; const f=Object.values(GATE.ROLES).find(r=>r.id===o.id); if(!f) return false; GATE.cur=f; gateArmTimer(GATE.TTL_MS-age); return true; }
function gateLock(){ clearTimeout(GATE.timer); GATE.cur=null; try{ sessionStorage.removeItem(GATE.SKEY); }catch(_){ } gateShow(()=>bootApp()); }
function gateHide(){ const ov=document.getElementById('gateOv'); if(ov) ov.style.display='none'; }
function gateShow(onOk, msg, cancelable){
  let ov=document.getElementById('gateOv');
  if(!ov){
    ov=document.createElement('div'); ov.id='gateOv';
    ov.style.cssText="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F6F5F2;font-family:'Noto Sans',system-ui,sans-serif";
    ov.innerHTML=`<div style="width:340px;max-width:90vw;background:#fff;border:1px solid #E9E6DF;border-radius:16px;padding:30px 28px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center">
      <div style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#D96A12;text-transform:uppercase">India Operations</div>
      <div style="font-size:20px;font-weight:700;margin-top:6px;color:#1B1A17">Enter access PIN</div>
      <div id="gateMsg" style="font-size:12.5px;color:#6E6A62;margin-top:6px;min-height:16px"></div>
      <input id="gateInput" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="Access PIN"
        style="margin-top:16px;width:100%;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.5em;padding:12px 0 12px .5em;border:1.5px solid #E9E6DF;border-radius:10px;outline:none;color:#1B1A17">
      <div id="gateErr" style="font-size:12px;color:#DC3A2B;margin-top:10px;min-height:15px;font-weight:600"></div>
      <button id="gateCancel" type="button" style="display:none;margin-top:14px;width:100%;padding:10px 0;background:#fff;border:1.5px solid #E9E6DF;border-radius:9px;color:#6E6A62;font-size:13.5px;font-weight:600;cursor:pointer">← Cancel · keep current view</button>
      <div style="font-size:10.5px;color:#9C988F;margin-top:14px;line-height:1.4">Access auto-expires after 30 min of inactivity. <span style="opacity:.6">· build ms-p3</span></div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('#gateInput');
    inp.addEventListener('input', async ()=>{
      inp.value=inp.value.replace(/\D/g,'').slice(0,4);
      ov.querySelector('#gateErr').textContent='';
      if(inp.value.length!==4) return;
      let h; try{ h=await sha256(inp.value); }catch(_){ ov.querySelector('#gateErr').textContent='PIN check needs https — open the live site.'; inp.value=''; return; }
      const role=GATE.ROLES[h];
      if(role){ inp.value=''; gateSave(role); gateHide(); (ov._onOk||function(){})(role); }
      else { ov.querySelector('#gateErr').textContent='Incorrect PIN'; inp.value=''; }
    });
    ov.querySelector('#gateCancel').addEventListener('click', ()=>{ if(ov._cancelable){ ov._onOk=null; gateHide(); } });
    ov.addEventListener('keydown', e=>{ if(e.key==='Escape' && ov._cancelable){ ov._onOk=null; gateHide(); } });
  }
  ov._onOk=onOk||function(){};
  ov._cancelable=!!cancelable;
  ov.querySelector('#gateCancel').style.display = cancelable ? 'inline-block' : 'none';
  ov.querySelector('#gateMsg').textContent=msg||'';
  ov.querySelector('#gateErr').textContent='';
  ov.style.display='flex';
  const inp=ov.querySelector('#gateInput'); inp.value=''; setTimeout(()=>inp.focus(),30);
}
// re-check expiry when the user returns to the tab (timers can stall during sleep)
window.addEventListener('focus', ()=>{ if(_booted && gateExpired()) gateLock(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && _booted && gateExpired()) gateLock(); });

/* ============================= mount ============================= */
let _booted=false;
function bootApp(){
  if(_booted){ if(!gateAllows(state.org)) state.org=gateDefaultOrg(); if(!gateAllowsState(state.st)) state.st=gateDefaultState(); render(); return; }
  _booted=true;
  state.org=gateDefaultOrg();
  state.st=gateDefaultState();   // scoped UPL/SWAL land locked on their state; admin lands on all-India ('')
  setupProj();
  render();
  trackView(state.view);   // landing view for this session (map)
  loadData();
  if(CONFIG.refreshMinutes>0) setInterval(loadData, CONFIG.refreshMinutes*60000);
}
if(gateRestore()) bootApp(); else gateShow(()=>bootApp());
