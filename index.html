        `${fmt(cur)} acres so far against ${fmt(fyPrev)} for all of last season, with ${SNAKE_LEN-1-anchor} days of this one still to run.`, false);
      else if(roll7>0){
        const days=Math.ceil((fyPrev-cur)/roll7);
        if(days<=60) add('project', days<=14?88:days<=30?78:66,'good',`${sc.name} is ${days} days from passing the whole of last season`,
          `${fmt(fyPrev-cur)} acres to go, at the ${fmt(roll7)} a day it is averaging now — around ${snakeOffLabel(Math.min(SNAKE_LEN-1,anchor+days))}.`);
      }
    }
    // 4 · peak — the season's biggest single day, only while it is still fresh.
    let pk=-1,pv=0; for(let o=0;o<=anchor;o++){ const v=d26[o]; if(v!=null&&v>pv){ pv=v; pk=o; } }
    if(pk>=0 && anchor-pk<=2 && pv>0){
      const norm14=insRoll(d26,anchor,14);
      add('peak',72,'good',`${snakeOffLabel(pk)} was ${sc.name}'s biggest day of the season`,
        `${fmt(pv)} acres in one day${mm[pk]?` from ${fmt(mm[pk])} machines`:''}${norm14?`, against a fortnightly average of ${fmt(norm14)} a day`:''}.`, anchor===pk);
    }
    // 5 · fleet — machines running per day, week over week. Floors kill the 2→6 "150% surge".
    //     Stated as a machine COUNT rather than a percentage: 40 fewer machines is a fact you can picture.
    const m7=insRoll(mm,anchor,7), m14=insRoll(mm,anchor-7,7);
    if(m7!=null && m14!=null && m14>=INS_SIG.MACH_BASE && Math.abs(m7-m14)>=INS_SIG.MACH_DELTA){
      const up7=m7>m14;
      add('fleet',70,up7?'good':'bad',`${sc.name} has ${fmt(Math.abs(m7-m14))} ${up7?'more':'fewer'} machines working each day`,
        `${fmt(m14)} a day last week, ${fmt(m7)} this week.`);
    }
    // 6 · productivity — acres per RUNNING machine against its own 3-week baseline (not a fleet-size effect).
    const per=[]; for(let o=anchor-27;o<=anchor;o++) if(mm[o]>0 && d26[o]!=null) per.push(d26[o]/mm[o]);
    if(per.length>=14 && roll7>=INS_SIG.ACRES_DAY){
      const r=med(per.slice(-7)), b=med(per.slice(0,-7));
      if(b>0 && Math.abs(r/b*100-100)>=25){ const p=r/b*100-100;
        add('prod',68,p>0?'good':'bad',`${sc.name}'s machines are covering ${p>0?'more':'less'} ground each day`,
          `${r.toFixed(1)} acres per working machine, against ${b.toFixed(1)} over the three weeks before.`);
      }
    }
    // 7 · stall — consecutive days with nothing logged at all.
    let z=0; for(let o=anchor;o>anchor-21;o--){ const v=d26[o]; if(v==null||v>0) break; z++; }
    if(z>=3){
      const depN=(A.dep||[]).filter(m=>sc.national||m.st===sc.code).length;
      add('stall',82,'bad',`${sc.name} has logged no acres for ${z} days`,
        `Nothing recorded since ${snakeOffLabel(anchor-z)}${depN?`, with ${fmt(depN)} machines deployed there`:''}.`, INS_SIG.MILES.includes(z));
    }
  }
  /* ---- #22 · trust check (snake ⋈ Sheet1) --------------------------------------------------------------
     Two independent pipelines report the same day's acres. When they agree (1.3% apart today) that is quiet
     assurance; when they diverge, every other number on this page is suspect, so it outranks everything.
     Only run when the season anchor IS yesterday — if the anchor stepped back to an earlier closed day the two
     sides are measuring different days and any "divergence" would be an artefact of the comparison, not the data. */
  let alert=null;
  if(A.fleet && A.season.asOf==='through yesterday'){
    const snY=insDaily(A.snCode,INS_CUR.key)[anchor], shY=A.fleet.acresY;
    if(snY>0 && shY>0 && !A.scoped){                   // org-scoped machine rows can't match an all-company series
      const diff=Math.abs(shY-snY)/snY*100;
      if(diff>10) alert={ id:'trust', tone:'bad',
        title:`The two acre feeds disagree by ${Math.round(diff)}%`,
        detail:`The season sheet recorded ${fmt(snY)} acres for ${snakeOffLabel(anchor)}. The machine sheet reports ${fmt(shY)} for the same day. Until that is resolved, the numbers on this page cannot be relied on.` };
    }
  }

  /* ---- Family B · peer outliers over the machine sheet ---------------------------------------------------
     No history required: these compare a CLUSTER or an AM against ITS OWN STATE's peers rather than against its
     own past.

     Grain is cluster, not territory, for one concrete reason: a territory has no owner column, and a cluster
     does. Every row here names the person accountable for it (`co`/`coMob`, `am`/`amNum`, 100% filled on live
     data) because a row you cannot attribute is not something anyone can act on. Cluster→officer is not quite
     1:1 — a third of clusters have logged more than one officer — so the row names the DOMINANT one via domStr
     rather than asserting a mapping the sheet doesn't guarantee.

     The two season detectors are anchored on never-sprayed — a SEASON total — because Sheet1's daily fields are
     a single observation with nothing to smooth them. The two ping detectors are the exception and are allowed
     to read yesterday directly, because a ping is not a performance measure: it is the machine reporting whether
     it exists on the network, which is true or false regardless of how busy the day was. */
  const byState={};
  (A.dep||[]).forEach(m=>{ if(m.st) (byState[m.st]=byState[m.st]||[]).push(m); });
  const grp=(rows,key)=>{ const g={}; rows.forEach(m=>{ const k=String(m[key]||'').trim(); if(k) (g[k]=g[k]||[]).push(m); }); return g; };
  const pct = x => Math.round(x*100)+'%';
  for(const stc in byState){
    const srows=byState[stc], sName=STATE_NAMES[stc]||stc, tag=A.gst?'':` (${sName})`;
    const sNever=srows.filter(m=>!((m.achieved||0)>0)).length/srows.length;
    const sRan=srows.filter(m=>(m.acresY||0)>0).length/srows.length;
    const sDark=srows.filter(m=>!m.pinged).length/srows.length;
    // Size ramp: clusters are smaller units than territories were, so the knee sits at 30 machines not 40.
    const ramp=(n,knee)=>0.5+0.5*Math.min(1,n/knee);
    const peer=(scope,id,weight,title,detail,owner)=>out.push({ group:'peer', scope, st:stc, drill:stc, id, tone:'bad', score:weight, title, detail, owner });

    const CL=grp(srows,'cluster');
    for(const cname in CL){
      const rs=CL[cname]; if(rs.length<INS_SIG.CLUSTER_MIN || insJunkTerr(cname)) continue;
      const co=domStr(rs.map(m=>m.co)), coMob=domStr(rs.filter(m=>m.co===co).map(m=>m.coMob));
      const owner = co ? { role:'Cluster officer', name:co, phone:coMob } : null;
      const scope='C:'+stc+':'+cname, clAc=rs.reduce((a,m)=>a+(m.achieved||0),0);

      // #14 · never sprayed — the chronic one. A season total, so it cannot be explained away by a quiet day.
      const never=rs.filter(m=>!((m.achieved||0)>0)).length;
      if(never/rs.length>=0.6 && never>=5)
        peer(scope,'zero', 86*ramp(rs.length,30),
          `${cname}${tag} has ${never} machines that have never sprayed`,
          `${pct(never/rs.length)} of its ${rs.length} machines, against ${pct(sNever)} across ${sName}. The rest of the cluster has covered ${fmt(clAc)} acres this season.`, owner);

      // #NEW · connected but idle — the machine reported in and still sprayed nothing. This is the one class the
      // page could never distinguish before: it separates a machine that is off or unreachable from one that is
      // powered, on the network, and simply not being used.
      const onIdle=rs.filter(m=>m.pinged && !((m.acresY||0)>0) && (m.achieved||0)>0);
      if(onIdle.length>=4 && onIdle.length/rs.length>=0.5)
        peer(scope,'onidle', 84*ramp(rs.length,30),
          `${cname}${tag} had ${onIdle.length} machines switched on that sprayed nothing`,
          `They reported in yesterday, so they were powered and reachable. Between them they have covered ${fmt(onIdle.reduce((a,m)=>a+(m.achieved||0),0))} acres this season.`, owner);

      // #NEW · dark — no ping at all. Deliberately weaker than the above: an absent signal is an absence of
      // evidence, not evidence of absence, and the copy has to say so rather than imply the machines were idle.
      const dark=rs.filter(m=>!m.pinged).length;
      if(dark>=4 && dark/rs.length>=0.5 && dark/rs.length>=sDark*1.4)
        peer(scope,'dark', 76*ramp(rs.length,30),
          `${cname}${tag} has ${dark} machines that did not report in`,
          `${dark} of ${rs.length} sent no signal yesterday, against ${pct(sDark)} across ${sName}. There is no record either way of whether they worked.`, owner);
    }

    const AM=grp(srows,'am');
    for(const a in AM){                                 // #13 · AM chronic underperformance
      const rs=AM[a]; if(rs.length<INS_SIG.AM_MIN || insJunkTerr(a)) continue;
      const never=rs.filter(m=>!((m.achieved||0)>0)).length, neverF=never/rs.length;
      const ran=rs.filter(m=>(m.acresY||0)>0).length/rs.length;
      if(neverF>=sNever*1.5 && neverF>=0.2 && ran<sRan)
        out.push({ group:'peer', scope:'A:'+stc+':'+a, st:stc, drill:stc, id:'am', tone:'bad',
          score: 80*(0.5+0.5*Math.min(1,rs.length/60)),
          title:`${a}${tag} has ${never} machines that have never sprayed`,
          detail:`${pct(neverF)} of ${rs.length} machines, against ${pct(sNever)} across ${sName}. ${pct(ran)} of them worked yesterday, against ${pct(sRan)} statewide.`,
          owner:{ role:'Area manager', name:a, phone:domStr(rs.map(m=>m.amNum)) } });
    }
  }

  /* ---- two groups, two budgets --------------------------------------------------------------------------
     Diversity rules are about readability, not statistics. Every cluster is its own scope, so a per-SCOPE cap
     does nothing to stop one state filling the card — the cap that matters here is per STATE, and it is applied
     twice at different strengths:
       · the POOL allows three rows per state, because a state genuinely can have three clusters in trouble and
         hiding the third would be the silent floor this page is meant to avoid;
       · the VISIBLE slice allows two, so the card above the fold spreads across the country.
     peerTop is a subsequence of peer in the same order, so expanding the group inserts rows between the ones
     already on screen rather than reshuffling them. */
  const pick=(rows,{perScope,perKind,perState,max})=>{
    const used={}, kind={}, st={}, top=[];
    for(const s of rows){
      if((used[s.scope]||0)>=perScope || (kind[s.id]||0)>=perKind || (perState&&(st[s.st]||0)>=perState)) continue;
      used[s.scope]=(used[s.scope]||0)+1; kind[s.id]=(kind[s.id]||0)+1; st[s.st]=(st[s.st]||0)+1; top.push(s);
      if(top.length>=max) break;
    }
    return top;
  };
  out.sort((a,b)=>b.score-a.score);
  const single = scopes.length<=1;                        // a state-locked login has one scope; don't starve it
  const peer = pick(out.filter(s=>s.group==='peer'), { perScope:1, perKind:4, perState: single?99:3, max:INS_SIG.PEER_MAX });
  return { alert, peer,
    peerTop: pick(peer, { perScope:1, perKind:3, perState: single?99:2, max:INS_SIG.PEER_SHOW }),
    trend:   pick(out.filter(s=>s.group==='trend'), { perScope: single?INS_SIG.TREND_MAX:1, perKind:2, max:INS_SIG.TREND_MAX }) };
}

/* ===================== Week mode — the Monday review =====================
   A third horizon, for the weekly deep-dive: one completed Sat–Fri week, reviewed after it closes. It asks neither
   "are we on track" (season) nor "who do I ring" (yesterday) but "what actually happened last week, and how do
   we explain it to the room".

   Boundaries are REAL calendar weeks. The fiscal axis is year-agnostic, so the Sat–Fri window is computed from the real
   date and then mapped onto it; `back` steps through earlier weeks. A week that straddles 31 March is skipped
   rather than silently clipped, since half of it would land in a different fiscal year's column.

   Comparing week-to-week across seasons is sound even though a given fiscal offset falls on a different weekday
   each year: any 7-day window contains all seven weekdays exactly once, so weekday rhythm cancels out of the sum.

   SCOPE LIMIT, stated on the page rather than hidden: everything here is state-grain. Sheet1 has no history, so
   what a territory or an AM did *during* a past week is not recoverable — only where they stand today. Weekly
   territory detail needs a weekly snapshot of the sheet's cumulative column, which does not exist yet. */
// The programme's week runs SATURDAY → FRIDAY, not the ISO Mon–Sun. This constant is the single source of that
// fact: the window, the day-column order, the axis labels and every piece of copy derive from it, so moving the
// week again is a one-line change rather than a hunt through strings.
const INS_WEEK_END_DOW = 5;                 // JS getDay(): 0=Sun … 5=Fri … 6=Sat
const INS_WEEK_PHRASE  = 'Saturday to Friday';
const INS_WEEK_SHORT   = 'Sat–Fri';
const INS_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function insWeekWindow(back){
  const now=new Date();
  let gap=(now.getDay()-INS_WEEK_END_DOW+7)%7;
  if(gap===0) gap=7;                                             // today is never a complete day, so never an end
  const d1=new Date(now); d1.setDate(now.getDate()-gap-7*(back||0));   // most recent COMPLETE week-end (a Friday)
  const d0=new Date(d1); d0.setDate(d1.getDate()-6);
  const from=snakeOff(d0.getMonth()+1,d0.getDate()), to=snakeOff(d1.getMonth()+1,d1.getDate());
  if(from==null || to==null || to-from!==6) return null;         // straddles the fiscal year boundary
  return { d0, d1, from, to };
}
const insWeekLabel = d => { try{ return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }catch(_){ return ''; } };
function insWeekSum(code,key,a,b){
  const d=insDaily(code,key); let s=0,n=0;
  for(let o=Math.max(0,a);o<=b;o++) if(d[o]!=null){ s+=d[o]; n++; }
  return n?s:null;
}
function insWeekAgg(A,back){
  const w=insWeekWindow(back); if(!w) return null;
  const code=A.snCode, W={ ...w, back };
  W.acres=insWeekSum(code,INS_CUR.key,w.from,w.to);
  W.prev =insWeekSum(code,INS_CUR.key,w.from-7,w.to-7);
  W.ly   =insWeekSum(code,INS_PREV.key,w.from,w.to);
  W.ly2  =insWeekSum(code,INS_PREV2.key,w.from,w.to);
  W.wow  = (W.acres!=null&&W.prev)? W.acres/W.prev*100-100 : null;
  W.yoy  = (W.acres!=null&&W.ly)?   W.acres/W.ly*100-100   : null;
  W.yoy2 = (W.acres!=null&&W.ly2)?  W.acres/W.ly2*100-100  : null;
  W.hasData = W.acres!=null && W.acres>0;

  const d=insDaily(code,INS_CUR.key), dp=insDaily(code,INS_PREV.key), m=insMach(code);
  W.days=[];
  for(let i=0;i<7;i++){ const o=w.from+i, dt=new Date(w.d0); dt.setDate(w.d0.getDate()+i);
    W.days.push({ off:o, dow:INS_DOW[dt.getDay()], ac:d[o], ly:dp[o], mc:m[o] }); }
  const mm=W.days.map(x=>x.mc).filter(x=>x!=null);
  W.machAvg = mm.length? mm.reduce((a,b)=>a+b,0)/mm.length : null;
  W.machPeak= mm.length? Math.max.apply(null,mm) : null;
  // Machine-DAYS worked across the week, and therefore acres per running machine. The week's output is
  // (machines that ran) × (ground each covered); showing both makes the headline explainable rather than just
  // stated. This replaces a "days with acres" count, which at national scope can never be anything but 7/7.
  W.machDays = mm.length? mm.reduce((a,b)=>a+b,0) : null;
  W.acPerMachine = (W.machDays && W.acres!=null) ? W.acres/W.machDays : null;
  const best=W.days.filter(x=>x.ac!=null).sort((a,b)=>b.ac-a.ac)[0];
  W.bestDay = best && best.ac>0 ? best : null;

  /* Season position across the week. Reported in BOTH units on purpose: the percentage gap can narrow while the
     acre gap widens, because the base grows faster than the shortfall. Saying only "we closed the gap" is the
     kind of half-true that gets caught in the review. */
  const c26=snakeDenseFor(code,INS_CUR.key), c25=snakeDenseFor(code,INS_PREV.key);
  const pct=o=>(c26[o]!=null&&c25[o])?c26[o]/c25[o]*100-100:null;
  const acg=o=>(c26[o]!=null&&c25[o]!=null)?c25[o]-c26[o]:null;
  W.pos={ pct0:pct(w.from-1), pct1:pct(w.to), ac0:acg(w.from-1), ac1:acg(w.to), cum:c26[w.to] };

  W.states=(A.gst?[A.gst]:INS_STATES.filter(gateAllowsState)).map(c=>{
    const ac=insWeekSum(c,INS_CUR.key,w.from,w.to), pv=insWeekSum(c,INS_CUR.key,w.from-7,w.to-7), l=insWeekSum(c,INS_PREV.key,w.from,w.to);
    const mc=insMach(c), ms=[]; for(let o=w.from;o<=w.to;o++) if(mc[o]!=null) ms.push(mc[o]);
    return { code:c, name:STATE_NAMES[c]||c, ac:ac||0,
      wow:(ac!=null&&pv)?ac/pv*100-100:null, yoy:(ac!=null&&l)?ac/l*100-100:null, ly:l,
      mach: ms.length? ms.reduce((a,b)=>a+b,0)/ms.length : null };
  }).filter(x=>x.ac>0||x.ly>0).sort((a,b)=>b.ac-a.ac);
  W.total=W.states.reduce((a,x)=>a+x.ac,0);
  return W;
}
/* Tracked products for the week, from the day-level tab — the only product source with a date. Scope-aware, and
   always paired with the previous week so a brand's direction is visible rather than just its size. */
const insISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function insWeekProducts(A,W){
  if(!WKP.loaded || !W) return null;
  // The manual tab has no dates — it IS one named week. Anything else must say so rather than relabel it.
  if(insISO(W.d0)!==WKP_WEEK.start || insISO(W.d1)!==WKP_WEEK.end) return { wrongWeek:true };
  // Seven dashboard states only — matching the segments table, so the two cards report the same total.
  const scope=r=>r.st!=='OT' && (!A.gst||r.st===A.gst) && (!A.scoped || (A.og!=='Open' && r.company===A.og));
  const rows=WKP.rows.filter(scope);
  if(!rows.length) return { empty:true };
  const roll=key=>{ const m={}; rows.forEach(r=>{ const k=key(r); m[k]=(m[k]||0)+r.acres; }); return m; };
  const meta={}; rows.forEach(r=>{ meta[r.key]=meta[r.key]||{ disp:r.product, company:r.company }; });
  const pm=roll(r=>r.key), cm=roll(r=>r.crop), rm=roll(r=>r.st);
  const listOf=(m,f)=>Object.keys(m).map(k=>f(k,m[k])).filter(x=>x.ac>0).sort((x,y)=>y.ac-x.ac);
  return {
    total: rows.reduce((s,r)=>s+r.acres,0),
    upl:   rows.reduce((s,r)=>s+(r.company==='UPL'?r.acres:0),0),
    swal:  rows.reduce((s,r)=>s+(r.company==='SWAL'?r.acres:0),0),
    products: listOf(pm,(k,v)=>({ key:k, ...meta[k], ac:v })),
    crops:    listOf(cm,(k,v)=>({ key:k, ac:v })),
    regions:  listOf(rm,(k,v)=>({ st:k, name: k==='OT'?'Other':(STATE_NAMES[k]||k), ac:v })) };
}

/* ===== product segments by state =====
   The weekly product sheet has no portfolio column, so the segment is joined on from the SUMMARY tab's
   brand → portfolio map. That join covers ~99% of the week's product acres; whatever misses is reported rather
   than quietly folded into a bucket.

   Soil & Seed Health and Unclassified are excluded from the base entirely (they are not spray segments in the
   sense this table is asking about), so the four shares sum to 100% of what remains. Everything that is neither
   herbicide, insecticide nor fungicide — in practice Bio Solution — lands in Other. */
const INS_SEGS = ['Herbicide','Insecticide','Fungicide'];
function insWeekSegments(A,W){
  if(!WKP.loaded || !PROD.loaded || !W) return null;
  if(insISO(W.d0)!==WKP_WEEK.start || insISO(W.d1)!==WKP_WEEK.end) return { wrongWeek:true };
  const map={}; PROD.rows.forEach(r=>{ if(!map[r.brandKey]) map[r.brandKey]=r.portfolio; });
  const scope=r=>(!A.gst||r.st===A.gst) && (!A.scoped || (A.og!=='Open' && r.company===A.og));
  const by={};
  WKP.rows.filter(scope).forEach(r=>{
    if(r.st==='OT') return;                                 // dashboard states only
    // Herbicide / Insecticide / Fungicide are named; EVERYTHING else — soil & seed health, unclassified,
    // bio solution, or a product with no portfolio on record — falls into Other. Nothing is dropped, so this
    // table's total equals the products table's, and the two cards on the same screen cannot disagree.
    const seg=map[r.key]||'';
    const e=by[r.st]||(by[r.st]={ st:r.st, name:STATE_NAMES[r.st]||r.st, base:0, Herbicide:0, Insecticide:0, Fungicide:0, Other:0, prod:{}, crop:{} });
    const k = INS_SEGS.indexOf(seg)>=0 ? seg : 'Other';
    e[k]+=r.acres; e.base+=r.acres;
    const p=e.prod[r.key]||(e.prod[r.key]={ disp:r.product, ac:0 }); p.ac+=r.acres;   // for the top-products line
    const c=e.crop[r.crop]||(e.crop[r.crop]={ disp:r.crop, ac:0 }); c.ac+=r.acres;      // and the top-crops line
  });
  const topOf=o=>Object.keys(o).map(k=>o[k]).sort((a,b)=>b.ac-a.ac).slice(0,3);
  const rows=Object.keys(by).map(k=>by[k]).filter(x=>x.base>0).sort((a,b)=>b.base-a.base)
    .map(r=>({ ...r, top: topOf(r.prod), topCrop: topOf(r.crop) }));
  if(!rows.length) return { empty:true };
  const tot={ st:'', name:'All shown', base:0, Herbicide:0, Insecticide:0, Fungicide:0, Other:0, prod:{}, crop:{} };
  rows.forEach(r=>{ tot.base+=r.base; INS_SEGS.concat('Other').forEach(k=>{ tot[k]+=r[k]; });
    Object.keys(r.prod).forEach(k=>{ const p=tot.prod[k]||(tot.prod[k]={ disp:r.prod[k].disp, ac:0 }); p.ac+=r.prod[k].ac; });
    Object.keys(r.crop).forEach(k=>{ const c=tot.crop[k]||(tot.crop[k]={ disp:r.crop[k].disp, ac:0 }); c.ac+=r.crop[k].ac; }); });
  tot.top=topOf(tot.prod); tot.topCrop=topOf(tot.crop);
  return { rows, tot };
}

/* ===== focus-product daily trend =====
   UPL and SWAL each sell an equivalent of the same product (Iris ↔ Patela), so "is this product family growing
   across India?" is only answerable when the pair is ADDED TOGETHER — two separate lines answer a different and
   much less useful question. Both slots are user-chosen and either may be cleared.

   Daily product acres are extremely spiky, so a raw daily line cannot be read for direction; the chart carries a
   7-day rolling mean on top of it and the headline compares the last 7 days with the 7 before. */
function insProdTrend(A){
  if(!TX.loaded) return null;
  const scope=r=>(!A.gst||r.st===A.gst) && (!A.scoped || (A.og!=='Open' && r.company===A.og));
  const rows=TX.rows.filter(scope);
  const meta={}; rows.forEach(r=>{ const m=meta[r.brandKey]||(meta[r.brandKey]={ disp:r.brand, company:r.company, ac:0 }); m.ac+=r.acres; });
  const options=Object.keys(meta).map(k=>({ key:k, ...meta[k] })).sort((x,y)=>y.ac-x.ac);
  if(!options.length) return { options:[] };
  const defA=(options.find(o=>o.company==='UPL')||options[0]).key;
  const defB=(options.find(o=>o.company==='SWAL')||options[1]||{key:''}).key;
  const ok=v=>v && meta[v] ? v : null;
  const a=ok(state.insPa)||defA;
  const b=state.insPb==='none' ? null : (ok(state.insPb)||(defB!==a?defB:null));
  const sel=[a,b].filter(Boolean);
  const dates=rows.map(r=>r.d).sort();
  if(!dates.length) return { options };
  const per={}; rows.forEach(r=>{ if(sel.indexOf(r.brandKey)>=0) per[r.d]=(per[r.d]||0)+r.acres; });
  // Walk every calendar day in range so a day with no sale reads as 0, not as a gap in the line.
  const series=[], cur=new Date(dates[0]+'T00:00:00'), end=new Date(dates[dates.length-1]+'T00:00:00');
  while(cur<=end){ const iso=insISO(cur); series.push({ d:iso, v:per[iso]||0 }); cur.setDate(cur.getDate()+1); }
  series.forEach((p,i)=>{ let s=0,n=0; for(let j=Math.max(0,i-6);j<=i;j++){ s+=series[j].v; n++; } p.avg=s/n; });
  const last7=series.slice(-7).reduce((s,p)=>s+p.v,0), prior7=series.slice(-14,-7).reduce((s,p)=>s+p.v,0);
  return { options, a, b, sel, series, total:series.reduce((s,p)=>s+p.v,0), last7, prior7,
    trend: prior7 ? last7/prior7*100-100 : null,
    label: sel.map(k=>meta[k].disp).join(' + '),
    companies: sel.map(k=>meta[k].company) };
}
function buildProdTrendSVG(T,mob,exp){
  const s=T&&T.series; if(!s || s.length<2) return { has:false, svg:'', inner:'' };
  let max=1; s.forEach(p=>{ max=Math.max(max,p.v,p.avg); });
  // `exp` = deck rendering: the same geometry with type and strokes scaled up, because a 9.5px axis label that
  // reads fine on a monitor disappears on a projector.
  const F=exp?1.85:1, SW=exp?2:1;
  const Wd=mob?400:960, H=mob?230:260, mL=mob?46:(exp?96:62), mR=exp?24:14, mT=14, mB=exp?58:38;
  const x0=mL,x1=Wd-mR,y0=mT,y1=H-mB;
  const step=niceNum(max/4), nMax=Math.max(step,Math.ceil(max/step)*step);

  let grid=''; for(let t=0;t<=nMax+1e-6;t+=step){ const y=Y(t);
    grid+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="#EFEDE7" stroke-width="${SW}"/><text x="${x0-9*(exp?1.6:1)}" y="${(y+3.6*F).toFixed(1)}" text-anchor="end" font-size="${(10.5*F).toFixed(1)}" font-weight="${exp?600:400}" fill="${exp?'#6E6A62':'#9C988F'}" font-family="'IBM Plex Mono'">${snakeFmtK(t)}</text>`; }
  const every=Math.max(1,Math.ceil(s.length/(mob?5:(exp?9:12))));
  let lab=''; s.forEach((p,i)=>{ if(i%every===0||i===s.length-1){
    const dd=new Date(p.d+'T00:00:00');
    lab+=`<text x="${X(i).toFixed(1)}" y="${(y1+15*F).toFixed(1)}" text-anchor="middle" font-size="${(9.5*F).toFixed(1)}" font-weight="${exp?600:400}" fill="${exp?'#6E6A62':'#9C988F'}" font-family="'Noto Sans'">${dd.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dd.getMonth()]}</text>`; } });
  const path=(key,w,op)=>s.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p[key]).toFixed(1)}`).join(' ');
  const area=`${s.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.avg).toFixed(1)}`).join(' ')} L${X(s.length-1).toFixed(1)} ${y1} L${X(0).toFixed(1)} ${y1} Z`;
  const inner=`${grid}${lab}<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#D9D5CC" stroke-width="${SW}"/>
    <path d="${area}" fill="${C.softO}" opacity=".7"/>
    <path d="${path('v')}" fill="none" stroke="${C.orange}" stroke-width="${1*SW}" opacity=".45" stroke-linejoin="round"/>
    <path d="${path('avg')}" fill="none" stroke="${C.orangeD}" stroke-width="${2.6*SW}" stroke-linejoin="round" stroke-linecap="round"/>`;
  return { has:true, inner, vbW:Wd, vbH:H,
    svg:`<svg viewBox="0 0 ${Wd} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${inner}</svg>` };
}

/* The week's shape, this year against the same seven fiscal days last year. Bars, because the question is
   "which days did we work" — a per-day comparison, not a curve. */
function buildWeekBarsSVG(W,mob,exp){
  const days=W.days; let max=1;
  days.forEach(d=>{ max=Math.max(max, d.ac||0, d.ly||0); });
  const F=exp?1.9:1, SW=exp?2:1;
  const Wd=mob?400:960, H=mob?240:260, mL=mob?48:(exp?98:64), mR=exp?30:20, mT=18, mB=exp?78:50;
  const x0=mL,x1=Wd-mR,y0=mT,y1=H-mB;
  const step=niceNum(max/4), nMax=Math.max(step,Math.ceil(max/step)*step);
  const X=i=>x0+(days.length>1 ? i/(days.length-1)*(x1-x0) : (x1-x0)/2);
  const Y=v=>y1-(v/nMax)*(y1-y0);
  let grid=''; for(let t=0;t<=nMax+1e-6;t+=step){ const y=Y(t);
    grid+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="#EFEDE7" stroke-width="${SW}"/><text x="${x0-9*(exp?1.6:1)}" y="${(y+3.6*F).toFixed(1)}" text-anchor="end" font-size="${(10.5*F).toFixed(1)}" font-weight="${exp?600:400}" fill="${exp?'#6E6A62':'#9C988F'}" font-family="'IBM Plex Mono'">${snakeFmtK(t)}</text>`; }
  // One line per season over the same seven days. Lines rather than paired bars: the week's SHAPE — where it
  // climbed, where it broke — is what the review talks about, and two bars per day fragments exactly that.
  const line=(key,color,width,dash)=>{
    const pts=days.map((d,i)=>({i,v:d[key]})).filter(p=>p.v!=null);
    if(pts.length<2) return '';
    const d=pts.map((p,k)=>`${k?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width*SW}" stroke-linejoin="round" stroke-linecap="round"${dash?` stroke-dasharray="${dash*(exp?2:1)} ${4*(exp?2:1)}"`:''}/>`
      + pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${(width>2?3.6:2.8)*(exp?1.7:1)}" fill="#fff" stroke="${color}" stroke-width="${(width>2?2.4:1.8)*SW}"/>`).join('');
  };
  const area=(()=>{ const pts=days.map((d,i)=>({i,v:d.ac})).filter(p=>p.v!=null);
    if(pts.length<2) return '';
    return `<path d="${pts.map((p,k)=>`${k?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ')} L${X(pts[pts.length-1].i).toFixed(1)} ${y1} L${X(pts[0].i).toFixed(1)} ${y1} Z" fill="${C.softO}" opacity=".55"/>`; })();
  let lab='';
  days.forEach((d,i)=>{
    lab+=`<text x="${X(i).toFixed(1)}" y="${(y1+19*F).toFixed(1)}" text-anchor="middle" font-size="${(12*F).toFixed(1)}" font-weight="700" fill="${exp?'#14120F':'#46433d'}" font-family="'Noto Sans'">${d.dow}</text>`;
    lab+=`<text x="${X(i).toFixed(1)}" y="${(y1+34*F).toFixed(1)}" text-anchor="middle" font-size="${(10*F).toFixed(1)}" font-weight="${exp?600:400}" fill="${exp?'#7C776E':'#B6B1A8'}" font-family="'IBM Plex Mono'">${d.mc!=null?fmt(d.mc)+' mc':''}</text>`;
  });
  const inner=`${grid}${lab}<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#D9D5CC" stroke-width="${SW}"/>${area}${line('ly',INS_PREV.color,1.8,5)}${line('ac',INS_CUR.color,2.8,0)}`;
  return { inner, vbW:Wd, vbH:H, svg:`<svg viewBox="0 0 ${Wd} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${inner}</svg>` };
}

/* ===================== Yesterday mode =====================
   The season view answers "are we going to make the number, and what do we correct over the coming weeks".
   This one answers a different question with a different response time: "what broke yesterday, and who do I ring
   this morning". They are NOT the same list re-sorted — measured against live data, the chronic territories and
   the acute ones overlap by zero. Harda has 6,359 season acres and did nothing yesterday (a call); Morbi has
   never sprayed at all (a season problem, and it belongs on the other tab).

   NO COUNTERFACTUALS. An earlier build scored each territory against an "expected acres" figure derived from its
   share of the season. That was wrong and was removed: it assumed a territory's share of any single day matches
   its share of the whole season, which is false for any territory whose crop calendar differs from its state's
   average — and it dressed a loose assumption up as a precise number, which invites "says who?" and deserves it.

   Everything here is instead a COUNT you can point at in a column. Rather than "Hanumangarh was 195 ac short",
   the page says "24 of Hanumangarh's 43 machines have an operator, have sprayed this season, and did not run".
   The idleness buckets are mutually exclusive and sum exactly to the idle total, so the account always balances.

   THE ONE BASELINE that survives is the 14-day norm, and only because it is a different kind of claim: the same
   series measured against its own recent past (the snake tab's real daily history), not a cross-sectional guess
   about how one territory ought to behave.

   CONFIDENCE. These still rest on a single day, where the season tab rests on cumulative totals. Rain is carried
   as an annotation from the Open-Meteo data the app already holds — never as a scoring weight, since a count does
   not need re-weighting to stay true. */
const INS_DAY = { MIN_MC:4, AM_MIN:8, WET_MM:5, SLOTS:7, AM_SLOTS:4, CONC_TOP:3 };
function insDayAgg(A){
  const dep=A.dep||[];
  const ran=[], idle=[];
  dep.forEach(m=> ((m.acresY||0)>0 ? ran : idle).push(m));
  const D={ deployed:dep.length, ran:ran.length, idle:idle.length,
            acres:dep.reduce((a,m)=>a+(m.acresY||0),0), flagged:dep.filter(m=>!!m.breakdown).length };

  /* ---- why the idle fleet didn't run: mutually exclusive, first match wins, sums to idle.length ----
     The breakdown bucket is kept first even though it is empty in today's data — every flagged machine also
     logged acres, so the flag evidently records a reported event rather than "down right now". Keeping the
     bucket means the account stays correct if that column's meaning is ever fixed, instead of silently
     misfiling those machines into "unexplained". */
  const B={ broken:[], noOp:[], never:[], dark:[], unexplained:[] };
  idle.forEach(m=>{
    if(m.breakdown) B.broken.push(m);
    else if(!m.opMapped) B.noOp.push(m);
    else if(!((m.achieved||0)>0)) B.never.push(m);
    else if(!m.pinged) B.dark.push(m);                // capable, but sent no signal — we do not know what it did
    else B.unexplained.push(m);                       // reported in, has an operator, has sprayed before, sat out
  });
  D.buckets=[
    { key:'broken', n:B.broken.length, label:'Reported broken down', hint:'flagged in the breakdown column', c:C.open },
    { key:'noOp',   n:B.noOp.length,   label:'Nobody assigned to drive it', hint:'no operator on the sheet', c:C.idle },
    { key:'never',  n:B.never.length,  label:'Has never sprayed all season', hint:'a season-long problem, not a yesterday one', c:C.ink3 },
    { key:'dark',   n:B.dark.length,   label:'Sent no signal yesterday', hint:'no ping, so there is no record either way', c:C.openD },
    { key:'unexplained', n:B.unexplained.length, label:'On, and still did nothing', hint:'reported in, has a driver, has sprayed before', c:C.brk },
  ].filter(x=>x.n>0);
  D.unexplainedN = B.unexplained.length;
  D.darkN = B.dark.length;
  D.unexplainedCapability = B.unexplained.reduce((a,m)=>a+(m.achieved||0),0);   // proven acres now sitting still

  /* ---- unexplained idle, grouped by CLUSTER and by AREA MANAGER. Ranked by MACHINE COUNT — a fact — with the
         season acres those machines have already produced as the magnitude, so a big idle fleet outranks a small
         one. Cluster rather than territory because the cluster is the smallest unit with a named owner on the
         sheet, and a row nobody owns is a row nobody can act on. Rain is looked up on the cluster's dominant
         TERRITORY, since the weather feed is keyed by district and knows nothing about clusters. ---- */
  const roll=(list,key)=>{
    const G={};
    list.forEach(m=>{ const t=String(m[key]||'').trim(); if(insJunkTerr(t)) return;
      const k=m.st+'|'+t, g=G[k]||(G[k]={ st:m.st, name:t, n:0, cap:0, rows:[] });
      g.n++; g.cap+=(m.achieved||0); g.rows.push(m); });
    return G;
  };
  const sizeOf=key=>{ const size={}, act={};
    dep.forEach(m=>{ const t=String(m[key]||'').trim(); if(insJunkTerr(t)) return;
      const k=m.st+'|'+t; size[k]=(size[k]||0)+1; if((m.acresY||0)>0) act[k]=(act[k]||0)+(m.acresY||0); });
    return { size, act }; };

  const clSz=sizeOf('cluster'), clG=roll(B.unexplained,'cluster');
  D.clusters=Object.keys(clG).map(k=>{
    const g=clG[k], terr=domStr(g.rows.map(m=>m.territory));
    let rain=null; try{ rain=rainAbs(terr, WX_I_YDAY, g.st); }catch(_){}
    const co=domStr(g.rows.map(m=>m.co));
    return { st:g.st, name:g.name, n:g.n, cap:g.cap, terr, deployed:clSz.size[k]||g.n, ranAcres:clSz.act[k]||0, rain,
             owner: co ? { role:'Cluster officer', name:co, phone:domStr(g.rows.filter(m=>m.co===co).map(m=>m.coMob)) } : null };
  }).filter(g=>g.deployed>=INS_DAY.MIN_MC && g.n>=3)
    .sort((a,b)=> b.n-a.n || b.cap-a.cap);

  const amSz=sizeOf('am'), amG=roll(B.unexplained,'am');
  D.ams=Object.keys(amG).map(k=>{
    const g=amG[k];
    return { st:g.st, name:g.name, n:g.n, cap:g.cap, deployed:amSz.size[k]||g.n, ranAcres:amSz.act[k]||0, rain:null,
             owner:{ role:'Area manager', name:g.name, phone:domStr(g.rows.map(m=>m.amNum)) } };
  }).filter(g=>g.deployed>=INS_DAY.AM_MIN && g.n>=4)
    .sort((a,b)=> b.n-a.n || b.cap-a.cap);

  /* ---- where the work happened: participation and concentration, both pure observation.
         Still measured on TERRITORY, deliberately: this is about how widely the day was spread across the
         country, and territory is the coarser geography people picture when they ask that. ---- */
  const tSz=sizeOf('territory'), activeT=tSz.act;
  D.terrTotal=Object.keys(tSz.size).length; D.terrActive=Object.keys(activeT).length;
  const acresSorted=ran.map(m=>m.acresY||0).sort((a,b)=>b-a);
  let half=0, nHalf=0;
  for(const v of acresSorted){ if(half>=D.acres/2) break; half+=v; nHalf++; }
  D.machinesForHalf=nHalf;
  const topT=Object.keys(activeT).map(k=>({k,v:activeT[k]})).sort((a,b)=>b.v-a.v).slice(0,INS_DAY.CONC_TOP);
  D.topShare = D.acres? topT.reduce((a,x)=>a+x.v,0)/D.acres*100 : 0;
  D.topNames = topT.map(x=>x.k.split('|')[1]);

  /* ---- the one legitimate baseline: this scope's own 14-day norm, from the snake tab's real daily history ---- */
  D.dayAc=null; D.norm=null;
  if(A.season){ const d=insDaily(A.snCode,INS_CUR.key); D.dayAc=d[A.season.off]; D.norm=insRoll(d,A.season.off,14); }
  D.prodY = A.prod ? A.prod.yday : null;
  return D;
}

/* Day-by-day acres, this season against last, over the trailing three weeks. Bars rather than lines: the question
   is "did we out-work the same day last year", which is a per-day comparison, not a shape. */
function buildInsBarsSVG(A,mob){
  const s=A.season; if(!s) return {has:false,svg:''};
  const n=mob?14:21, from=Math.max(0,s.off-n+1);
  const dCur=insDaily(A.snCode,INS_CUR.key), dPrev=insDaily(A.snCode,INS_PREV.key);
  const vals=[]; for(let o=from;o<=s.off;o++) vals.push({off:o, cur:dCur[o], prev:dPrev[o]});
  if(!vals.length) return {has:false,svg:''};
  let maxV=1; vals.forEach(v=>{ maxV=Math.max(maxV, v.cur||0, v.prev||0); });
  const W=mob?400:980, H=mob?230:250, mL=mob?46:62, mR=mob?10:16, mT=14, mB=mob?36:34;
  const x0=mL,x1=W-mR,y0=mT,y1=H-mB;
  const bw=(x1-x0)/vals.length, gap=Math.min(4,bw*0.16), half=Math.max(1,(bw-gap*2)/2);
  const step=niceNum(maxV/4), nMax=Math.max(step,Math.ceil(maxV/step)*step);
  const Y=v=>y1-(v/nMax)*(y1-y0);
  let grid=''; for(let t=0;t<=nMax+1e-6;t+=step){ const y=Y(t);
    grid+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="#EFEDE7"/><text x="${x0-8}" y="${(y+3.6).toFixed(1)}" text-anchor="end" font-size="10" fill="#9C988F" font-family="'IBM Plex Mono'">${snakeFmtK(t)}</text>`; }
  const every=Math.max(1,Math.ceil(vals.length/(mob?5:11)));
  let bars='', lab='';
  vals.forEach((v,i)=>{ const bx=x0+i*bw+gap;
    if(v.prev!=null&&v.prev>0) bars+=`<rect x="${bx.toFixed(1)}" y="${Y(v.prev).toFixed(1)}" width="${half.toFixed(1)}" height="${Math.max(0,y1-Y(v.prev)).toFixed(1)}" fill="${INS_PREV.color}" opacity=".5" rx="1.5"/>`;
    if(v.cur!=null&&v.cur>0)  bars+=`<rect x="${(bx+half).toFixed(1)}" y="${Y(v.cur).toFixed(1)}" width="${half.toFixed(1)}" height="${Math.max(0,y1-Y(v.cur)).toFixed(1)}" fill="${INS_CUR.color}" rx="1.5"/>`;
    if(i%every===0||i===vals.length-1) lab+=`<text x="${(bx+half).toFixed(1)}" y="${y1+14}" text-anchor="middle" font-size="9.5" fill="#9C988F" font-family="'Noto Sans'">${snakeOffLabel(v.off)}</text>`;
  });
  return { has:true, svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${grid}${lab}<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#D9D5CC"/>${bars}</svg>` };
}
/* Machines that logged acres each day, last 60 days — the fleet's pulse next to the acres it produced. */
function buildInsSparkSVG(A){
  const s=A.season; if(!s) return {has:false,svg:''};
  const m=insMach(A.snCode), pts=[];
  for(let o=Math.max(0,s.off-59);o<=s.off;o++) if(m[o]!=null) pts.push(m[o]);
  if(pts.length<2) return {has:false,svg:''};
  const W=520,H=58,x0=1,x1=W-1,y0=5,y1=H-5;
  let maxV=1; pts.forEach(v=>{ if(v>maxV) maxV=v; });
  const X=i=>x0+i/(pts.length-1)*(x1-x0), Y=v=>y1-(v/maxV)*(y1-y0);
  const line=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return { has:true, svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:${H}px">
    <path d="${line} L${X(pts.length-1).toFixed(1)} ${y1} L${X(0).toFixed(1)} ${y1} Z" fill="${C.softO}"/>
    <path d="${line}" fill="none" stroke="${C.orange}" stroke-width="1.7" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1]).toFixed(1)}" r="3" fill="${C.orangeD}"/></svg>` };
}

        <span style="flex:1;min-width:0;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}</span>
        ${sub?`<span style="font-size:10.5px;color:#B6B1A8">${sub}</span>`:''}
        <span style="font-family:'IBM Plex Mono';font-size:12px;font-weight:600">${fmt(val)}</span></div>
      <span style="display:block;height:7px;border-radius:4px;background:#F2F0EB;overflow:hidden"><span style="display:block;height:100%;width:${w}%;background:${colour};border-radius:4px"></span></span></div>`; };

  /* ---------- header ---------- */
  const src = `<span style="font-size:10.5px;color:#9C988F">Machines ${lastUpdated||'—'} · season ${SNAKE.at||'—'} · products ${PROD.at||'—'}
      <button data-act="insrefresh" title="Reload all three tabs" style="border:none;background:none;color:#6E6A62;cursor:pointer;font-size:11px;text-decoration:underline;padding:0 0 0 4px">refresh</button></span>`;
  // State picker — page-local (writes state.insSt, never state.st), and only offered to a login the gate has
  // not already pinned to one state. Options are filtered by gateAllowsState so the list can't advertise a
  // state the user may not open.
  const canPick = !A.lock && gateCanSwitchStates();
  const stSel = canPick ? `<div style="display:flex;align-items:center;gap:7px">
      <span style="font-size:10px;font-weight:600;letter-spacing:.08em;color:#9C988F;text-transform:uppercase">Scope</span>
      <div style="position:relative"><select id="insStateSel" style="height:32px;border:1px solid #E9E6DF;border-radius:8px;background:#fff;padding:0 26px 0 11px;font-family:'Noto Sans';font-size:12.5px;color:#1B1A17;cursor:pointer;outline:none">${
        optionsHTML([{v:'',t:'All India'},...INS_STATES.filter(gateAllowsState).map(c=>({v:c,t:STATE_NAMES[c]}))], A.gst)
      }</select>${I.caret}</div></div>` : '';
  const mode = ['yday','week'].includes(state.insMode) ? state.insMode : 'season';
  const modeToggle = `<div style="display:flex;background:#F2F0EB;border-radius:8px;padding:3px;gap:2px">
      ${[['season','Season'],['week','Week'],['yday','Yesterday']].map(([k,t])=>`<button data-act="insmode" data-m="${k}" style="${css(seg(mode===k))}">${t}</button>`).join('')}</div>`;
  const scopeName = A.gst?E(A.regionName):'Seven states';
  // Copy rule for this whole page: describe what the figure IS, never tell the reader what to do with it. The
  // page is read by whoever opens it, not narrated to a presenter — so "both measures moved" and not "worth
  // saying both ways", "yesterday in detail" and not "leads to check this morning".
  const subtitle = mode==='yday' ? `${scopeName} · yesterday in detail`
    : mode==='week' ? `${scopeName} · one completed week, ${INS_WEEK_PHRASE}`
    : `${scopeName} · the season so far`;
  // flex-basis, not flex:1 — with the mode toggle, the scope picker and the freshness line all competing for the
  // row, a purely greedy title collapses to two cramped lines before the row ever wraps.
  const header = `<div style="display:flex;align-items:center;gap:${mob?'10px':'14px'};flex-wrap:wrap">
      <div style="flex:1 1 260px;min-width:210px">
        <div style="font-size:${mob?'15px':'16.5px'};font-weight:700;letter-spacing:-.01em">Programme insights</div>
        <div style="font-size:11.5px;color:#9C988F;margin-top:2px">${subtitle}${A.scoped?` · ${E(A.og)} only`:''}</div>
      </div>${modeToggle}${stSel}${mob?'':`<div style="flex:0 1 auto">${src}</div>`}</div>`;

  /* ================= Week mode · the Monday review =================
     Tuned to be read off a projector rather than scanned at a desk: fewer, larger numbers and one idea per card. */
  if(mode==='week'){
    if(!TX.loaded  && !TX.loading  && !TX.error ) setTimeout(loadTx,0);    // day-level products, for the trend
    if(!WKP.loaded && !WKP.loading && !WKP.error) setTimeout(loadWkp,0);   // weekly per-product detail
    if(!PROD.loaded && !PROD.loading && !PROD.error) setTimeout(loadProduct,0);   // brand → portfolio, for segments
    const W=insWeekAgg(A, state.insWeekBack|0);
    const stepper=`<div style="display:flex;align-items:center;gap:8px">
        <button data-act="insweek" data-d="-1" title="Earlier week" style="width:30px;height:30px;border:1px solid #E9E6DF;border-radius:8px;background:#fff;color:#46433d;font-size:15px;cursor:pointer;line-height:1">‹</button>
        <span style="font-size:12.5px;font-weight:600;min-width:${mob?'120px':'132px'};text-align:center">${W?`${E(insWeekLabel(W.d0))} – ${E(insWeekLabel(W.d1))}`:'—'}</span>
        <button data-act="insweek" data-d="1" title="Later week" ${state.insWeekBack<=0?'disabled':''} style="width:30px;height:30px;border:1px solid #E9E6DF;border-radius:8px;background:${state.insWeekBack<=0?'#F6F5F2':'#fff'};color:${state.insWeekBack<=0?'#C9C4BA':'#46433d'};font-size:15px;cursor:${state.insWeekBack<=0?'default':'pointer'};line-height:1">›</button>
      </div>`;
    const wHead=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:-2px">${stepper}
        <span style="font-size:11px;color:#B6B1A8">${state.insWeekBack===0?'the week that just ended':`${state.insWeekBack} week${state.insWeekBack===1?'':'s'} earlier`} · ${INS_WEEK_SHORT}</span></div>`;
    if(!W || !SNAKE.loaded || !W.hasData){
      return `<div style="display:flex;flex-direction:column;gap:14px">${header}${wHead}
        ${card(waiting(SNAKE.error, SNAKE.error?'Could not load the cumulative tab.':(SNAKE.loaded?'No acres were logged in this week.':'Loading the season history…'),'snakeretry'))}
        </div>`;
    }
    /* Export scaffold: wrap a card in a titled host the exporter can serialise, and hang a PNG button on it.
       Weekly review only — the other modes are read on screen, not lifted into slides. */
    const wkSub=`${insWeekLabel(W.d0)} – ${insWeekLabel(W.d1)} · ${A.gst?A.regionName:'all India'}`;
    const dlWrap=(id,title,inner)=> inner ? `<div style="position:relative">
        <div id="${id}" data-title="${E(title)}" data-sub="${E(wkSub)}" data-file="${id}_${insISO(W.d1)}">${inner}</div>
        <button data-act="dlcard" data-id="${id}" title="Download this as a PNG for your deck"
          style="position:absolute;top:11px;right:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid #E9E6DF;border-radius:8px;background:#fff;color:#6E6A62;font-family:'Noto Sans';font-size:11px;font-weight:600;cursor:pointer;z-index:2">${DL_ICON}PNG</button>
      </div>` : '';
    const big=(v,l,sub,ink)=>`<div style="flex:1 0 auto;min-width:${mob?'46%':'168px'};padding:${mob?'14px 16px':'16px 20px'};border-right:1px solid #EFEDE7;border-bottom:1px solid #EFEDE7">
        <div style="font-family:'IBM Plex Mono';font-size:${mob?'21px':'26px'};font-weight:700;color:${ink||C.ink};line-height:1">${v}</div>
        <div style="font-size:10.5px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase;margin-top:7px">${l}</div>
        ${sub?`<div style="font-size:11px;color:#B6B1A8;margin-top:3px">${sub}</div>`:''}</div>`;
    const pill2=(p,lab)=>p==null?'':`<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:${p>=0?C.softG:C.softR};color:${p>=0?C.greenD:C.brk};font-size:${mob?'12px':'13px'};font-weight:700;white-space:nowrap">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%<span style="color:#9C988F;font-weight:500">${lab}</span></span>`;
    // Local: the league's vsCell is declared further down this function and would be in the temporal dead zone here.
    const wVs=v=>v==null?`<span style="color:#C9C4BA">—</span>`:`<span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:700;color:${v>=0?C.greenD:C.brk}">${v>=0?'+':'−'}${Math.abs(v).toFixed(0)}%</span>`;
    const hero=card(`<div style="padding:${mob?'16px':'20px'}">
        <div style="font-size:11px;font-weight:700;letter-spacing:.07em;color:#9C988F;text-transform:uppercase;margin-bottom:7px">Week of ${E(insWeekLabel(W.d0))} – ${E(insWeekLabel(W.d1))} · ${E(A.gst?A.regionName:'all India')}</div>
        <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
          <div style="font-family:'IBM Plex Mono';font-size:${mob?'36px':'48px'};font-weight:700;line-height:1;letter-spacing:-.02em">${fmt(W.acres)}<span style="font-size:${mob?'15px':'18px'};color:#B6B1A8;font-weight:500"> ac</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px">${pill2(W.wow,' on the week before')}${pill2(W.yoy,' on the same week last season')}${pill2(W.yoy2,' on two seasons ago')}</div>
        </div></div>
      <div style="display:flex;flex-wrap:wrap;background:#FBFAF8;border-top:1px solid #EFEDE7">
        ${big(fmt(W.acres/7),'acres a day', W.bestDay?`${W.bestDay.dow} was the best, at ${fmt(W.bestDay.ac)}`:'averaged over the seven days',C.orangeD)}
        ${big(W.machPeak!=null?fmt(W.machPeak):'—','machines on the busiest day', W.machAvg!=null?`${fmt(W.machAvg)} on an average day`:'')}
        ${big(W.acPerMachine!=null?fmt(W.acPerMachine):'—','acres each','what one machine covered on a day it worked')}
        ${big(W.ly!=null?fmt(W.ly):'—','the same week last year', W.ly!=null?`${fmt(Math.abs(W.acres-W.ly))} acres ${W.acres>=W.ly?'more':'less'} this time`:'')}
      </div>`);

    /* Season position — always in BOTH units, because they can disagree. */
    const POS=W.pos;
    let posCard='';
    if(POS.pct0!=null && POS.pct1!=null && POS.ac0!=null && POS.ac1!=null){
      const dPct=POS.pct1-POS.pct0, dAc=POS.ac1-POS.ac0;
      // ac0/ac1 are (last season − this season), so a NEGATIVE value means this season is ahead. A scope that is
      // ahead must not be described as "17,726 acres behind"; the noun and the sign both flip.
      const aheadEnd = POS.pct1>=0, noun = aheadEnd?'lead':'gap';
      const better = d => aheadEnd ? 'grew' : 'narrowed';           // improving, in the right noun
      const worse  = d => aheadEnd ? 'shrank' : 'widened';
      const pctWord = dPct>=0?better():worse(), acWord = dAc<=0?better():worse();
      const agree = (dPct>=0)===(dAc<=0);
      const line = agree
        ? `Both ways of measuring agree: over the week the season ${noun} ${pctWord}, by ${Math.abs(dPct).toFixed(1)} percentage points and by ${fmt(Math.abs(dAc))} acres.`
        : `The two measures disagree this week. As a percentage the ${noun} ${pctWord} by ${Math.abs(dPct).toFixed(1)} points, but counted in acres it ${acWord} by ${fmt(Math.abs(dAc))}. Both are true: this season grew faster than the difference between the two seasons did, so the ratio improved while the raw distance did not.`;
      const acLabel = v => v>=0 ? 'acres behind' : 'acres ahead';
      // The cells show MAGNITUDES, so the delta beneath them must be the change in that magnitude — otherwise a
      // growing lead would read as a negative number sitting under a rising figure.
      const dMag = Math.abs(POS.ac1) - Math.abs(POS.ac0);
      posCard=card(`${cHead('Where the week left the season','How this season stood against last season on the day before the week began, and again on its last day')}
        <div style="display:flex;flex-wrap:wrap;background:#FBFAF8;border-bottom:1px solid #EFEDE7">
          ${big(`${POS.pct0>=0?'+':'−'}${Math.abs(POS.pct0).toFixed(1)}%`,`${POS.pct0>=0?'lead':'gap'} before the week`)}
          ${big(`${POS.pct1>=0?'+':'−'}${Math.abs(POS.pct1).toFixed(1)}%`,`${noun} after it`, `${Math.abs(dPct).toFixed(1)} points ${dPct>=0?'better':'worse'}`, dPct>=0?C.act:C.brk)}
          ${big(fmt(Math.abs(POS.ac0)),`${acLabel(POS.ac0)} before the week`)}
          ${big(fmt(Math.abs(POS.ac1)),`${acLabel(POS.ac1)} after it`, `${fmt(Math.abs(dMag))} acres ${dMag>=0?'wider':'closer'}`, dAc<=0?C.act:C.brk)}
        </div>
        <div style="padding:13px 16px;font-size:${mob?'12.5px':'13.5px'};color:#46433d;line-height:1.6">${line}</div>`);
    }

    const bars=buildWeekBarsSVG(W,mob);
    const shape=card(`${cHead('The week day by day','Each day against the same day of last season · the number under each day is how many machines worked')}
      <div style="display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px 2px">
        <div style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:3px;background:${INS_CUR.color}"></span><span style="font-size:12px;font-weight:600">This week</span><span style="font-family:'IBM Plex Mono';font-size:12px;color:#6E6A62">${fmt(W.acres)}</span></div>
        <div style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:3px;background:${INS_PREV.color};opacity:.45"></span><span style="font-size:12px;font-weight:600">Same week ’25-26</span><span style="font-family:'IBM Plex Mono';font-size:12px;color:#6E6A62">${W.ly!=null?fmt(W.ly):'—'}</span></div>
      </div>
      <div style="padding:2px ${mob?'2px':'8px'} 12px">${bars.svg}</div>`);

    const gcols=mob?null:'1.5fr .9fr .8fr .7fr .7fr .8fr';
    const states = W.states.length>1 ? card(`${cHead(`States, week of ${E(insWeekLabel(W.d0))}`,'Most acres in the week first · click a row to narrow the page to that state')}
      ${mob ? W.states.map((r,i)=>`<div data-act="insdrill" data-key="${r.code}" style="padding:12px 15px;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="flex:1;font-size:13px;font-weight:700">${E(r.name)}</span>
            <span style="font-family:'IBM Plex Mono';font-size:13px;font-weight:700">${fmt(r.ac)}</span>
            ${wVs(r.yoy)}</div>
          <div style="font-size:11px;color:#9C988F;margin-top:4px">${W.total?(r.ac/W.total*100).toFixed(0):0}% of the week · ${r.wow==null?'—':(r.wow>=0?'+':'−')+Math.abs(Math.round(r.wow))+'% on the week before'} · ${r.mach!=null?fmt(r.mach)+' machines a day':'—'}</div>
        </div>`).join('')
      : `<div style="display:grid;grid-template-columns:${gcols};gap:10px;padding:10px 16px;border-bottom:1px solid #EFEDE7;background:#FBFAF8">
          ${['State','Acres','Share of week','vs prev week','vs last year','Machines a day'].map(h=>`<span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase">${h}</span>`).join('')}</div>
        ${W.states.map((r,i)=>`<div data-act="insdrill" data-key="${r.code}" style="display:grid;grid-template-columns:${gcols};gap:10px;align-items:center;padding:12px 16px;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
          <span style="font-size:13px;font-weight:600">${E(r.name)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:13px;font-weight:700">${fmt(r.ac)}</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;color:#6E6A62">${W.total?(r.ac/W.total*100).toFixed(0):0}%</span>
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:600;color:${r.wow==null?C.ink3:r.wow>=0?C.greenD:C.brk}">${r.wow==null?'—':(r.wow>=0?'+':'−')+Math.abs(r.wow).toFixed(0)+'%'}</span>
          ${wVs(r.yoy)}
          <span style="font-family:'IBM Plex Mono';font-size:12.5px">${r.mach!=null?fmt(r.mach):'—'}</span>
        </div>`).join('')}`}`) : '';

    /* ---- tracked products for the week (day-level tab) ---- */
    const TP=insWeekProducts(A,W);
    const chip = c => `<span style="display:inline-block;padding:1px 6px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.03em;background:${c==='UPL'?C.softO:C.softG};color:${c==='UPL'?C.orangeD:C.greenD}">${c}</span>`;
    let prodWk='';
    if(!WKP.loaded){
      prodWk=card(`${cHead('What was sprayed this week','From the weekly product sheet')}${waiting(WKP.error, WKP.error?'Could not load the weekly product sheet.':'Loading the weekly product sheet…','wkpretry')}`);
    } else if(TP && TP.wrongWeek){
      prodWk=card(`${cHead('What was sprayed this week','From the weekly product sheet')}${waiting(false,`Per-product detail is only available for ${E(insWeekLabel(new Date(WKP_WEEK.start+'T00:00:00')))} – ${E(insWeekLabel(new Date(WKP_WEEK.end+'T00:00:00')))}, the one week the sheet covers.`,'wkpretry')}`);
    } else if(!TP || TP.empty || !TP.total){
      prodWk=card(`${cHead('What was sprayed this week','From the weekly product sheet')}${waiting(false,'No product acres recorded for this scope.','wkpretry')}`);
    } else {
      const share = W.acres ? TP.total/W.acres*100 : null;
      const pMax = TP.products.length ? TP.products[0].ac : 1;
      const top = TP.products.slice(0,12);
      const pRow = (x,i) => `<div style="display:grid;grid-template-columns:${mob?'1fr 66px':'minmax(150px,300px) minmax(0,1fr) 84px 58px'};gap:10px;align-items:center;padding:9px 16px;border-top:${i?'1px solid #F4F2EE':'none'}">
          <div style="display:flex;align-items:center;gap:7px;min-width:0"><span style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(x.disp)}</span>${chip(x.company)}</div>
          ${mob?'':`<span style="display:block;height:8px;border-radius:4px;background:#F2F0EB;overflow:hidden"><span style="display:block;height:100%;width:${Math.max(1,x.ac/pMax*100)}%;background:${x.company==='UPL'?C.orange:C.green};border-radius:4px"></span></span>`}
          <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:700;text-align:right">${fmt(x.ac)}</span>
          ${mob?'':`<span style="font-family:'IBM Plex Mono';font-size:11.5px;color:#9C988F;text-align:right">${(x.ac/TP.total*100).toFixed(0)}%</span>`}
        </div>`;
      const regStrip = (!A.gst && TP.regions.length>1) ? `<div style="padding:11px 16px;border-top:1px solid #EFEDE7;display:flex;gap:14px;flex-wrap:wrap">
          ${TP.regions.slice(0,5).map(r=>`<span style="font-size:11.5px;color:#6E6A62"><strong style="color:#46433d">${E(r.name)}</strong> ${fmt(r.ac)} ac<span style="color:#B6B1A8"> · ${(r.ac/TP.total*100).toFixed(0)}%</span></span>`).join('')}</div>` : '';
      prodWk=card(`${cHead(`Products this week · ${E(A.gst?A.regionName:'all India')}`,
          `${fmt(TP.products.length)} products${share!=null?` · ${fmt(TP.total)} ac, ${share.toFixed(0)}% of the ${fmt(W.acres)} ac the fleet sprayed`:''}`)}
        <div style="display:flex;flex-wrap:wrap;background:#FBFAF8;border-bottom:1px solid #EFEDE7">
          ${big(fmt(TP.total),'product acres', `${fmt(TP.products.length)} products, ${fmt(TP.crops.length)} crops`, C.orangeD)}
          ${big(fmt(TP.upl),'UPL', TP.total?`${(TP.upl/TP.total*100).toFixed(0)}% of product acres`:'', C.orangeD)}
          ${big(fmt(TP.swal),'SWAL', TP.total?`${(TP.swal/TP.total*100).toFixed(0)}% of product acres`:'', C.greenD)}
          ${big(TP.crops.length?E(TP.crops[0].key):'—','top crop', TP.crops.length?`${fmt(TP.crops[0].ac)} ac`:'')}
        </div>
        <div style="display:grid;grid-template-columns:${mob?'1fr 66px':'minmax(150px,300px) minmax(0,1fr) 84px 58px'};gap:10px;padding:10px 16px;border-bottom:1px solid #EFEDE7">
          ${(mob?['Product','Acres']:['Product','','Acres','Share']).map(h=>`<span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;${h==='Acres'||h==='Share'?'text-align:right':''}">${h}</span>`).join('')}</div>
        ${top.map(pRow).join('')}
        ${TP.products.length>top.length?`<div style="padding:9px 16px;border-top:1px solid #F4F2EE;font-size:11px;color:#B6B1A8">${fmt(TP.products.length-top.length)} further products account for ${fmt(TP.total-top.reduce((s,x)=>s+x.ac,0))} ac.</div>`:''}
        ${TP.crops.length>1?`<div style="padding:11px 16px;border-top:1px solid #EFEDE7;font-size:11.5px;color:#6E6A62">By crop · ${TP.crops.slice(0,5).map(c=>`${E(c.key)} <span style="font-family:'IBM Plex Mono';color:#46433d">${fmt(c.ac)}</span>`).join(' · ')}</div>`:''}
        ${regStrip}`);
    }

    /* ---- product segments by state ---- */
    const SG=insWeekSegments(A,W);
    const SEG_C={ Herbicide:C.green, Insecticide:C.orange, Fungicide:C.open, Other:'#B6B1A8' };
    let segCard='';
    if(!WKP.loaded || !PROD.loaded){
      segCard=card(`${cHead('Kinds of product, by state','The weekly product sheet, grouped into what each brand treats')}${waiting(WKP.error||PROD.error, (WKP.error||PROD.error)?'Could not load the product sheets.':'Loading product segments…','wkpretry')}`);
    } else if(SG && SG.wrongWeek){
      segCard='';                                            // the week card already explains the coverage
    } else if(!SG || SG.empty){
      segCard=card(`${cHead('Kinds of product, by state','The weekly product sheet, grouped into what each brand treats')}${waiting(false,'No segment-classified product acres for this scope.','wkpretry')}`);
    } else {
      const SEGL=INS_SEGS.concat('Other');
      const bar=r=>`<span style="display:flex;height:9px;border-radius:5px;overflow:hidden;background:#F2F0EB">${SEGL.map(k=>r[k]>0?`<span style="width:${r[k]/r.base*100}%;background:${SEG_C[k]}"></span>`:'').join('')}</span>`;
      const gc=mob?'1fr 54px 54px 54px':'minmax(0,2.5fr) 132px 76px 58px 58px 58px 54px';
      const hdr=(mob?['State · top products and crops','Herb','Ins','Fung']:['State · top products and crops','','Acres','Herb','Ins','Fung','Other']);
      // Top products sit under the state name rather than in a column: they are the "what", the percentages are
      // the "shape", and a seventh column would crowd both off a projector.
      const subLine=(tag,list)=>(list&&list.length)?`<div style="font-size:10.5px;color:#9C988F;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="display:inline-block;min-width:${mob?'46px':'52px'};color:#C1BCB2">${tag}</span>${list.map(p=>`${E(p.disp)} <span style="font-family:'IBM Plex Mono';color:#6E6A62">${fmt(p.ac)}</span>`).join(' · ')}</div>`:'';
      const topLine=r=>subLine('Products',r.top)+subLine('Crops',r.topCrop);
      const row=(r,i,isTot)=>`<div style="display:grid;grid-template-columns:${gc};gap:10px;align-items:center;padding:${isTot?'11px':'10px'} 16px;border-top:1px solid ${isTot?'#E9E6DF':'#F4F2EE'};${isTot?'background:#FBFAF8':''}">
          <div style="min-width:0"><span style="font-size:12.5px;font-weight:${isTot?700:600}">${E(r.name)}</span>${topLine(r)}</div>
          ${mob?'':`<div>${bar(r)}</div>`}
          ${mob?'':`<span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:${isTot?700:600};text-align:right">${fmt(r.base)}</span>`}
          ${SEGL.map(k=>(mob&&k==='Other')?'':`<span style="font-family:'IBM Plex Mono';font-size:12.5px;text-align:right;color:${r[k]>0?C.ink:'#C9C4BA'};font-weight:${isTot?700:400}">${r.base?(r[k]/r.base*100).toFixed(0)+'%':'—'}</span>`).join('')}
        </div>`;
      const legend=`<div style="display:flex;gap:14px;flex-wrap:wrap;padding:11px 16px 4px">${SEGL.map(k=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#6E6A62"><span style="width:10px;height:10px;border-radius:3px;background:${SEG_C[k]}"></span>${k}</span>`).join('')}</div>`;
      segCard=card(`${cHead(`Product segments by state · ${E(A.gst?A.regionName:'all India')}`,
          'Share of each state’s product acres by segment, with its largest products and crops')}
        ${legend}
        <div style="display:grid;grid-template-columns:${gc};gap:10px;padding:8px 16px 10px;border-bottom:1px solid #EFEDE7">
          ${hdr.map(h=>`<span style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;${['Acres','Herb','Ins','Fung','Other'].includes(h)?'text-align:right':''}">${h}</span>`).join('')}</div>
        ${SG.rows.map((r,i)=>row(r,i,false)).join('')}
        ${SG.rows.length>1?row(SG.tot,0,true):''}`);
    }

    /* ---- focus-product daily trend, with the UPL/SWAL equivalents combined into one line ---- */
    const T=insProdTrend(A);
    let prodTrend='';
    if(!TX.loaded){
      prodTrend=card(`${cHead('How two products are moving','Day-level product tab')}${waiting(TX.error, TX.error?'Could not load the day-level product tab.':'Loading day-level products…','txretry')}`);
    } else if(!T || !T.options.length){
      prodTrend=card(`${cHead('How two products are moving','Day-level product tab')}${waiting(false,'No day-level product rows for this scope.','txretry')}`);
    } else {
      const chart=buildProdTrendSVG(T,mob);
      const opts=(cur,withNone)=>optionsHTML(
        (withNone?[{v:'none',t:'— none —'}]:[]).concat(T.options.map(o=>({v:o.key,t:`${o.disp} (${o.company})`}))),
        String(cur||(withNone?'none':'')));
      const sel="height:32px;border:1px solid #E9E6DF;border-radius:8px;background:#fff;padding:0 26px 0 11px;font-family:'Noto Sans';font-size:12.5px;color:#1B1A17;cursor:pointer;outline:none;max-width:190px";
      const picker=`<div style="display:flex;align-items:center;gap:${mob?'8px':'12px'};flex-wrap:wrap;padding:12px 16px">
          <span style="font-size:10px;font-weight:600;letter-spacing:.08em;color:#9C988F;text-transform:uppercase">Combine</span>
          <div style="position:relative"><select id="insPaSel" style="${sel}">${opts(T.a,false)}</select>${I.caret}</div>
          <span style="font-size:13px;color:#9C988F;font-weight:600">+</span>
          <div style="position:relative"><select id="insPbSel" style="${sel}">${opts(T.b||'none',true)}</select>${I.caret}</div>
        </div>`;
      const dir = T.trend==null ? null : T.trend>=0;
      prodTrend=card(`${cHead(`How two products are moving in ${E(A.gst?A.regionName:'all India')}`,
          `Daily scanned acres for the selected products added together · thin line is each day, thick line is the 7-day average`)}
        ${picker}
        <div style="display:flex;flex-wrap:wrap;background:#FBFAF8;border-top:1px solid #EFEDE7;border-bottom:1px solid #EFEDE7">
          ${big(E(T.label||'—'),'combined series', T.sel.length>1?'two products shown as one line':'one product')}
          ${big(fmt(T.total),'acres in the period', `${T.series.length} days`, C.orangeD)}
          ${big(fmt(T.last7),'last 7 days', T.prior7?`against ${fmt(T.prior7)} the 7 before`:'')}
          ${big(T.trend==null?'—':`${dir?'▲':'▼'} ${Math.abs(T.trend).toFixed(0)}%`,'direction', T.trend==null?'':(dir?'rising':'falling'), T.trend==null?C.ink:dir?C.act:C.brk)}
        </div>
        <div style="padding:6px ${mob?'2px':'8px'} 12px">${chart.has?chart.svg:waiting(false,'Not enough days to draw a trend.','txretry')}</div>`);
    }

    const note=`<div style="background:#FBFAF8;border:1px solid #E9E6DF;border-radius:14px;padding:13px 16px">
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;margin-bottom:7px">Why this page stops at state level</div>
        <div style="font-size:11.5px;color:#6E6A62;line-height:1.65">Everything here is <strong style="color:#46433d">state level</strong>, because the cumulative tab is the only place the sheet keeps a record day by day. What a cluster or an area manager did <em>during</em> a week that has already passed cannot be recovered — the machine sheet is written over every morning, so it can only ever show where people stand today, which is what the Season and Yesterday views are for. Getting weekly detail below state level would mean saving a copy of the sheet's running total once a week, which nobody does yet. Comparing with last year is sound even though the dates fall on different weekdays: any seven-day stretch contains each weekday once, so the difference evens out.</div></div>`;
    return `<div style="display:flex;flex-direction:column;gap:14px">
      ${header}${wHead}${dlWrap('wk-summary','The week in summary',hero)}${dlWrap('wk-season','Where the week left the season',posCard)}${dlWrap('wk-daily','The week day by day',shape)}${dlWrap('wk-states','States',states)}${dlWrap('wk-products','Products this week',prodWk)}${dlWrap('wk-segments','Product segments by state',segCard)}${dlWrap('wk-trend','Focus product trend',prodTrend)}${note}
      ${mob?`<div style="text-align:center;padding:2px 0 4px">${src}</div>`:''}</div>`;
  }

  /* ================= Yesterday mode =================
     Deliberately detector-led and deliberately NOT a second copy of the Yesterday (recap) view. Recap is the
     roster — what happened, completely, with leaderboards. This is the exceptions — what deviated and needs a
     call. Keeping leaderboards out of here is what stops the two pages competing. */
  if(mode==='yday'){
    const D=insDayAgg(A);
    const dayPct = (D.dayAc!=null && D.norm) ? D.dayAc/D.norm*100-100 : null;
    const runPct = D.deployed ? D.ran/D.deployed*100 : 0;
    const wetC=r=>r.rain!=null && r.rain>=INS_DAY.WET_MM;
    const dstat=(v,l,ink,sub)=>`<div style="flex:1 0 auto;min-width:${mob?'44%':'150px'};padding:13px 16px;border-right:1px solid #EFEDE7;border-bottom:1px solid #EFEDE7">
        <div style="font-family:'IBM Plex Mono';font-size:${mob?'18px':'20px'};font-weight:700;color:${ink||C.ink}">${v}</div>
        <div style="font-size:10px;font-weight:600;letter-spacing:.05em;color:#9C988F;text-transform:uppercase;margin-top:5px">${l}</div>
        ${sub?`<div style="font-size:10.5px;color:#B6B1A8;margin-top:3px">${sub}</div>`:''}</div>`;
    const band=card(`${cHead(`Yesterday · ${s?E(s.label):'—'}`,
        `From the machine sheet · ${A.gst?E(A.regionName):'all seven states'}`)}
      <div style="display:flex;flex-wrap:wrap;background:#FBFAF8">
        ${dstat(fmt(D.ran),'machines worked', runPct>=40?C.act:runPct>=20?C.idle:C.brk, `${Math.round(runPct)}% of the ${fmt(D.deployed)} deployed`)}
        ${dstat(fmt(D.acres),'acres sprayed',C.orangeD, D.ran?`${fmt(D.acres/D.ran)} acres each`:'')}
        ${dstat(dayPct==null?'—':`${dayPct>=0?'+':'−'}${Math.abs(Math.round(dayPct))}%`,'against a normal day', dayPct==null?C.ink:dayPct>=0?C.act:C.brk, D.norm?`a normal day is ${fmt(D.norm)} acres`:'')}
        ${dstat(D.prodY==null?'—':fmt(D.prodY),'acres traced to a product', C.ink, D.prodY!=null&&D.acres?`${Math.round(D.prodY/D.acres*100)}% of the day`:'')}
        ${dstat(fmt(D.idle),'machines idle', D.idle?C.brk:C.ink, D.deployed?`${Math.round(D.idle/D.deployed*100)}% of the deployed fleet`:'')}
      </div>`);

    /* ---- why the idle fleet didn't run: the account, not a judgement ---- */
    const bTot=D.buckets.reduce((a,x)=>a+x.n,0)||1;
    const bar=`<div style="display:flex;height:26px;border-radius:8px;overflow:hidden;background:#F2F0EB;margin-bottom:14px">
        ${D.buckets.map(x=>`<div title="${E(x.label)}" style="width:${x.n/bTot*100}%;background:${x.c}"></div>`).join('')}</div>`;
    const legend=D.buckets.map(x=>`<div style="display:flex;align-items:baseline;gap:9px;padding:7px 0;border-top:1px solid #F4F2EE">
        <span style="width:10px;height:10px;border-radius:3px;background:${x.c};flex-shrink:0;align-self:center"></span>
        <span style="font-size:12.5px;font-weight:${x.key==='unexplained'?700:600};min-width:0">${x.label}</span>
        <span style="font-size:11px;color:#9C988F;flex:1;min-width:0">${x.hint}</span>
        <span style="font-family:'IBM Plex Mono';font-size:12.5px;font-weight:700">${fmt(x.n)}</span>
        <span style="font-family:'IBM Plex Mono';font-size:11px;color:#B6B1A8;width:38px;text-align:right">${(x.n/bTot*100).toFixed(0)}%</span>
      </div>`).join('');
    const why=card(`${cHead(`Why ${fmt(D.idle)} machines did not work`,
        'Each machine is counted once, under the first reason that applies · the five add up to the idle total')}
      <div style="padding:14px 16px 12px">${bar}${legend}
        ${D.unexplainedN?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid #EFEDE7;font-size:11.5px;color:#6E6A62;line-height:1.6">The ${fmt(D.unexplainedN)} machines in the last group have covered <strong style="color:#46433d">${fmt(D.unexplainedCapability)} acres</strong> between them this season. They are working machines with drivers, and yesterday they stood still.</div>`:''}
      </div>`);

    /* ---- unexplained idle by cluster and by AM: ranked by machines, a count, never a modelled gap ---- */
    // An AM row is titled with the manager's own name; don't print it twice (see the same rule in sigRow).
    const ownerLine=(o,title)=>{
      if(!o||!o.name) return '';
      const dupe = title && title.indexOf(o.name)>=0;
      return `<div style="font-size:11px;color:#9C988F;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 8px">
        <span>${E(o.role)}${dupe?'':` <strong style="color:#6E6A62;font-weight:600">${E(o.name)}</strong>`}</span>
        ${o.phone?`<span style="font-family:'IBM Plex Mono'">${E(o.phone)}</span>`:''}</div>`;
    };
    const idleRow=(r,i,unit)=>`<div data-act="insdrill" data-key="${E(r.st)}" style="display:flex;gap:11px;padding:12px 16px;border-top:${i?'1px solid #F4F2EE':'none'};cursor:pointer">
        <span style="width:8px;height:8px;border-radius:50%;background:${wetC(r)?C.idle:C.brk};margin-top:5px;flex-shrink:0"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:700;line-height:1.35">${E(r.name)}${A.gst?'':' · '+E(STATE_NAMES[r.st]||r.st)} — ${fmt(r.n)} of ${fmt(r.deployed)} machines stood still</div>
          <div style="font-size:11.5px;color:#6E6A62;margin-top:3px;line-height:1.5">These machines have covered ${fmt(r.cap)} acres this season${r.ranAcres>0?`. The rest of the ${unit} covered ${fmt(r.ranAcres)} acres yesterday`:`. The rest of the ${unit} covered nothing either`}.${wetC(r)?` <span style="color:${C.openD}">${r.rain} mm of rain fell, which may be the reason.</span>`:(r.rain!=null?` Only ${r.rain} mm of rain fell.`:'')}</div>
          ${ownerLine(r.owner, r.name)}
        </div></div>`;
    const cl=D.clusters.slice(0,INS_DAY.SLOTS);
    const clusters = cl.length ? card(`${cHead('Which clusters they sit in',
        'Machines with a driver and a season record that reported in and still did nothing · most machines first')}
      ${cl.map((r,i)=>idleRow(r,i,'cluster')).join('')}`)
      : card(`${cHead('Which clusters they sit in','')}${waiting(false,'No cluster has three or more machines in this group.','insrefresh')}`);

    const amRows=D.ams.slice(0,INS_DAY.AM_SLOTS);
    const amCard = amRows.length ? card(`${cHead('Which area managers they report to',
        'The same machines rolled up one level · most machines first')}
      ${amRows.map((r,i)=>idleRow(r,i,'area')).join('')}`) : '';

    /* ---- where the work happened: participation + concentration, pure observation ---- */
    const wstat=(v,l)=>`<div style="flex:1 0 auto;min-width:${mob?'44%':'190px'};padding:13px 16px;border-right:1px solid #EFEDE7;border-bottom:1px solid #EFEDE7">
        <div style="font-family:'IBM Plex Mono';font-size:${mob?'18px':'20px'};font-weight:700">${v}</div>
        <div style="font-size:11px;color:#9C988F;margin-top:5px;line-height:1.45">${l}</div></div>`;
    const where=card(`${cHead('How the day was spread','Whether the acres came from across the country or from a few places')}
      <div style="display:flex;flex-wrap:wrap;background:#FBFAF8">
        ${wstat(`${fmt(D.terrActive)} of ${fmt(D.terrTotal)}`,'territories covered any acres at all')}
        ${wstat(`${Math.round(D.topShare)}%`,`of the day came from just ${INS_DAY.CONC_TOP} territories${D.topNames.length?` — ${D.topNames.map(E).join(', ')}`:''}`)}
        ${wstat(fmt(D.machinesForHalf),`machines covered half the day’s acres, out of the ${fmt(D.ran)} that worked`)}
      </div>`);

    const note=`<div style="background:#FBFAF8;border:1px solid #E9E6DF;border-radius:14px;padding:13px 16px">
        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#9C988F;text-transform:uppercase;margin-bottom:7px">How to read this page</div>
        <div style="font-size:11.5px;color:#6E6A62;line-height:1.65">Every number here is <strong style="color:#46433d">counted straight off a column</strong> in the machine sheet. Nobody is given an acre target for the day, because what a cluster does on one day need not match its share of the season. The single comparison on the page is against a normal day, which measures this scope against <strong style="color:#46433d">its own last fortnight</strong>. Rain is shown where it might explain a quiet day; it never changes an order. And all of it is one day, where the Season view is the whole year to date.</div></div>`;
    return `<div style="display:flex;flex-direction:column;gap:14px">
      ${header}${band}${why}${clusters}${amCard}${where}${note}
      ${mob?`<div style="text-align:center;padding:2px 0 4px">${src}</div>`:''}</div>`;
  }

  /* ---------- 1 · verdict ---------- */
  let hero;
  if(!s){
    hero=card(waiting(SNAKE.error,SNAKE.error?'Could not load the cumulative tab — the season verdict needs it.':'Reading the season…','snakeretry'));
  } else {
    const behind = s.vsPrev!=null && s.vsPrev<0;
    // The window is stated explicitly because the What-changed strip reports the SAME quantity over a shorter one,
    // and a four-week widening can sit on top of a one-week recovery. Naming both windows is the difference
    // between two views of one trend and two cards that appear to contradict each other.
    const turnWord = s.trendTurn==null ? '' : behind ? (s.trendTurn>0?'narrowed':'widened') : (s.trendTurn>0?'grown':'shrunk');
    const verdict = s.vsPrev==null ? 'Last season has no matching day to measure this against.'
      : `<strong style="font-weight:700">${fmt(Math.abs(s.gapAc))} acres ${behind?'behind':'ahead of'} last season</strong> on the same day of the year.`
        + (s.momentum!=null ? ` Over the past week the fleet covered ${Math.abs(Math.round(s.momentum))}% ${s.momentum>=0?'more':'less'} ground than in the same week last year` : '')
        + (turnWord ? `, and the ${behind?'gap':'lead'} has ${turnWord} over the past four weeks.` : s.momentum!=null?'.':'');
    const scopeNote = A.scoped
      ? `<div style="font-size:10.5px;color:#B6B1A8;margin-top:9px">Machine and product figures below are ${E(A.og)}-only. The season curve has no company split in the source and covers every machine.</div>` : '';
    hero=card(`<div style="padding:${mob?'16px':'18px 20px'}">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px">
        <span style="font-size:11px;font-weight:700;letter-spacing:.07em;color:#9C988F;text-transform:uppercase">Season to date · ${E(s.label)}</span>
        <span style="font-size:10.5px;color:#B6B1A8">FY 26-27 · 1 Apr → ${E(s.asOf)} · all crops, all companies</span>
      </div>
      <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
        <div style="font-family:'IBM Plex Mono';font-size:${mob?'34px':'44px'};font-weight:700;line-height:1;letter-spacing:-.02em">${fmt(s.cur)}<span style="font-size:${mob?'14px':'17px'};color:#B6B1A8;font-weight:500"> ac</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:6px;align-items:center">
          ${s.vsPrev!=null?`${dpill(s.vsPrev)}<span style="font-size:10.5px;color:#9C988F">vs ’25-26</span>`:''}
          ${s.vsPrev2!=null?`${dpill(s.vsPrev2)}<span style="font-size:10.5px;color:#9C988F">vs ’24-25</span>`:''}
        </div>
      </div>
      <div style="font-size:${mob?'12.5px':'13.5px'};color:#46433d;margin-top:12px;line-height:1.55">${verdict}</div>
      ${scopeNote}
      <div style="display:flex;gap:${mob?'18px':'34px'};flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid #F2F0EB">
        ${mini(s.prev!=null?fmt(s.prev):'—','last season, same day')}
        ${mini(s.prev2!=null?fmt(s.prev2):'—','two seasons ago, same day')}
        ${mini(s.roll7!=null?fmt(s.roll7):'—','acres a day, past week',C.orangeD)}
        ${mini(fmt(s.machToday),'machines worked yesterday')}
        ${mini(fmt(f.deployed),'machines deployed')}
      </div></div>`);
  }

  /* ---------- 1b · what changed (the one part of the page that recomposes daily) ---------- */
  const sig=insSignals(A);
  /* Two groups, each with its own visible budget and its own expand toggle. The peer rows name a cluster or an
